l_english:
 a_new_ireland: "A New Ireland"
 a_new_ireland_desc: "We have managed to reverse the main impact of the Irish Famine \napon our Country now Irelands Reborn as a new Ireland \nunburdened by the past!"
 hazz_irish_rework_aidbarb: "Aid Operation Barbarossa"
 hazz_irish_rework_aidbarb_desc: "We must Aid our Allys in this Holy War against Communism"
 hazz_irish_rework_aircorps: "Expand The Aircorps "
 hazz_irish_rework_aircorps_desc: "The Aircorps established in 1924 is the Aerial branch of our Military\nwe must expand apon it if we wish to have Air dominance"
 hazz_irish_rework_airreasearch: "Air Research Development"
 hazz_irish_rework_airreasearch_desc: "An Airforce is the greatest way to project power beyond our borders"
 hazz_irish_rework_allyspain: "Our Allies In Spain"
 hazz_irish_rework_allyspain_desc: "With Spain winning the Civil War they serve as our Perfect Ally we\nmust establish an Alliance with them as our staging ground into\nSouthern Europe and Africa"
 hazz_irish_rework_altalliancewithfra: "An Alternative Alliance"
 hazz_irish_rework_altalliancewithfra_desc: "We should not be a Brittish puppet anymore we must go a \ndifferent way and find a better Ally"
 hazz_irish_rework_alternativedirection: "An Alternative direction"
 hazz_irish_rework_alternativedirection_desc: "Democracy has left us in disaster and divided in 2, we must turn a \ndiffrent path if we wish to rejuvenate Ireland to a Greater Strength"
 hazz_irish_rework_alttra: "Alternative Trading Partners"
 hazz_irish_rework_alttra_desc: "Alternative trading Partmers to substitute our Trade from Britain"
 hazz_irish_rework_angloireindus: "Joint Anglo Irish Industry development"
 hazz_irish_rework_angloireindus_desc: "Together we can greater develop our Industry"
 hazz_irish_rework_armconn: "Expand Arms Industry in Connaught "
 hazz_irish_rework_armconn_desc: "We must Expand on our Arms Industry in Connaught"
 hazz_irish_rework_armydevelop: "Research and Army Development"
 hazz_irish_rework_armydevelop_desc: "We must invest in our research to have a modernized Army Navy and Airforce"
 hazz_irish_rework_artydev: "Artillery Development"
 hazz_irish_rework_artydev_desc: "Artillery is the true way to wage a war we must invest in it"
 hazz_irish_rework_axisallies: "Our Ideological Allies"
 hazz_irish_rework_axisallies_desc: "We should get Aid from Our Ideological Allies "
 hazz_irish_rework_axisgold: "Axis Gold"
 hazz_irish_rework_axisgold_desc: "Our Alliance with our Allies has led to great development from them!"
 hazz_irish_rework_catchuptogp: "Catchup to the Great Powers"
 hazz_irish_rework_catchuptogp_desc: "We must catchup to the other great powers if we wish to have a Army competing with them"
 hazz_irish_rework_cattle: "Expand on the Coal Cattle Trade"
 hazz_irish_rework_cattle_desc: "We must expand on our trade with Britain"
 hazz_irish_rework_celticeng: "Take back Alba Cymru and Kernow"
 hazz_irish_rework_celticeng_desc: "Alba Cymru and Kernow are our rightful lands of old!"
 hazz_irish_rework_celticfra: "Reclaim Breizh"
 hazz_irish_rework_celticfra_desc: "We must reclaim our rightful land of Breizh"
 hazz_irish_rework_celticheritage: "Our Celtic Heritage"
 hazz_irish_rework_celticheritage_desc: "We must follow the direction of our Heritage from the past and\nestablish something greater"
 hazz_irish_rework_celticspr: "Reclaim Galica and Asturias"
 hazz_irish_rework_celticspr_desc: "We must reclaim our rightful land of Galica and Asturias"
 hazz_irish_rework_commicoup: "Coup the Government"
 hazz_irish_rework_commicoup_desc: "We must not spend time waiting the time for Revolution is now\nwe must Coup the Government "
 hazz_irish_rework_corporatism: "State Corporatism"
 hazz_irish_rework_corporatism_desc: "Corporate groups should form the basis of our Society and of our\nState"
 hazz_irish_rework_countryside: "Invest in the Countryside"
 hazz_irish_rework_countryside_desc: "Investment in the Countryside will be Fruitful!"
 hazz_irish_rework_cpi: "The Communist Party of Ireland"
 hazz_irish_rework_cpi_desc: "After uniting various left-wing Political Factions into one force, we \nwill lead the Working Class to Prosperity"
 hazz_irish_rework_devlein: "Develop Leinster"
 hazz_irish_rework_devlein_desc: "We must Develop our Industry in Leinster"
 hazz_irish_rework_devmun: "Our Industry in Munster"
 hazz_irish_rework_devmun_desc: "We must Expand on our Industry in Munster"
 hazz_irish_rework_devni: "Reconstruction of our old land"
 hazz_irish_rework_devni_desc: "With the Reclamation of our old land we must not wait to Develop it!"
 hazz_irish_rework_doesmojilikepie: "Claim the last slice of Pie"
 hazz_irish_rework_doesmojilikepie_desc: "Africa has been fully carved up apart from a small little slice of Pie...\ndelicious"
 hazz_irish_rework_downiresteel: "Downsize Irish Steel"
 hazz_irish_rework_downiresteel_desc: "Downsizing Irish Steel is the best way to stabalize our Economy"
 hazz_irish_rework_ecoenvy: "An Economy for the world to Envy"
 hazz_irish_rework_ecoenvy_desc: "We have managed to turn a Lesser Economy into one the World Envys"
 hazz_irish_rework_ecoexp: "Quick Economic Expansion"
 hazz_irish_rework_ecoexp_desc: "Our Policies have allowed us to quickly modernize our Economy, Hurrah!"
 hazz_irish_rework_ecowonder: "The Irish Economy"
 hazz_irish_rework_ecowonder_desc: "Our Economy is starting to Flourish"
 hazz_irish_rework_eireact: "The Eire Act"
 hazz_irish_rework_eireact_desc: "With the Eire Act we can put an end to this Silly Trade War and in return be \ngranted back our Treaty Ports"
 hazz_irish_rework_emergencypowact: "The Emergency Powers Act"
 hazz_irish_rework_emergencypowact_desc: "We must pass the Emergency Powers Act if we wish to have control\nover our people at this time of war even if it is to the detrement of\nour rights "
 hazz_irish_rework_empowergovgen: "Empower The Govenor General"
 hazz_irish_rework_empowergovgen_desc: "The Governor Generals is offical representetive of the Irish Free State\nwe must empower them to a greater position"
 hazz_irish_rework_encimm: "Encourage Immigration"
 hazz_irish_rework_encimm_desc: "Ireland for years has had people immigrating to other countries now\nis the time to get people to Immigrate here instead to improve our\ndeclined population"
 hazz_irish_rework_engdifficulty: "England's Difficulty is Ireland's opportunity"
 hazz_irish_rework_engdifficulty_desc: "England is distracted now is our chance to launch a Suprise Attack \nwhen they are at their Weakest and reclaim Northern Ireland or \nmaybe more..."
 hazz_irish_rework_engiretrain: "Joint Anglo Irish Training "
 hazz_irish_rework_engiretrain_desc: "Utilising both of our Countries knowledge in Warfare we can\ngreatly strengthen our Armies"
 hazz_irish_rework_engpuppy: "Restore Dominion Status"
 hazz_irish_rework_engpuppy_desc: "Perhaps by being a Dominion of Britian again, however willingly we\ncan aim to get some concessions from them"
 hazz_irish_rework_engrubber: "Get rights to British rubber in Ceylon"
 hazz_irish_rework_engrubber_desc: "Britian has a large supply of Rubber across the World surely they\nwon't mind if we ask for a small supply ourselves?"
 hazz_irish_rework_eoin: "Eoin O'Duffy's movement"
 hazz_irish_rework_eoin_desc: "We should follow Eoin O'Duffy's movement only he can create\na stronger Ireland"
 hazz_irish_rework_expandbuild: "Building Expansion Act"
 hazz_irish_rework_expandbuild_desc: "Our expansion on Industry requires more space"
 hazz_irish_rework_expedarmy: "An Expeditonary Army"
 hazz_irish_rework_expedarmy_desc: "An Army based on not fighting on our on soil but on others where the war can't effect us"
 hazz_irish_rework_fascireaut: "Autarky"
 hazz_irish_rework_fascireaut_desc: "Ireland must be able to sustain itself if it truly seeks Greatness"
 hazz_irish_rework_fasireind: "Promote Irish Industry"
 hazz_irish_rework_fasireind_desc: "We should Promote our own Industry instead of looking for\nInvestments from others "
 hazz_irish_rework_foreigncommun: "Intergrate Foreign Communites "
 hazz_irish_rework_foreigncommun_desc: "Through our Policies Ireland has now become a place of many \nCommunites we must Intergrate these Communites if we wish \nto truly increase the Irish population"
 hazz_irish_rework_freeenglishppl: "Free the Peoples of Britain"
 hazz_irish_rework_freeenglishppl_desc: "The English have been Oppressing their Minorities for years now\nis the time to free time!"
 hazz_irish_rework_freethem: "Freedom from the French"
 hazz_irish_rework_freethem_desc: "The French have been Oppressing their Minorities for years now\nis the time to free time!"
 hazz_irish_rework_gatewaytoeuropa: "The Gateway to Europe"
 hazz_irish_rework_gatewaytoeuropa_desc: "Holland is known as the \"Gateway to Europe\" if we wish to spread\nthe Revolution we must go there first!"
 hazz_irish_rework_gaulllllls: "Remember Gaul"
 hazz_irish_rework_gaulllllls_desc: "We have done the Impossible now is time to go back to the past\nand remember something even greater!"
 hazz_irish_rework_happyire: "A Happy Ireland"
 hazz_irish_rework_happyire_desc: "Happy Ireland, Happy Life"
 hazz_irish_rework_idf: "The Irish Defence Force"
 hazz_irish_rework_idf_desc: "The Irish Defence force will ensure the Defence of our Island"
 hazz_irish_rework_ihatespanishpeople: "Bring back Revolution to Spain"
 hazz_irish_rework_ihatespanishpeople_desc: "We must bring back Revolution to Spain and restore the rightful\nGovernment of Spain"
 hazz_irish_rework_iloveenglishpeople: "Reconnect our ties with Britain"
 hazz_irish_rework_iloveenglishpeople_desc: "Britian is an external source of our Defence and a proud Empire\nwe should reconnect our ties with them to be on their good side"
 hazz_irish_rework_industrialeco: "An Industrialised Economy"
 hazz_irish_rework_industrialeco_desc: "Through Long term Development and sheer Will we have Established an \nIndustrialised Economy equal to the other Powers"
 hazz_irish_rework_innoarmy: "An Army of Innovation"
 hazz_irish_rework_innoarmy_desc: "An Army is not based on its resources but how you use them if we wish to wage effective war we must\nmake our Army one of innovation"
 hazz_irish_rework_investscien: "Investing in our Scientists "
 hazz_irish_rework_investscien_desc: "Long term investment has allowed for greater expansion apon our Research"
 hazz_irish_rework_ireastunion: "Irish Australian Union"
 hazz_irish_rework_ireastunion_desc: "To the shock of the World we have achieved it. now we must \nproclaim our Union as one of equals"
 hazz_irish_rework_ireconsti: "Establish the Constitution of Ireland"
 hazz_irish_rework_ireconsti_desc: "We must a establish a new constitution directly seperating our\nColonial ties with the United Kingdom"
 hazz_irish_rework_irefam1: "Recovering from the Irish Famine"
 hazz_irish_rework_irefam1_desc: "Although ending in 1852 the population decline from the past still \ngreatly impacts our Economy reversing this decline will take time but \nit will be worth the effort"
 hazz_irish_rework_irefam2: "Subsidies for Farmers"
 hazz_irish_rework_irefam2_desc: "Although ending in 1852 the population decline from the past still \ngreatly impacts our Economy reversing this decline will take time but \nit will be worth the effort subsidising Farmers will help ease this"
 hazz_irish_rework_irefam3: "Expand Rights"
 hazz_irish_rework_irefam3_desc: "Although ending in 1852 the population decline from the past still \ngreatly impacts our Economy reversing this decline will take time but \nit will be worth the effort expansion of worker rights will help to \nreverse the negative effects of the Famine"
 hazz_irish_rework_irefam4: "Promote the Irish Language"
 hazz_irish_rework_irefam4_desc: "Although ending in 1852 the population decline from the past still \ngreatly impacts our Economy reversing this decline will take time but \nit will be worth the effort promoting the Irish Language will improve\nnational pride and help to reverse the effects on our society from\nmemory of the Famine"
 hazz_irish_rework_iremonarchist: "Reach out to the Irish Monarchist Society"
 hazz_irish_rework_iremonarchist_desc: "Perhaps by reaching out to the Irish Monarchist Society we can \nbring stability back to Ireland"
 hazz_irish_rework_iresteel: "Invest In Irish Steel"
 hazz_irish_rework_iresteel_desc: "We are in dire need for Steel we must Invest in Irish Steel"
 hazz_irish_rework_irewhitepeace: "Ireland must give up for Peace"
 hazz_irish_rework_irewhitepeace_desc: "We are Beaten we must give up our goal of Northern Ireland in \nReturn for a White Peace with Britain"
 hazz_irish_rework_irewinner: "Peace for control of Northern Ireland"
 hazz_irish_rework_irewinner_desc: "Britian is on the run now is time to offer them to White Peace with\nus in return for granting us back our land of Northern Ireland"
 hazz_irish_rework_jointairnav: "Joint Naval Air Development"
 hazz_irish_rework_jointairnav_desc: "Combined our knowledge of Air and Naval research is great if we\nput together our knowledge in the 2 branches we can develop both\nat an unprecedented pace"
 hazz_irish_rework_largewelfarespending: "State Welfare spending "
 hazz_irish_rework_largewelfarespending_desc: "Provide for the People and they will Provide for you!"
 hazz_irish_rework_lovesussysoviets: "Support for the Soviet's"
 hazz_irish_rework_lovesussysoviets_desc: "The Soviets are our greatest Ally we should lend them a helping \nHand"
 hazz_irish_rework_macdonald: "The Macdonald Proposal"
 hazz_irish_rework_macdonald_desc: "Although not shared to the public there have been talks between \nthe United Kingdom and Ireland over Ireland aiding Britain in return\nfor the reclamation of Northern Ireland "
 hazz_irish_rework_macs: "Establish the Marine and Coastwatching Service"
 hazz_irish_rework_macs_desc: "Ireland has never been a Maritine Power if we ever wish to strike our enemies we must have a\nstrong presence at Sea"
 hazz_irish_rework_marineservice: "The Marine Service "
 hazz_irish_rework_marineservice_desc: "With a strong navy established we must improve our Land to Sea cooperation a strong Marine\nCorps means no Army can be safe from us no matter how far"
 hazz_irish_rework_millitisation: "Rapid Millitisation"
 hazz_irish_rework_millitisation_desc: "We must expand our Millitisation at a rapid pace to compete with the Great Powers"
 hazz_irish_rework_monopoly: "Create Monopolys "
 hazz_irish_rework_monopoly_desc: "Although unpopular we must create Monopolys to get businesses\non our side"
 hazz_irish_rework_muirchu: "Refit the Muirchu"
 hazz_irish_rework_muirchu_desc: "The Muirchu has been taken over from the Department of \nAgriculture and Fisheries if we are to Establish a fleet that can \nchallenge the great powers we must be able to refit\nships like the Muirchu for more fitting purposes"
 hazz_irish_rework_natdevelo: "National Development"
 hazz_irish_rework_natdevelo_desc: "Long term Development allows for a greater Economy"
 hazz_irish_rework_nateco: "Nationalization of the Economy"
 hazz_irish_rework_nateco_desc: "We must Nationalise parts of our Economy if we truly want to have\ncontrol of it"
 hazz_irish_rework_natguard: "Empower the National Guard"
 hazz_irish_rework_natguard_desc: "We do not need Allies we must go our own way"
 hazz_irish_rework_natrea: "National Research Program"
 hazz_irish_rework_natrea_desc: "We must Expand apon our Research"
 hazz_irish_rework_navadv: "Naval Advancements"
 hazz_irish_rework_navadv_desc: "Our Naval research is not up to date we must have great advance-\nments if we wish to compete with our foes"
 hazz_irish_rework_navalservice: "Naval Service"
 hazz_irish_rework_navalservice_desc: "To defend To defend both the State and its Maritime Resources we \nmust utilise our experience in both Naval and Marine Warfare to \ncreate a true Modern branch of the Irish Millitary"
 hazz_irish_rework_negotiate: "Negotiations with Britian"
 hazz_irish_rework_negotiate_desc: "Britain is our main trading partner we must negotiate with them again if we wish\nto have a prospering Economy"
 hazz_irish_rework_neutrality: "Neutrality "
 hazz_irish_rework_neutrality_desc: "Ireland is faced with a predicament our Economy is vunerable to Convoy Raiding and plans being \ndrawn up to invade us our safest bet is to follow Neutrality, it could have benefits on our Economy \nas well"
 hazz_irish_rework_new_claimaustralia: "Claim Australia"
 hazz_irish_rework_new_claimaustralia_desc: "Australia has a large Population of Irish people perhaps as we are\nboth Dominions of the British Crown we should seek Unification?"
 hazz_irish_rework_new_coopbritishexp: "Cooperation With British Expert's"
 hazz_irish_rework_new_coopbritishexp_desc: "Our Developments in Arms and Industry has impressed the British however \nby Cooperating with them we can truly Modernize Ourselves"
 hazz_irish_rework_new_focus_tree_focus_14: "Capitilise on British Exports"
 hazz_irish_rework_new_focus_tree_focus_14_desc: "British Exports are a great way to strengthen our Economy"
 hazz_irish_rework_new_focus_tree_focus_2: "Our Own Way"
 hazz_irish_rework_new_focus_tree_focus_2_desc: "We do not bow to the British we must Establish our own Economic System"
 hazz_irish_rework_new_focus_tree_focus_78: "Irish Diaspora"
 hazz_irish_rework_new_focus_tree_focus_78_desc: "There are many Communites of Irish People across the World we \nmust recognise that we are not a State just in our borders but a \nState of the World"
 hazz_irish_rework_new_ihatefrenchpeople: "The Spirit of the French Revolution"
 hazz_irish_rework_new_ihatefrenchpeople_desc: "It has been Years since the last true Revolution of France we must\nremind them of the past and Liberate them!"
 hazz_irish_rework_ourownpath: "Our Own Path"
 hazz_irish_rework_ourownpath_desc: "We must go our own way instead of joining others"
 hazz_irish_rework_ourwilllll: "Our Will"
 hazz_irish_rework_ourwilllll_desc: "Through demand of the people we have came into power, we are \nnot just a movement but a Will of all the Working Class People of \nthe World!"
 hazz_irish_rework_overseainvest: "Overseas Investment"
 hazz_irish_rework_overseainvest_desc: "We should request Investment from other Monarchys overseas"
 hazz_irish_rework_peacearmy: "A Peacetime Army"
 hazz_irish_rework_peacearmy_desc: "Our Army is not an offensive Army but one exclusively for our\nown Defence  "
 hazz_irish_rework_peoplesrevolt: "The Peoples Revolution"
 hazz_irish_rework_peoplesrevolt_desc: "The People have demanded Communists in charge of the \nGovernment who are we to say no to the Peoples Will?"
 hazz_irish_rework_purchasebrittany: "Purchase Brittany"
 hazz_irish_rework_purchasebrittany_desc: "Perhaps by offering France a small portion of our Industry (2 Civs)\nwe could Purchase Brittany from them?"
 hazz_irish_rework_radardev: "Radar Development"
 hazz_irish_rework_radardev_desc: "With our vunerability to Submarines we must develop in Radar to\ndefend our Coastline"
 hazz_irish_rework_rallyblueshirts: "Rally The Blueshirts"
 hazz_irish_rework_rallyblueshirts_desc: "The Blueshirts are the Irish Fascist movement perhaps by stirring\nup an Inncident we can get them to support our cause"
 hazz_irish_rework_republicantown: "Support from the Republican Congress"
 hazz_irish_rework_republicantown_desc: "We must Unify the factions joint together at the Republican \nCongress if we wish for a United Front against Capitalism"
 hazz_irish_rework_requestafricanland: "Request Control of minor African Colonies"
 hazz_irish_rework_requestafricanland_desc: "We should aid Britian in their control over Africa by requesting to \nhelp occupy some of their African Territory "
 hazz_irish_rework_requestnorthirelandmonarch: "Request Northern Ireland"
 hazz_irish_rework_requestnorthirelandmonarch_desc: "Now that we are once again a Dominion we must request unification\nwith Northern Ireland"
 hazz_irish_rework_restoresco: "Restore Scotland"
 hazz_irish_rework_restoresco_desc: "We must restore the old Kingdom of Scotland "
 hazz_irish_rework_selsuf: "Self-Sufficiency"
 hazz_irish_rework_selsuf_desc: "Ireland must be able to sustain itself if it truly seeks Independence"
 hazz_irish_rework_spreadrevolution: "Spread the Revolution"
 hazz_irish_rework_spreadrevolution_desc: "A true Revolution is not restricted by Borders we must expand to \nLiberate the Workers of the World"
 hazz_irish_rework_takerefugues: "Take In Refugues"
 hazz_irish_rework_takerefugues_desc: "We must take in Refugues from all the wars happening around the \nGlobe not only is this the moral thing to do but perhaps we can \nutilise these people for our own purposes "
 hazz_irish_rework_tankdevelopm: "Tank Development"
 hazz_irish_rework_tankdevelopm_desc: "Development of Tanks if the best way to utilise our large resources but limited population"
 hazz_irish_rework_tradeunions: "Empower the Trade Unions"
 hazz_irish_rework_tradeunions_desc: "We must empower our Trade Unions to create a truly great \nEconomic System"
 hazz_irish_rework_valway7: "De Valera's way"
 hazz_irish_rework_valway7_desc: "Eamon de Valera has served our Country as both the head of \nGovernment and the head of State we must follow his path if \nIreland is to prosper"
 hazz_irish_rework_volforces: "Irish Volunteer Forces"
 hazz_irish_rework_volforces_desc: "Instead of direct intervention in Wars we can more covertly support our cause through our\n\"Volunteers\""
 hazz_irish_rework_volspainrep: "Support for the Spanish Republicans"
 hazz_irish_rework_volspainrep_desc: "Instead of direct intervention in Wars we can more covertly support our cause through our\n\"Volunteers\""
 hazz_irish_rework_volspanat: "Support for the Spanish Nationalists"
 hazz_irish_rework_volspanat_desc: "Instead of direct intervention in Wars we can more covertly support our cause through our\n\"Volunteers\""
 hazz_irish_reworkcontrolofeco: "Take control of the Economy"
 hazz_irish_reworkcontrolofeco_desc: "In this desperate time we must take direct control of the Economy\n"
 the_irish_free_state: "The Irish Free State"
 the_irish_free_state_desc: "The Irish Free state was established in 1922 with our recent Indepe-\nndence we must now look inwards and decide what direction for our\nCountry to go"
