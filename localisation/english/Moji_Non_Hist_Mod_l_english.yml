 Idea_american_corporatism: "American Corporatism"
 Idea_american_corporatism_desc: "Industry and government are closely intertwined, prioritizing military production and corporate interests at the expense of innovation, civil freedoms, and democratic norms."
 Idea_late_war_industry: "Late Time War Industry"
 Idea_protestant_primacy: "Protestant Primacy"
 Idea_protestant_primacy_desc: "The state favors Protestant institutions and values, strengthening certain industrial sectors while deepening social tensions and political resistance."
 USA_bull_moose_interventionism_idea: "Legacy of the Bull Moose"
