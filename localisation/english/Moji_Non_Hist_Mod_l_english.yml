 # Focus Descriptions
 ENG_Developing_The_Royal_Armoured_Corps_desc: "Armoured warfare has become a decisive factor in modern conflict. By expanding and refining the Royal Armoured Corps, we can ensure Britain's armored forces are ready for the wars of the future."
 ENG_develop_guyana_bauxite_deposits_desc: "The bauxite reserves of British Guyana represent a valuable source of aluminium. Developing these deposits will strengthen our industrial base and support aircraft and vehicle production."
 ENG_develop_support_companies_desc: "Modern armies rely on more than just frontline troops. By developing specialized support companies, we can improve logistics, engineering, and battlefield coordination."
 ENG_fortify_eastern_possessions_desc: "Our territories in Hong Kong and British Malaya stand exposed to the growing ambitions of rival powers in the Far East. By expanding coastal defenses, improving fortifications, and reinforcing key naval facilities, we can secure these vital colonies and safeguard the trade routes that sustain the Empire's presence in Asia."
 ENG_Fortity_El_Alamein_desc: "By strengthening the defenses at El Alamein, we can turn the Egyptian desert into a decisive barrier against any advance from the west."
 ENG_improve_military_technology_desc: "Technological superiority has long been one of Britain's greatest strengths. Investing in new weapons and doctrines will ensure our forces remain effective against any potential adversary."
 ENG_improve_our_firepower_desc: "Victory on the battlefield often depends on overwhelming firepower. Improving our artillery will give British forces the edge they need in combat."
 ENG_influence_siam_desc: "Although the Siamese government has long guarded its independence against foreign influence, its position between rival powers leaves it increasingly isolated. If we extend diplomatic and economic support, London may guide Bangkok toward policies favorable to British interests in Asia, strengthening stability in the region and securing our strategic routes."
 ENG_interventionism_desc: "Britain can no longer afford isolation. To protect our interests and maintain global stability, we must be ready to intervene beyond our shores."
 ENG_promote_mobilization_desc: "In an age of total war, the nation must be ready to mobilize its resources at a moment's notice. Encouraging preparedness and expanding our mobilization efforts will strengthen Britain's ability to respond to crisis."
 ENG_Secure_Imperial_Supply_Lines_desc: "Our merchant fleets are the lifeblood of the Empire, carrying vital supplies across hostile seas. By bolstering convoy escorts, deploying additional naval patrols, and hunting enemy raiders, we can ensure that troops and resources reach their destinations safely. A well-protected supply line is the backbone of Britain's global power."
 ENG_Secure_Ireland_desc: "While Ireland remains formally independent, its strategic position binds its fate closely to our own. In an age of total war, neutrality may no longer be enough. We must act to guarantee that Ireland's territory is aligned with the defense of Britain and the Empire."
 ENG_secure_strategic_war_material_desc: "Access to vital resources cannot be left to uncertainty. British Malaya is essential to our war industry, and securing its output may require decisive action, even in the face of local resistance. By bringing these resources firmly under our control can we guarantee the continued strength of the British war effort."
 ENG_support_war_college_desc: "Proper training and education are essential to producing capable officers. Expanding and supporting our war colleges will help develop the strategic minds needed to command Britain's forces in modern war."
 ENG_The_British_Armed_Forces_desc: "The changing nature of modern warfare demands a comprehensive review of Britain's armed forces. By preparing our army, for the conflicts ahead, we can ensure they remain capable of defending the Empire in a time of growing uncertainty."
 ENG_10_year_policy_desc: "In the aftermath of the Great War, the British government adopted the assumption that the Empire would not face a major conflict for at least a decade. Defence planning and budgets were therefore drawn up on the belief that another great war was unlikely in the near future, allowing military spending to be reduced and long-term armament programmes postponed.\n \nWhile this policy eased the financial burdens of peace, it left the armed forces under-prepared for the rapidly changing international situation, as potential threats re-emerged faster than expected.\n \nThis will disappear in the break out of a world war or if Germany does the focus §YRally the Wehrmacht§!"
 ENG_reach_out_to_italy_desc: "Italy's position in the Mediterranean makes it a key player in the balance of power. Though our claims overlap we both seek to contain the rising German threat. By reaching out to Italy we can maybe find common ground and forge an alliance that will contian Germany and secure our position in the Mediterranean."
 ENG_sphere_of_influence_over_france_desc: "For centuries, our peoples lived in the belief that we were hereditary enemies with incompatible interests. But we can surely reach an agreement if we just define our spheres of influence—leaving the East to Berlin, while London reclaims its ancient continental Angevin legacy without interference."
 ENG_establish_claims_on_germany_desc: "With our alliance with Italy, we have a strong position to assert our claims on Germany. By pressing our historical and strategic interests, we can secure Hanover and other key territories, ensuring that Germany's resurgence does not come at our expense."
 ENG_declare_the_second_angevin_empire_desc: "The Angevin Empire once spanned from the British Isles to the Mediterranean, a symbol of our historical greatness. By declaring the Second Angevin Empire, we can assert our rightful place in Europe and rally support for our vision of a restored British dominance on the continent."

