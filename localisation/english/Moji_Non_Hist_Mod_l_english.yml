 #Events
 LetsSplitFrance.1.t: "Britain wants to discuss sphere of influence over France"
 LetsSplitFrance.1.d: "The British Foreign Secretary has arrived in Berlin to meet Adolf Hitler in an effort to settle outstanding questions concerning Western Europe. While London acknowledges Germany's growing position on the continent, His Majesty's Government hopes that a clear understanding can prevent unnecessary rivalry between our nations.\n\n British diplomats have pointed to the centuries-old Angevin dominions, arguing that the western reaches of France have long occupied a unique place in English history. Although they make no claim to the entirety of France, they insist that Normandy, Anjou, Aquitaine, and the Atlantic coast represent a natural sphere of British strategic and historical interest.\n\n In return, the British government is prepared to recognize Germany's predominance over the remainder of France, accepting Berlin's leading role on the continent so long as Britain's historic interests are respected."
 LetsSplitFrance.1.a: "Yeah, sure, whatever you say..."
 LetsSplitFrance.1.b: "Who let this diplomat in here? Get him out!"

 LetsSplitFrance.2.t: "Germany accepts our claims on France" 
 LetsSplitFrance.2.d: "After tense negotiations, Germany has agreed to recognize Britain's claims on the western regions of France, including Normandy, Anjou, Aquitaine, and the Atlantic coast. This agreement establishes a clear division of influence in France, with Britain acknowledged as having a special interest in the west while Germany retains predominance over the rest of the country. The two powers have agreed to respect this arrangement and avoid unnecessary rivalry in the future."
 LetsSplitFrance.2.a: "Great, now we can focus on the real enemy..."

 LetsSplitFrance.3.t: "Germany rejects our claims on France"
 LetsSplitFrance.3.d: "Germany has rejected Britain's claims on the western regions of France, refusing to acknowledge any special interest for Britain in the country. This rejection challenges Britain's historical ties to these regions and raises tensions between the two powers."
 LetsSplitFrance.3.a: "We will not let this go unchallenged!"

 ItalyGetsFreeStates.1.t: "Our Alpine Claims..."
 ItalyGetsFreeStates.1.d: "With our alliance with the British Empire they have agreed to reconize our claims on lower Germanian territories. With this they also will claim the region of Hanover as historically belonging to them. This has been a great victory for our diplomatic efforts and will allow us to expand our influence in the region."
 ItalyGetsFreeStates.1.a: "A great day for Italia!"

 SeekAllianceWithItaly.1.t: "The Anglo-Italian Pact"
 SeekAllianceWithItaly.1.d: "Our diplomats have proposed a formal alliance with Italy. The Mediterranean balance of power hangs in the balance — if Rome agrees, we secure our southern flank and gain a powerful continental partner. The offer has been dispatched."
 SeekAllianceWithItaly.1.a: "Send the offer to Rome."
 SeekAllianceWithItaly.2.t: "A British Proposal"
 SeekAllianceWithItaly.2.d: "London has extended a formal offer of alliance. The British seek to bind Italy to their cause and secure the Mediterranean. We must decide how to answer — an outright acceptance, a refusal, or perhaps we can turn this to our advantage and press our claims in the Mediterranean first."
 SeekAllianceWithItaly.2.a: "We accept. Italy stands with Britain."
 SeekAllianceWithItaly.2.b: "We refuse. Italy's destiny lies elsewhere."
 SeekAllianceWithItaly.2.c: "We will ally — but Britain must first recognise our Mediterranean claims."
 SeekAllianceWithItaly.3.t: "Italy Refuses the Pact"
 SeekAllianceWithItaly.3.d: "Rome has rejected our offer of alliance. Mussolini's government shows no interest in aligning with Britain at this time. We must look elsewhere to secure our position in the Mediterranean."
 SeekAllianceWithItaly.3.a: "A disappointing answer. We will manage without them."
 SeekAllianceWithItaly.4.t: "The Anglo-Italian Pact is Signed"
 SeekAllianceWithItaly.4.d: "Italy has agreed to our terms. The Anglo-Italian Pact is now in force — Rome and London stand together. Our position in the Mediterranean is greatly strengthened, and a capable partner joins our cause."
 SeekAllianceWithItaly.4.a: "Excellent. A new chapter begins."
 SeekAllianceWithItaly.5.t: "Italy's Price for the Pact"
 SeekAllianceWithItaly.5.d: "Rome has not refused — but they have not agreed unconditionally either. Italy demands that Britain formally recognise their territorial ambitions in the Mediterranean before any pact is signed. It is a bold ask. We must decide whether the alliance is worth the cost."
 SeekAllianceWithItaly.5.a: "Agreed. Britain recognises Italy's Mediterranean claims."
 SeekAllianceWithItaly.5.b: "We cannot accept such demands. The offer is withdrawn."
 SeekAllianceWithItaly.7.t: "Britain Accepts Our Terms"
 SeekAllianceWithItaly.7.d: "London has agreed to recognise Italy's rightful claims in the Mediterranean. With our interests secured, the Anglo-Italian Pact is now signed. The Mediterranean shall know Italian strength, backed by the weight of the British Empire."
 SeekAllianceWithItaly.7.a: "The Pact is sealed. Italy's future is bright."
 SeekAllianceWithItaly.8.t: "Britain Rejects Our Terms"
 SeekAllianceWithItaly.8.d: "London has refused to recognise our claims in the Mediterranean. Without that assurance, there can be no pact. Britain has shown that they do not respect Italian ambitions — we will seek our destiny by other means."
 SeekAllianceWithItaly.8.a: "So be it. Italy walks alone."

 SeekAllianceWithItaly.100.t: "The Anglo-Italian Pact Signed"
 SeekAllianceWithItaly.100.d: "In a landmark diplomatic development, Great Britain and Italy have concluded a formal pact of alliance. The agreement, brokered between London and Rome, is expected to reshape the balance of power in the Mediterranean and signal a new era of cooperation between the two powers. Observers across Europe watch closely as the ink dries on what may prove to be one of the defining alliances of the age."
 SeekAllianceWithItaly.100.a: "The Empire stands stronger with Italy at our side."
 SeekAllianceWithItaly.100.b: "Rome and London — a partnership for the ages."
 SeekAllianceWithItaly.100.c: "A powerful new bloc emerges in the Mediterranean."

