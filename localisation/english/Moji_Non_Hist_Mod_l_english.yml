 # Focus Descriptions
 FRA_implement_austerity_measures_desc: "The only way to get our fiscal situation in order and get out of the depression is by balancing the budget with austerity measures."
 FRA_compulsory_cartelization_desc: "The depression has revealed many factories to be uncompetitive and inefficient. We must force these uncompetitive factories to combine into larger state-sanctioned cartels."
 FRA_streamline_production_cost_desc: "We will prioritize production output over quality of our equipment."
 FRA_surpress_trade_union_opposition_desc: "The trade unions in particular has mounted substantial resistance to our austerity measures in forms of strikes, if we want our factories back up and running, we must crack down on the trade unions."
 FRA_adopt_laissez_faire_economics_desc: "Laissez faire economics has proven to be the most efficient economic model at fostering economic growth. To not use it would be simply ridiculous."
 FRA_copy_the_new_deal_desc: "As a result of the great depression, many economists, such as John Keynes have suggested that substantial government spending is the best way to restart an economy. It has already been implemented in the USA via the new deal with great success. We will therefore implement a similar French new deal."
 FRA_fund_hydroelectric_projects_desc: "As part of the massive public works programmes, we will fund construction of hydroelectric plants which would supply us with significant amounts of energy."
 FRA_national_housing_programmes_desc: "Another part of our public works programmes will be large scale housing efforts which would also supply the less fortunate with affordable shelter."
 FRA_increase_top_marginal_tax_rate_desc: "Government spending has increased significantly with the public works programmes and it is becoming unsustainable. We must increase our revenue by taxing those who already have more than enough."
 FRA_invite_french_settlers_desc: "Inviting French settlers to settle in Algeria would speed up integration efforts."
 FRA_combat_colonial_illiteracy_desc: "Our colonial empire is plagued with illiteracy which significantly hinders our modernization effort. We must root out colonial illiteracy."

