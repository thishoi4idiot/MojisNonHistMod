 # Focus Descriptions
 POL_proclaim_zapadoslavia_desc: "With Czechoslovakia now firmly under Polish control, the possibility of a broader Western Slavic union has emerged. By proclaiming Zapadoslavia, we can unite these lands under a single banner and solidify Poland's leadership among the Western Slavs."
 POL_restore_russia_desc: "With the second russian civil war raging and the country in chaos, we have the opportunity to restore Russia to its former glory. By intervening in the conflict and supporting a rightful government we can restore monarchcy and order to Russia and destroy communism once and for all."
 POL_unlock_zapadoslavia_decisions: "Unlocks §YDecisions§! to Form §YZapadoslavia§!"

 # Events
 pol_russia.1.t: "A Question of Survival"
 pol_russia.1.d: "Poland stands at a crossroads. Russia looms to the east — powerful, vast, and unpredictable. Should we seek to bind ourselves to them, or dissolve ourselves into their empire entirely?"
 pol_russia.1.a: "Propose a formal alliance with Russia."
 pol_russia.1.b: "Request that Russia annex Poland entirely."
 pol_russia.2.t: "Poland Seeks an Alliance"
 pol_russia.2.d: "The Polish government has approached us with a formal proposal for an alliance. How shall we respond?"
 pol_russia.2.a: "We welcome this partnership."
 pol_russia.2.b: "We have no interest in this."
 pol_russia.3.t: "Poland Requests Annexation"
 pol_russia.3.d: "In a stunning diplomatic move, Poland has formally requested to be absorbed into Russia. This is an extraordinary offer."
 pol_russia.3.a: "Poland shall become part of Mother Russia."
 pol_russia.3.b: "We will not absorb Poland at this time."
 pol_russia.4.t: "Russia Accepts Our Alliance"
 pol_russia.4.d: "Russia has agreed to our alliance proposal. A new pact is born — Poland is no longer alone."
 pol_russia.4.a: "Long live the Russo-Polish friendship!"
 pol_russia.5.t: "Russia Refuses Our Alliance"
 pol_russia.5.d: "Russia has declined Poland's offer of alliance. We must look elsewhere for security."
 pol_russia.5.a: "We must seek other allies..."
 pol_russia.6.t: "Russia Accepts — Poland Is No More"
 pol_russia.6.d: "Russia has accepted our offer. Poland formally dissolves itself into the Russian state. A nation ends, so that its people may endure."
 pol_russia.6.a: "Poland yields to Russia."
 pol_russia.7.t: "Russia Refuses Annexation"
 pol_russia.7.d: "Russia has rejected our offer to be annexed. We remain independent — for now."
 pol_russia.7.a: "Russia will not protect us... we are on our own."

