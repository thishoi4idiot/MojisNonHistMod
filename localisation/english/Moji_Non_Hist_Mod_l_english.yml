 # Focus Descriptions
 FRA_ally_the_netherlands_desc: "We have an opportunity to make strong allies out of the Netherlands with an offer of giving them the Flemish portion of the failed Belgian state, building stronger ties than ever, and safe-guarding the lowlands as two allies strengthening each other against a resurgent German state....."
 FRA_ally_the_netherlands_tt: "Following this path, granting initial concessions will allow us to integrate them later."
 FRA_bring_back_the_helvetic_republic_desc: "Helveticia was carved by French hands to guard the Empire's heart. Its so-called neutrality is a betrayal of history. The Alps must once more echo with the authority of France."
 FRA_Colonial_Ambitions_desc: "France's future lies beyond Europe as much as within it. By strengthening control over overseas territories and expanding colonial influence, the nation will secure vital resources, manpower, and strategic depth for its empire."
 FRA_Connect_the_Maghreb_Territories_desc: "With Algeria transforming into core part of the French nation, we should look towards expanding our civilizing efforts to neighboring areas and bring them up to the standard of Algeria."
 FRA_demand_spanish_submittion_desc: "Spain once lay within the French imperial sphere during the age of Napoleon. To restore France's rightful order in Europe, Madrid must again accept that it is within the French sphere of influence if possible, by force if not."
 FRA_ending_the_buffer_state_desc: "Siam's role as a buffer state weakens French authority in Indochina. By ending this arrangement, the restored Orléanist monarchy will secure its colonial frontiers and expand royal influence in Southeast Asia."
 FRA_expanding_into_china_desc: "The Orléanist monarchy seeks to extend France's influence in China. By establishing a stronger presence, France will secure trade, resources, and strategic footholds for the crown in East Asia."
 FRA_expanding_mediterranean_holdings_desc: "The many islands that sit in the Mediterranean have always been key military strongholds, with many French crusader orders such as the Knights of Malta, Knights Hospitaller, and Knights Templar using them to great effect in their cause, we shall take example..."
 FRA_fascist_economics_desc: "The state must take direct control of the economy, subordinating private interests to national strength. Through corporatist planning, state direction of industry, and close cooperation between government and enterprise, France will mobilize its full economic potential in service of the nation and its destiny."
 FRA_integrating_the_spanish_crown_desc: "With Spain secured, its crown and institutions will be absorbed into our own, integrating Iberian administration while eliminating guerrilla resistance to firmly bind the peninsula to the state."
 FRA_intervene_in_mexico_desc: "France has previously sought to extend royal influence in Mexico, and the restoration of the monarchy revives this ambition. Through intervention, the Orléanist regime can expand its authority in the Americas and establish a friendly, monarch-aligned government."
 FRA_press_distant_claims_desc: "France's historical claims in the Americas remain a source of national pride. By pressing these claims, the Orléanist monarchy can assert its influence, reclaim lost territories, and strengthen France's position in the Western Hemisphere."
 FRA_Rapid_Military_Rearmament_desc: "France can no longer afford hesitation in the face of growing threats. By accelerating expanding armament facilities and accelerating Rearmament, the nation will rapidly rebuild its armed forces and prepare for imminent conflict."
 FRA_victors_of_wwi_reformed_desc: "Having emerged victorious from the Great War, the army has developed a dangerously complacent attitude which causes strategic developments to come slowly and with some reluctance."
 FRA_reclaim_italian_sister_republics_desc: "Northern Italy once stood reorganized under French guidance, its republics bound to Paris by revolution and empire alike. Their loss was a humiliation of defeat. To complete the Napoleonic restoration, these sister republics must be reclaimed by force of arms."
 FRA_reclaim_italian_sister_republics_tt: "Unlocks §YDecisions§! to establish sister republics in §YItaly§! and reintegrate parts of the §YFrench Empire§!"
 FRA_reclaim_the_holy_land_desc: "The holy land of Jerusalem holds much history pertaining to French kings. For the glory of god France and her Kings had sponsored many of the crusades with large sums of money. Maybe its time for France, for one last time, to fight to retake it in an effort to spare it from Islam, and rising Zionism..."
 FRA_reclaim_the_spanish_netherlands_desc: "The creations that occupy the Lowlands are weak mistakes, we should look towards restoring our distant dynastic claims from what spawned out a rebellious rabble."
 FRA_reconquest_of_the_caribbean_desc: "The Caribbean was once a jewel of the French crown. By reclaiming these territories, the restored monarchy will secure vital sea lanes, strengthen royal influence in the Atlantic, and revive France's imperial legacy."
 FRA_reestablish_eastern_duchys_desc: "The grand duchies of Eastern Europe were once under French influence, serving as buffer states and allies. Their restoration will strengthen France's position in the region and reassert our historical claims."
 FRA_reestablish_eastern_duchys_tt: "Unlocks §YDecisions§! to establish grand duchies in §YEastern Europe§!"
 FRA_reistablish_of_the_sister_republics_desc: "The French Revolution and the Empire once reshaped Europe through loyal sister republics and directly governed territories. Though that order collapsed, its foundations remain. France may now choose to reestablish friendly republics beyond its borders—or fully reintegrate lands that were once undeniably French. The Napoleonic order can be rebuilt, piece by piece."
 FRA_reistablish_the_batavian_republic_desc: "A direct administration of the Dutch would work best for the French empire, allowing us to immediately push the frontier to its natural extent in the region and giving us direct supervision of the Dutch and their affairs."
 FRA_reistablish_the_sister_republics_desc: "Stability returns to Europe only when France shapes it. The sister republics shall be reestablished as instruments of French power and guardians of the imperial order."
 FRA_reistablish_the_sister_republics_tt: "Unlocks §YDecisions§! to establish sister republics and reintegrate parts of the §YFrench Empire§!"
 FRA_retake_wallonia_desc: "The lands of Belgium contain a patchwork of mixed cultures, with a large area consisting of French Walloons stripped from us to artificially strengthen the Netherlands and kept independent through intervention of other powers, we now finally have a chance to regain these territories and push the French Frontier"
 FRA_retaking_louisiana_desc: "Louisiana stands as a symbol of France's lost royal domain in North America. By reclaiming it, the House of Orléans will restore historic lands of the crown, project power across the Atlantic, and reaffirm France's dynastic legacy."
 FRA_slum_clearings_desc: "Southern France holds significant untapped industrial and infrastructural potential. By investing in infrastructure and regional industry the state will integrate the south more fully into the national economy and strengthen France's economic capacity"
 FRA_the_old_enemy_desc: "The memory of Waterloo still lingers in the French national spirit. Now we have the chance to restore our honor and avenge that historic defeat."
 FRA_the_tenth_crusade_desc: " In a marriage on convenience, Constantinople, the capital and symbolic center of Orthodox Christianity, is yet still under the rule of Turks. This is a chance to reclaim our title as protector of Balkan Christians, return the Roman capital to Christianity....and secure vital resources"
 FRA_unite_iberia_desc: "With the restoration of a legitimate royal in Spain, friendly to France, we should look towards securing our influence in the peninsula and at the same time strengthen our dear ally."

 # Events
 frenchdemandsofchina.1: "The French Demand Southern Expansion"
 frenchdemandsofchina.1.t: "France Demands Expansion in Southern China"
 frenchdemandsofchina.1.d: "The restored Orléanist monarchy has turned its attention to southern China, seeking to expand French influence and secure strategic concessions. Citing historic interests and the need to protect French authority in Asia, Paris now issues formal demands, expecting compliance in the name of stability and order."
 frenchdemandsofchina.1.a: "Let them have their fun"
 frenchdemandsofchina.1.b: "Let them come!"
 frenchdemandsofchina.2: "China yields"
 frenchdemandsofchina.2.t: "China yields"
 frenchdemandsofchina.2.d: "Faced with diplomatic pressure and the threat of French intervention, the Chinese government has chosen to yield to the demands of the Orléanist monarchy. Concessions in the south mark a further expansion of French influence in East Asia and a clear victory for the authority of the crown."
 frenchdemandsofchina.3: "China Refuses our demands!"
 frenchdemandsofchina.3.t: "China Refuses our demands!"
 frenchdemandsofchina.3.d: "China has rejected the demands issued by the Orléanist monarchy, refusing to submit to French expansion in the south. This defiance challenges the authority of the crown and leaves France with a choice between accepting the insult or enforcing its will by other means."
 frenchdemandsofchina.3.a: "Let the Century of Humiliation Continue"
 frenchspanishdemands.1.t: "The French Empire demands Catalonia and our Vassalage"
 frenchspanishdemands.1.d: "The French Empire demands our vassalage and seeks to expand her sphere at the expense of spain. Now the question is do we fight for our lands or accept french dominance?"
 frenchspanishdemands.1.a: "Its hopeless..."
 frenchspanishdemands.1.b: "Spain will not be controlled by French frogs!"
 frenchspanishdemands.2.t: "Spain Submits!"
 frenchspanishdemands.2.d: "The Spanish after much preasure have capitulated to our will and gave in to all of our demands shocking the French Ambassador"
 frenchspanishdemands.2.a: "I can't believe that worked!"
 frenchspanishdemands.3.t: "Spain Defiant!"
 frenchspanishdemands.3.d: "Spain even after much preasure has decided that they were not willing to join the French Sphere."
 frenchspanishdemands.3.a: "Let them say that while they stand..."
 frenchswissdemands.1.t: "French demand our Subjugation"
 frenchswissdemands.1.d: "With the proclamation of the French Empire, Paris now seeks to restore its lost territories to their fullest extent at Switzerland's expense. The French demand our vassalage and the cession of western Switzerland. The question before us is clear: do we submit, or fight for our freedom?"
 frenchswissdemands.1.a: "Today is a dark day for Europe..."
 frenchswissdemands.1.b: "We must protect our neutrality at all costs!"
 frenchswissdemands.2.t: "Switzerland Submits!"
 frenchswissdemands.2.d: "With our demands delivered to Bern, we awaited the Swiss response with measured patience. Today, the Swiss Ambassador has returned with their answer: Switzerland will accept vassalage under the French Empire and cede western Switzerland without resistance. The Alps will no longer shield them from history."
 frenchswissdemands.2.a: "They have chosen wisely."
 frenchswissdemands.3.t: "Switzerland Defiant!"
 frenchswissdemands.3.d: "Our ultimatum has been rejected. Cloaked in talk of neutrality and independence, the Swiss have chosen defiance over submission. They believe the mountains will protect them, as they once did—but the era of hesitation is over. The French Empire will not be denied."
 frenchswissdemands.3.a: "Show them there was no choice..."
 netherlandsfrenchallience.1.t: "Proposal for a French Alliance?"
 netherlandsfrenchallience.1.d: "Although we are proponents of perpetual neutrality, the recent ascension of Napoleon IV to the French throne, along with the conquest of Belgium and Luxembourg, has raised a critical question: should we align ourselves with the French Emperor, or should we go our own way, knowing that war is certain if we do..."
 netherlandsfrenchallience.1.a: "lets agree while we still can..."
 netherlandsfrenchallience.1.b: "We will not give up our neutrality!"
 netherlandsfrenchallience.2.t: "They accepted our offer!"
 netherlandsfrenchallience.2.d: "After much preasure from us, the Dutch have accepted our offer that in exchange for them becoming a vassal and giving up all of their colonies to us they will get to unify with all other ductch speaking peoples"
 netherlandsfrenchallience.2.a: "litte do they know our true intentions"
 netherlandsfrenchallience.3.t: "They denied our Approaches"
 netherlandsfrenchallience.3.d: "After much debate it was decided that the Dutch would go their own way and would rather be neutral then join Napoleon IV and his empire as a sister republic"
 netherlandsfrenchallience.3.a: "Show them that they had no choice"
 netherlandsfrenchallience.4.t: "The Dutch Question..."
 netherlandsfrenchallience.4.d: "Today it was discovered that the Dutch have decided to ally with the rising French Empire, in defiance of London's foreign policy wishes. The question now remains as to what shall happen to their colonies—namely the East Indies, whether we should seize and administer them until a friendly French government emerges, or whether we should refrain from interfering in French colonial ambitions."
 netherlandsfrenchallience.4.a: "Let history repeat itself..."
 netherlandsfrenchallience.4.b: "Interfering would damage our relations with the french."
 netherlandsfrenchallience.5.t: "The British seize the East Indies!"
 netherlandsfrenchallience.5.d: "After Holland's capitulation to our government, the British decided to take her colonies away until a friendly government emerges."
 netherlandsfrenchallience.5.a: "Those Bastards!"
 netherlandsfrenchallience.6.t: "The Question of Suriname..."
 netherlandsfrenchallience.6.d: "Similar to the East Indies, Suriname is now part of the French Empire against the will of London. The question is whether we should take it for ourselves until the Dutch return to a state of normalcy, or whether we should refrain from interfering in the affairs of South America."
 netherlandsfrenchallience.6.a: "Let those resources not be left to waste!"
 netherlandsfrenchallience.6.b: "Let not concern ourselves with an occupation of Suriname"
 netherlandsfrenchallience.7.t: "The Loss of Suriname"
 netherlandsfrenchallience.7.d: "After much chaos following Holland's decision to join us, the British once again seized more Dutch colonies until a new government emerges that aligns with London's foreign policy."
 netherlandsfrenchallience.7.a: "We will be back!"
 netherlandsfrenchallience.8.t: "An opportunity in Curaçao"
 netherlandsfrenchallience.8.d: "Given the chaos surrounding the Netherlands' capitulation to French ambitions, an opportunity has presented itself in Curaçao. With London seizing other Dutch holdings, the question arises: should we seize Curaçao for ourselves given the chaos, along with its rich oil deposits?"
 netherlandsfrenchallience.8.a: "Let us walk in as liberators..."
 netherlandsfrenchallience.8.b: "Lets not provoke the wrath of France"
 netherlandsfrenchallience.9.t: "Venezuela siezes Curaçao!"
 netherlandsfrenchallience.9.d: "Amid the collapse of Dutch authority and the distraction of the great powers, Venezuelan forces have moved swiftly to seize Curaçao. The occupation places the island and its valuable oil resources under Venezuelan control. The question now stands before us: shall we respond with force to reclaim Curaçao, or accept the seizure and allow them to keep it, risking the appearance of weakness in the Caribbean?"
 netherlandsfrenchallience.9.a: "Let them have it rather than the British"
 netherlandsfrenchallience.9.b: "Opportunism shall be punished in countries that cannot stand on their own."

