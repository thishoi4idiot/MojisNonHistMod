 # Focus Descriptions
 SOV_Demand_Uyghurs_Subjugation_desc: "The Uyghur regions under Sheng Shicai's rule remain unstable and exposed to foreign influence. By moving decisively against his regime, we can eliminate separatism, assert central authority, and secure lasting stability along our borders."
 SOV_Direct_Intervention_in_the_Far_East_desc: "Diplomacy and indirect pressure have failed to resolve the situation in the Far East. Only direct intervention can dismantle the Mongolian state in the east, impose decisive authority, and secure the frontier against continued instability and rival influence."
 SOV_Integration_of_the_far_east_desc: "To effectively defend and industrialize the steppes, full integration is required. Mongolia and Sinkiang will cease to be dependencies and become core pillars of the Soviet state."
 SOV_Integration_of_the_far_east_desc_desc: "Unlocks more Decisions to core the §YThe Far East§! with enough compliance"
 SOV_blessing_of_the_synod_desc: "The Russian Orthodox Church has long been a pillar of Russian society and culture. With their persicution lifted and their influence restored, we can now seek the blessing of the synod to strengthen our legitimacy and unify the people under our rule."
 SOV_reestablish_influence_in_the_east_desc: "With the end of the second Russian civil war we have the opportunity to reestablish our influence in the east and putting and put an end to communist rule once and for all."
 SOV_reistablish_the_duma_desc: "With the end of the second Russian civil war many are calling for the reestablishment of the duma as the central institution of Russian governance. With this let democracy come to Russia which has for so long been suppressed."
 SOV_empower_the_duma_desc: "Now with the enpowerment of the peasents and the garuntees of religious liberties we can now empower the duma to be the central institution of Russian governance and give the people a voice in their government."
 SOV_empower_the_peasantry_desc: "The peasantry has long been the backbone of Russian society, yet they have been oppressed and exploited for centuries. let the peasantry take their rightful place as the leaders of our nation, giving them the power and resources to shape our future and lead us to greatness."
 SOV_guarantee_religious_liberties_desc: "Religious persecution has been a dark stain on our history, and it is time to put an end to it. By guaranteeing religious liberties for all our citizens we can fix the made under communism and unify our people under a banner of tolerance and respect for all faiths."
 SOV_the_peoples_tsar_desc: "With the sucess of our reforms and the empowerment of the people, we can now declare a new czar. one who is beholdent to the people and serves at their will. This will be a new era for Russia, one where the monarchy is truly a reflection of the people's will and not a tool of oppression."
 SOV_declare_the_russian_republic_desc: "The time has come to declare the Russian Republic, marking a new chapter in our nation's history. This bold move will signal our commitment to democratic principles and set us on a path towards a more inclusive and representative government."
 SOV_promote_multiculturalism_desc: "The Union is home to dozens of peoples beyond the Russian heartland. By embracing their languages, customs, and faiths as equals rather than subjects to be assimilated, we may win their genuine loyalty - though the old guard will see it as a betrayal of Russian primacy."
 SOV_establish_an_eastern_economic_union_desc: "A federation of Slavic peoples cannot survive on solidarity alone. By binding our economies together in a common union, we can ensure lasting prosperity and cooperation across the East."
 SOV_the_lone_bear_desc: "The young Republic owes its allegiance to no foreign power. Rather than binding our fate to the ambitions of distant capitals, we shall walk our own path, trusting in our own strength to secure our future."
 SOV_reapproach_turkey_desc: "Relations with Ankara have long been left to drift. Let us reopen dialogue with the Turkish government and formally request free passage for our fleets through the Dardanelles and the Bosphorus - a request Turkey remains free to grant or refuse."
 SOV_topple_the_shah_desc: "Reza Shah's regime is a relic of feudal reaction, propped up by foreign oil interests and hostile to our influence in the region. Let us cast off any pretense of diplomacy and prepare to bring down the Peacock Throne by force of arms."
 SOV_support_the_persian_constitutionalists_desc: "Persia's constitutionalist movement has long fought for a parliament with real power against the autocracy of the Shah. Rather than conquest, let us lend our support to these reformers and cultivate a friendly, democratic Persia on our southern frontier."
 SOV_the_guardians_of_the_slavs_desc: "The Slavic peoples have long been divided and preyed upon by their neighbors. Let Russia stand as the protector of its Slavic brethren, binding Poland, Czechoslovakia, Yugoslavia, and Bulgaria to us through solidarity rather than the ambitions of foreign entente or the isolation of the lone bear."

 SOV_invite_azneft_owners_decision: "Invite the Azneft Owners Back"
 SOV_invite_azneft_owners_decision_desc: "Before the revolution, the Baku oil fields made fortunes for the Nobel and Rothschild families alike, and for local magnates such as the Taghiyevs. Invite their successors - and their capital - back into Baku, in exchange for letting them keep the lion's share of what comes out of the ground."
 
 SOV_invite_grozneft_owners_decision: "Invite the Grozneft Owners Back"
 SOV_invite_grozneft_owners_decision_desc: "Grozny was never as large as Baku, but its fields are rich and its position - close to the Caucasus front lines of any future war - makes it strategically vital all the same. Reprivatizing it will bring in fresh investment, at the region's long-term expense."
 
 SOV_invite_embaneft_owners_decision: "Invite the Embaneft Owners Back"
 SOV_invite_embaneft_owners_decision_desc: "The Emba basin fields were never as developed as the Caucasus giants, but with the right capital behind them, they could become a real second front for Russian oil production - so long as the state is willing to let private hands run them."
 
 SOV_invite_maikopneft_owners_decision: "Invite the Maikopneft Owners Back"
 SOV_invite_maikopneft_owners_decision_desc: "Maikop's fields are the smallest of the old trusts, but every barrel counts. A modest reprivatization deal here costs little and buys some early goodwill with the region's would-be owners."
 
 SOV_buy_back_azneft_decision: "Buy Back Azneft"
 SOV_buy_back_azneft_decision_desc: "The arrangement with Baku's private owners has run its course. With enough political capital, the state can buy the trust back outright and restore full state control over the region."

 SOV_azneft_privatization_idea: "Azneft Investment"
 SOV_azneft_privatization_idea_desc: "Baku's oil fields are once again in private hands. The arrangement is enormously profitable for the national economy as a whole - just not for Baku itself."
 
 SOV_grozneft_privatization_idea: "Grozneft Investment"
 SOV_grozneft_privatization_idea_desc: "Grozny's oil fields have been handed back to private ownership, fueling faster military production nationwide at the region's own long-term expense."
 
 SOV_embaneft_privatization_idea: "Embaneft Investment"
 SOV_embaneft_privatization_idea_desc: "The Emba basin fields are now privately run, bringing fresh infrastructure investment to the wider economy while the region itself sees less benefit than before."
 
 SOV_maikopneft_privatization_idea: "Maikopneft Investment"
 SOV_maikopneft_privatization_idea_desc: "Maikop's modest oil fields are back in private hands. It is a small deal by the standards of the other trusts, but a tidy one."
 SOV_rebuild_the_all_union_highways: "Rebuild the All-Union Highways"
# Events
 democratic_russia.1.t: "Leadership of the Federation"
 democratic_russia.1.d: "Following the upheaval that shook the empire, the State Duma has been reestablished as the central institution of Russian governance. Under intense pressure from reformers and the public, the powers of the Tsar have been sharply limited, transforming the state into a constitutional system where authority now rests largely with the representatives of the people. As the new order takes shape who shall lead the federation in its time of need"
 democratic_russia.1.a: "Alexander Kerensky will lead us to greatness."
 democratic_russia.2.t: "The Russian Federation demands incorperation and an end to communist rule!"
 democratic_russia.2.d: "The Russian Federation after its civil war is asserting itself in the east once more and an demands end to communist rule and for us to join the russian federation."
 democratic_russia.2.a: "Let us join the Russian Federation."
 democratic_russia.2.b: "We have no interest in this Federation."
 democratic_russia.3.t: "Tuva joins the federation!"
 democratic_russia.3.d: "After our demands were issued Tana Tuva decided to join The Russian Federation."
 democratic_russia.3.a: "Lets put their story to an end."
 democratic_russia.4.t: "Tuva rejects our demands!"
 democratic_russia.4.d: "After our demands were sent we were told that they had rejected our offer."
 democratic_russia.4.a: "They won't stand a chance."
 sov_turkish_straits.1.t: "A Request to Ankara"
 sov_turkish_straits.1.d: "Moscow has formally requested that Turkey grant free passage for Soviet warships and merchant fleets through the Dardanelles and the Bosphorus. The decision rests with Ankara."
 sov_turkish_straits.1.a: "Grant the Soviets passage."
 sov_turkish_straits.1.b: "Refuse the Soviet request."
 sov_turkish_straits.1.c: "We will grant passage - if Moscow guarantees our security."
 sov_turkish_straits.2.t: "Turkey Grants Passage"
 sov_turkish_straits.2.d: "Ankara has agreed to our request. Soviet ships may now pass freely through the Turkish Straits, and the fortifications along them are to stand down."
 sov_turkish_straits.2.a: "A diplomatic victory."
 sov_turkish_straits.3.t: "Turkey Refuses Passage"
 sov_turkish_straits.3.d: "Ankara has rejected our request outright. The Turkish Straits remain closed to our fleets, their garrisons unmoved."
 sov_turkish_straits.3.a: "We shall remember this."
 sov_turkish_straits.4.t: "Turkey's Price for Passage"
 sov_turkish_straits.4.d: "Ankara is willing to grant our fleets passage through the Straits - but only if we formally guarantee Turkish independence and security in return. Shall we agree to this condition?"
 sov_turkish_straits.4.a: "Guarantee Turkey's security."
 sov_turkish_straits.4.b: "Refuse to extend a guarantee."
 sov_turkish_straits.5.t: "Russia Agrees"
 sov_turkish_straits.5.d: "Moscow has agreed to guarantee our security. In turn, we shall grant the Soviet fleets passage through the Dardanelles and the Bosphorus, and stand down our fortifications there."
 sov_turkish_straits.5.a: "A fair arrangement."
 sov_turkish_straits.6.t: "Russia Refuses"
 sov_turkish_straits.6.d: "Moscow has refused to guarantee our security. Without such assurances, we will not open the Straits to their fleets."
 sov_turkish_straits.6.a: "Then the matter is closed."
 MongolianSubmitionEvent.1.t: "The Soviet Union Demands Integration!"
 MongolianSubmitionEvent.1.d: "After long meddling in Mongolian politics the Soviet Union Demands our Reintegration into the USSR."
 MongolianSubmitionEvent.1.a: "Its hopeless..."
 MongolianSubmitionEvent.1.b: "Mongolia is not yet lost!"
 MongolianSubmitionEvent.2.t: "Mongolia Submits."
 MongolianSubmitionEvent.2.d: "After much preasure place on Mongolia to integrate into the USSR the Mongolian Peoples Republic capitulated to our demands."
 MongolianSubmitionEvent.2.a: "Reclaiming was once ours"
 MongolianSubmitionEvent.3.t: "The Mongolian Peoples Republic Rejects our Demands!"
 MongolianSubmitionEvent.3.d: "The Mongols seem to to have ideas of grandeur, they shall know their place... under the Union of Soviet Socialist Republics we must decide now if to strike before the Japanese Empire sees weakness or to give up on our endeavor."
 MongolianSubmitionEvent.3.a: "Strike now before the Japanese get ideas."
 MongolianSubmitionEvent.3.b: "We will Reclaim whats ours later..."
 MON_TAN_annex_event.1.t: "Mongolia Calls for Union"
 MON_TAN_annex_event.1.d: "Diplomats from Ulaanbaatar have arrived in Kyzyl, calling on Tannu Tuva to join the Mongolian People's Republic. Both nations share the same socialist path and the same Mongol heritage - our peoples were never meant to be divided."
 MON_TAN_annex_event.1.a: "We are one people - join Mongolia."
 MON_TAN_annex_event.1.b: "Tannu Tuva shall remain its own nation."
 MON_TAN_annex_event.2.t: "Tannu Tuva Refuses"
 MON_TAN_annex_event.2.d: "The government in Kyzyl has politely, but firmly, rejected our offer of union. Tannu Tuva intends to remain an independent state."
 MON_TAN_annex_event.2.a: "A shame, but we will not force the matter."
 MON_TAN_annex_event.3.t: "Tannu Tuva Joins Mongolia!"
 MON_TAN_annex_event.3.d: "The government in Kyzyl has agreed to our proposal. Tannu Tuva will be peacefully absorbed into the Mongolian People's Republic."
 MON_TAN_annex_event.3.a: "A new era of unity begins."
 MON_SIK_annex_event.1.t: "Mongolia Asks for a Uyghur Union?"
 MON_SIK_annex_event.1.d: "Envoys from Ulaanbaatar have arrived in Urumqi, calling on Sinkiang to join the Mongolian People's Republic. Our two socialist states share a common cause, and a common enemy - together we would be far stronger than apart."
 MON_SIK_annex_event.1.a: "Together we are stronger - join Mongolia."
 MON_SIK_annex_event.1.b: "Sinkiang shall remain its own nation."
 MON_SIK_annex_event.2.t: "Sinkiang Refuses"
 MON_SIK_annex_event.2.d: "The government of Sinkiang has rejected our offer of union. They intend to remain an independent socialist state, for now."
 MON_SIK_annex_event.2.a: "A shame, but we will not force the matter."
 MON_SIK_annex_event.3.t: "Sinkiang Joins Mongolia!"
 MON_SIK_annex_event.3.d: "The government of Sinkiang has agreed to our proposal. Sinkiang will be peacefully absorbed into the Mongolian People's Republic."
 MON_SIK_annex_event.3.a: "A new era of unity begins."
 MON_SOV_align_event.1.t: "Mongolia Requests Greater Integration"
 MON_SOV_align_event.1.d: "The government in Ulaanbaatar has sent a formal request to Moscow, asking that the Mongolian People's Republic be brought closer into the Soviet fold as a dominion, in exchange for greater support and protection."
 MON_SOV_align_event.1.a: "Welcome our Mongolian comrades closer into the fold."
 MON_SOV_align_event.1.b: "Mongolia is better served as a fully independent ally."
 MON_SOV_align_event.2.t: "Moscow Declines"
 MON_SOV_align_event.2.d: "Moscow has declined our request for greater integration. We remain a fully independent ally of the Soviet Union for now."
 MON_SOV_align_event.2.a: "We will ask again another time."
 MON_SOV_align_event.3.t: "Moscow Agrees"
 MON_SOV_align_event.3.d: "Moscow has agreed to our request. The Mongolian People's Republic will be drawn closer into the Soviet fold as a dominion."
 MON_SOV_align_event.3.a: "A new chapter of our partnership begins."
 MON_SOV_zhukov_event.1.t: "A Request for Marshal Zhukov"
 MON_SOV_zhukov_event.1.d: "The government in Ulaanbaatar has asked Moscow to station Marshal Georgy Zhukov in the Far East, so that he may help train and lead our officer corps."
 MON_SOV_zhukov_event.1.a: "Zhukov can be spared for our Mongolian comrades."
 MON_SOV_zhukov_event.1.b: "We need Zhukov's talents here at home."
 MON_SOV_zhukov_event.2.t: "Moscow Refuses"
 MON_SOV_zhukov_event.2.d: "Moscow has refused to release Marshal Zhukov from his duties. He will remain with the Red Army."
 MON_SOV_zhukov_event.2.a: "A shame, but we understand."
 MON_SOV_zhukov_event.3.t: "Zhukov Arrives in Mongolia"
 MON_SOV_zhukov_event.3.d: "Marshal Georgy Zhukov has arrived to take command of our officer corps, bringing with him a wealth of experience from the Red Army."
 MON_SOV_zhukov_event.3.a: "Welcome, Marshal Zhukov."
 MON_SOV_bastion_event.1.t: "A Request for the Far East"
 MON_SOV_bastion_event.1.d: "The government in Ulaanbaatar proposes that the Soviet Union cede its Far Eastern territories - Buryatia, Chita, Amur, Birobidzhan, Nikolayevsk, Khabarovsk, Vladivostok, and North Sakhalin - to Mongolia, so that our nation may stand as a fortified bastion against Japanese aggression."
 MON_SOV_bastion_event.1.a: "Let Mongolia hold the line against Japan."
 MON_SOV_bastion_event.1.b: "The Far East is ours to defend, not to give away."
 MON_SOV_bastion_event.2.t: "Moscow Refuses"
 MON_SOV_bastion_event.2.d: "Moscow has refused to cede any of its Far Eastern territory. The border with Japan remains Soviet responsibility."
 MON_SOV_bastion_event.2.a: "A shame, but we understand."
 MON_SOV_bastion_event.3.t: "The Far East is Ceded to Mongolia"
 MON_SOV_bastion_event.3.d: "Moscow has agreed to our proposal. The Soviet Far East is transferred into Mongolian hands, to be held as a bastion against the Japanese menace."
 MON_SOV_bastion_event.3.a: "We will not let our Soviet comrades down."
 MON_KUM_annex_event.1.t: "Mongolia Demands Our Submission"
 MON_KUM_annex_event.1.d: "The government in Ulaanbaatar has sent word to the Kumul Khanate: Mongolia demands our submission. Our khanate is to be integrated into the Mongolian People's Republic, by force if necessary."
 MON_KUM_annex_event.1.a: "We have no choice but to submit."
 MON_KUM_annex_event.1.b: "We will not bow to Mongolia."
 MON_KUM_annex_event.2.t: "The Kumul Khanate Defies Mongolia"
 MON_KUM_annex_event.2.d: "The Kumul Khanate has refused to submit to our demands. They intend to remain their own khanate, for now."
 MON_KUM_annex_event.2.a: "A shame, but we will not force the matter."
 MON_KUM_annex_event.3.t: "The Kumul Khanate Submits"
 MON_KUM_annex_event.3.d: "The Kumul Khanate has submitted to our demands. It will be integrated into the Mongolian People's Republic."
 MON_KUM_annex_event.3.a: "A new era of unity begins."
 MON_JAP_hulunbuir_event.1.t: "An Offer for Hulunbuir"
 MON_JAP_hulunbuir_event.1.d: "The government in Ulaanbaatar has made Tokyo a generous offer: sell the province of Hulunbuir to Mongolia, and both nations will be better for it."
 MON_JAP_hulunbuir_event.1.a: "A fair price for a distant province - accept."
 MON_JAP_hulunbuir_event.1.b: "Hulunbuir is not for sale."
 MON_JAP_hulunbuir_event.2.t: "Tokyo Refuses"
 MON_JAP_hulunbuir_event.2.d: "Tokyo has refused to part with Hulunbuir at any price. The province remains under Japanese administration."
 MON_JAP_hulunbuir_event.2.a: "A shame, but we understand."
 MON_JAP_hulunbuir_event.3.t: "Hulunbuir is Sold to Mongolia"
 MON_JAP_hulunbuir_event.3.d: "Tokyo has agreed to sell Hulunbuir. The transfer of administration will take some time to settle, straining both economies in the meantime."
 MON_JAP_hulunbuir_event.3.a: "A fine addition to our nation."
 MON_hulunbuir_integration_costs: "Hulunbuir Integration Costs"
 MON_hulunbuir_integration_costs_desc: "Absorbing Hulunbuir's administration and population has strained our consumer goods production."
 JAP_hulunbuir_sale_windfall: "Hulunbuir Sale Windfall"
 JAP_hulunbuir_sale_windfall_desc: "The proceeds from the sale of Hulunbuir have eased the burden on our domestic economy."
 RNG_japanese_exploitation: "Japanese Exploitation of China"
 RNG_japanese_exploitation_desc: "Japanese overseers have taken direct control of our factories and resource extraction, wringing every last unit of output from our economy for the war effort."
 RNG_japanese_trade_concessions: "Japanese Trade Concessions"
 RNG_japanese_trade_concessions_desc: "As part of the price of our independence, Japan retains a substantial claim on our industrial output. It is a lighter yoke than before, but a yoke nonetheless."
 romania.1.c: "We will not give up our Bessarabia without a fight even when alone!"
 soviet.103.t: "Romania Refuses Our Demands"
 soviet.103.d: "The Romanians have refused to give in to our demands! It looks like we will have to expel their occupying forces from Bessarabia with force."
 soviet.103.a: "Fools!"
 soviet.103.b: "Aggression was not wise, We will back down"

