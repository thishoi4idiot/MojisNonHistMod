 # Idea Descriptions
 ENG_10_year_policy_1_desc: "As international tensions rose and disarmament efforts collapsed, the government recognised that Britain's military was outdated and under‑funded. A formal rearmament programme was launched to modernise and expand the armed forces, strengthening the Army, Navy and Air Force to meet emerging threats and back up diplomacy with credible defence capability"
 ENG_10_year_policy_3_desc: "As international tensions rose and disarmament efforts collapsed, the government recognised that Britain's military was outdated and under‑funded. A formal rearmament programme was launched to modernise and expand the armed forces, strengthening the Army, Navy and Air Force to meet emerging threats and back up diplomacy with credible defence capability"
