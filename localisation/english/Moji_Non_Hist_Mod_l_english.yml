 AmongusMan: "Red (Very Sus)"
 FrenchPacifism: "French Pacifism"
 MOJI_ALASKA_RELEASE_NATION_TOOLTIP: "§YThe United States§! may not release §YAlaska§."
 a_strong_successor_to_the_fuhrer: "A strong successor to the fuhrer"
 HAW_US_Pacific_Fleet: "The Pacific Provisional Government"
 SOV_national_recovery_plan: "National Recovery Plan"
 SOV_national_recovery_plan_desc: "With our brutal civil war finally over, we can now focus our attention on recovering and rebuilding the nation."
 SOV_national_RD_institutes: "National RD Institute"
 SOV_national_RD_institutes_desc: "Now that we have opened up to the rest of the world, foreign knowledge can help build domestic research and development institutes across our country."
 SOV_interventionism: "Interventionism"
 SOV_interventionism_desc: "Whilst we must have some capitalism in our economy, it is clear that it is not completely stable and requires government regulation and intervention to ensure economic stability and safety for all citizens."
 SOV_work_with_national_specialists: "Work With National Specialists"
 SOV_work_with_national_specialists_desc: "There are many talented specialists within our own borders. They must be supported to strengthen our industries."
 SOV_national_military_industrial_complex: "National Military Industrial Complex"
 SOV_national_military_industrial_complex_desc: "It is the task of the government, not private corporations, to protect the nations borders and it's citizens. Therefore, it must be the government that is responsible for producing weapons to supply the military."
 SOV_laissez_faire: "Laissez Faire"
 SOV_laissez_faire_desc: "The freer the market, the freer the people. Regulations only hinder capitalism in creating economic growth and prosperity for all, we must create as free a market as possible to grow the economy as fast as possible."
 SOV_invite_foreign_investors: "Invite Foreign Investors"
 SOV_invite_foreign_investors_desc: "There are so many brilliant foreign investors  out there whom we refuse to cooperate with solely due to national pride. No more! Our economy is in great need of foreign experts and we will invite them in to support our economy."
 SOV_privatized_military_industrial_complex: "Privatized Military Industrial Complex"
 SOV_privatized_military_industrial_complex_desc: "A privatized military industrial complex would make it way more competitive, increasing production capabilities as well as developing more modern and refined equipment."
 SOV_land_reform: "Land Reform"
 SOV_land_reform_desc: "The common folk of Russia has been oppressed for far too long. First the tsars and aristocrats owned the land then came the bolshevik government with collectivized agriculture. A land reform where land is given to the people is far overdue and we will finally give the Russian people what is rightfully theirs."
 SOV_electrify_the_countryside: "Electrify the Countryside"
 SOV_electrify_the_countryside_desc: "Millions of Russians still live without access to electricity. Whilst urban centers do have access, much of the countryside still lacks this basic necessity, it is finally time for us to face this issue."
 SOV_hydroelectric_energy: "Hydroelectric Energy"
 SOV_hydroelectric_energy_desc: "As our economy grows, we will require more and more energy and with a limited amount of coal, it may be time to seek alternate sources of energy, such as hydroelectric energy."
 SOV_mechanize_agriculture: "Mechanize Agriculture"
 SOV_mechanize_agriculture_desc: "Whilst the five year plans did make some progress towards modernizing our agricultural sectors, many farmers are still without modern farming equipment, we must begin a mechanization effort to provide every farmer with tractors and other modern equipment."
 SOV_agricultural_exports: "Agricultural Export"
 SOV_agricultural_exports_desc: "With our mechanization efforts and land redistribution we have thoroughly increased our agricultural output, allowing us to export excess production for a profit."
 SOV_invest_in_heavy_industries: "Invest in Heavy Industries"
 SOV_invest_in_heavy_industries_desc: "Any strong economy has a significant heavy industry sector, producing all the vital equipment the rest of the economy requires."
 SOV_strive_towards_autarky: "Strive Towards Autarky"
 SOV_strive_towards_autarky_desc: "Russia is a massive nation with a vast swathe of resources, with war on the horizon it would be foolish not to strive towards resource self-sufficiency."
 SOV_expand_coal_and_metal_mining: "Expand Coal and Metal Mining"
 SOV_expand_coal_and_metal_mining_desc: "With our new autarky efforts, we can now begin to expand our coal and metal mining operation to provide our economy with a greater pool of resources."
 SOV_urbanization: "Urbanization"
 SOV_urbanization_desc: "With a greater amount of jobs in the cities and less demand for labour in the agricultural sector, we can now begin to naturally urbanize, people in the thousands moving to the cities, allowing us to build more factories."
 SOV_construct_cross_country_highways: "Railways and Highways"
 SOV_construct_cross_country_highways_desc: "Russia is a massive country, it spans thousands of kilometers. As more people turn to the car, we must provide the necessary infrastructure to allow them to traverse this country."
 SOV_invest_in_automotive_industries: "Invest in Automotive Industries"
 SOV_invest_in_automotive_industries_desc: "With our new highways the demand for cars will increase necessitating an expanded automotive industry."
 SOV_empower_trade_unions: "Empower Trade Unions"
 SOV_empower_trade_unions_desc: "Workers make up the heart and soul of the economy, we must empower their organizing systems for our economy to prosper."
 SOV_protect_patents: "Protect Patents"
 SOV_protect_patents_desc: "Patents are essential to any innovationist economy. If we want to be the leader power of technological advancements, then we must protect patents and guarantee people be rewarded for their inventions."
 SOV_subsidize_ukrainian_agriculture: "Subsidize Ukrainian Agriculture"
 SOV_complete_industrial_agrarianism: "Complete Industrial Agrarianism"
 SOV_complete_industrial_agrarianism_desc: "The Far East's resources, Ukraine's fields, and our newly mechanized farms form the three pillars of our economy. With industry and agriculture now working in lockstep, the people's confidence in the state grows, and our writ runs stronger across the occupied territories."
 russian_interventionism_1: "Interventionism"
 russian_interventionism_1_desc: "We have pursued a policy of economic interventionism, maintaining a capitalist system but with significant government regulation and intervention."
 russian_interventionism_2: "Interventionism"
 russian_interventionism_2_desc: "We have pursued a policy of economic interventionism, maintaining a capitalist system but with significant government regulation and intervention."
 russian_interventionism_3: "Interventionism"
 russian_interventionism_3_desc: "We have pursued a policy of economic interventionism, maintaining a capitalist system but with significant government regulation and intervention."
 russian_laissez_faire_1: "Laissez Faire"
 russian_laissez_faire_1_desc: "We have pursued a policy of laissez faire, letting the market run on its own with minimal government intervention."
 russian_laissez_faire_2: "Laissez Faire"
 russian_laissez_faire_2_desc: "We have pursued a policy of laissez faire, letting the market run on its own with minimal government intervention."
 russian_agriculture_1: "Russian Agriculture"
 russian_agriculture_1_desc: "Russia has vast amounts of farmlands allowing for a highly productive agricultural sector."
 russian_agriculture_2: "Russian Agriculture"
 russian_agriculture_2_desc: "Russia has vast amounts of farmlands allowing for a highly productive agricultural sector."
 russian_agriculture_3: "Russian Agriculture"
 russian_agriculture_3_desc: "Russia has vast amounts of farmlands allowing for a highly productive agricultural sector."
 protected_patents: "Protected Patents"
 protected_patents_desc: "We have strengthened the institution of patents, boosting innovation."
