 USA_limited_intervention_MOJI: "Limited Intervention"
 USA_remember_the_panay_idea: "Remember the Panay"
 USA_remember_the_panay_idea_desc: "The sinking of the USS Panay by Japanese forces in 1937 was a stark reminder of the dangers posed by Japanese aggression in Asia. This event fueled anti-Japanese sentiment and underscored the need for American vigilance and preparedness in the face of growing threats abroad."

