 # Focus Descriptions
 GRE_exite_in_crete_desc: "Holding the mainland is a hopeless goal, now we must relocate to Crete to survive"
 GRE_fortify_crete_desc: "We are in desperate need of manpower to supplement this we must pass an act to mobilise every single person on Crete"
 GRE_islands_for_drachmae_desc: "The Dodecanese islands have been under Italian control since the Italo-Turkish war. We have long claimed these islands as part of our territory and with victory in the third greeko-turkish war we now have the opportunity to purchase these islands from Italy. This would be a significant step towards securing our position in the Mediterranean and fulfilling our national aspirations."
 GRE_occupy_southern_albania_desc: "With our goverment out of turmoil and our we have the opportunity to reoccupy Northern Epirus that was taken from us by Albania. This is a chance to reclaim our lands and protect our people from the threats of the Albanian government and fascist influence in the region."
 GRE_reconquer_the_moesia_desc: "The Moesian lands were a key part of the byzantine empire and are rightfully ours. With the current turmoil in the region, we have a chance to reconquer these lands and restore our rightful place in the Balkans."

 # Events
 GreeceNewEvents.1.t: "Greece Occupies Northern Epirus!"
 GreeceNewEvents.1.d: "In a move that shocked us the Greeks have occupied Northern Epirus. This is a major crisis in the Balkans and we must respond to this at once!"
 GreeceNewEvents.1.a: "A dark day for the Balkans!"
 GreeceNewEvents.1.b: "We must retake our lands!"
 GreeceNewEvents.2.t: "Albania stands down!"
 GreeceNewEvents.2.d: "Albania has decided to stand down and not engage in conflict with the Greeks. We have now secured our borders and can now focus on other matters."
 GreeceNewEvents.2.a: "A victory for our nation!"
 GreeceNewEvents.3.t: "Albania fights back!"
 GreeceNewEvents.3.d: "Albania has decided to fight back against the Greek occupation of Northern Epirus. This escalation of the conflict and we must show that we will not back down from our claimed lands!"
 GreeceNewEvents.3.a: "No matter the cost!"
 GreeceNewEvents.4.t: "Greece offers to buy the Dodecanese islands!"
 GreeceNewEvents.4.d: "The Greeks have offered to purchase the Dodecanese islands from us. This could be a significant development in the region."
 GreeceNewEvents.4.a: "Our Ambitions no longer depend on those islands."
 GreeceNewEvents.4.b: "We need to keep those for mediterranean security!"
 GreeceNewEvents.5.t: "They accepted our offer!"
 GreeceNewEvents.5.d: "After much negotiation, the Italian government has accepted our offer to purchase the Dodecanese islands. This is a great victory for our nation and a step towards our goal of securing our position in the Mediterranean."
 GreeceNewEvents.5.a: "A great victory for our nation!"
 GreeceNewEvents.6.t: "They rejected our offer!"
 GreeceNewEvents.6.d: "Despite our efforts to negotiate, the Italian government has rejected our offer to purchase the Dodecanese islands. We will not give up our claim to these islands and will continue to fight for them."
 GreeceNewEvents.6.a: "We will be back for what is ours!"
 GreeceNewEvents.7.t: "Greece offers to buy Cyprus!"
 GreeceNewEvents.7.d: "The Greek government has formally approached us with an offer to purchase Cyprus. While the island has long served as a strategic asset in the Eastern Mediterranean, changing circumstances may make its continued administration less essential."
 GreeceNewEvents.7.a: "Our ambitions no longer depend on Cyprus."
 GreeceNewEvents.7.b: "We must retain Cyprus for Mediterranean security!"
 GreeceNewEvents.8.t: "They accepted our offer!"
 GreeceNewEvents.8.d: "After careful negotiations, the British government has agreed to sell Cyprus to us. This is a major diplomatic success and strengthens our position in the Eastern Mediterranean."
 GreeceNewEvents.8.a: "A great victory for our nation!"
 GreeceNewEvents.9.t: "They rejected our offer!"
 GreeceNewEvents.9.d: "Despite our efforts, the British government has rejected our proposal to purchase Cyprus. While disappointing, this does not mark the end of our ambitions regarding the island."
 GreeceNewEvents.9.a: "We will be back for what is ours!"
 GreeceNewEvents.10.t: "Greece offers to buy Malta!"
 GreeceNewEvents.10.d: "The Greek government has formally approached the British administration with an offer to purchase Malta. The island has long been a vital naval base in the central Mediterranean, but changing priorities may make its continued administration less essential."
 GreeceNewEvents.10.a: "Our ambitions no longer depend on Malta."
 GreeceNewEvents.10.b: "We must retain Malta for Mediterranean security!"
 GreeceNewEvents.11.t: "They accepted our offer!"
 GreeceNewEvents.11.d: "After careful negotiations, the British government has agreed to sell Malta to us. This is a major diplomatic success and strengthens our position in the central Mediterranean."
 GreeceNewEvents.11.a: "A great victory for our nation!"
 GreeceNewEvents.12.t: "They rejected our offer!"
 GreeceNewEvents.12.d: "Despite our efforts, the British government has rejected our proposal to purchase Malta. While disappointing, this does not mark the end of our ambitions regarding the island."
 GreeceNewEvents.12.a: "We will be back for what is ours!"

