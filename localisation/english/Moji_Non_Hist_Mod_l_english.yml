 SOV_the_duma_1: "The Duma"
 SOV_the_duma_1_desc: "The Duma has not existed since the fall of the Russian Empire, but with the recent turmoil in the country and the rise of democratic ideals the czar has been forced to reestablish the Duma as the central institution of Russian governance. Now the question is whether the Duma will be a rubber stamp for the czar or if it will have real power and influence over the government."
