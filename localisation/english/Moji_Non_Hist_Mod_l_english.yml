 mnhm_news.1.t: "Napoleon Restores the Polish-Lithuanian Commonwealth"
 mnhm_news.1.d: "\n In a grand proclamation from Paris, Napoleon has decreed the union of the Grand Duchy of Warsaw and the Grand Duchy of Vilnius, restoring the old Polish-Lithuanian Commonwealth under French protection. Crowds have gathered across Warsaw and Vilnius alike, celebrating the rebirth of a state many believed lost to history forever."
 mnhm_news.1.a: "A new era for Poland and Lithuania begins!"
 mnhm_news.1.b: "Poland was never lost!"
 mnhm_news.1.c: "The greatest geopolitical catastrophe of the 20th century"
