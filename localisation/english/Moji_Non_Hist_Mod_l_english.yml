 GreaterYugoslaviaCategory_desc: "At long last, our people stand together. The Slavic lands have been united, and the false borders that once divided us have been swept away. We shall now proclaim the rise of Greater Yugoslavia, a homeland powerful enough to defend and lead all Slavs into a glorious future."
 GreaterYugoslaviaFormed: "Form Greater Yugoslavia"
 GreaterYugoslavia_desc: "The dream of Slavic unity fulfilled."
