 # Focus Descriptions
 MON_modernize_the_army_desc: "Our army i significantly outdated, we must begin to modernize if we want to stand in the modern world."
 MON_soviet_military_mission_desc: "The red army has many valuable lessons to teach us which could significantly improve our army."
 MON_joint_military_exercises_desc: "Joint exercises with the red army would be beneficial to the both of us."
 MON_invite_soviet_generals_desc: "The soviets has a vast high command and could spare a few officers to help our modernization effort. We will ask Moscow to station Marshal Zhukov here in the Far East."
 MON_soviet_military_takeover_desc: "Marshal Zhukov's influence in the Mongol military has grown vast enough to allow for a political takeover."
 MON_union_with_sinkiang_desc: "Our socialist brothers to the west share a similar situation to us, a union would benefit the both of us. We will send our proposal to Urumqi and see if they agree."
 MON_closer_alignment_with_the_soviets_desc: "We must further strengthen our ties to the Soviets for mutual benefits. We will send our request to Moscow and see if they agree."
 MON_bastion_against_the_japanese_menace_desc: "The Japanese have been eyeing a war with us and the Soviets for a while now. We must station ourselves as a bastion against the Japanese to protect the revolution. We will ask Moscow to cede its Far Eastern territories to us for this purpose."
 MON_invite_russian_scientists_desc: "The Russians have a wide pool of scientists. They wouldn't miss a couple which could greatly benefit our technological development."
 MON_purchase_convoys_desc: "Even without a coastline convoys can still be necessary, however we lack the shipbuilding capabilities to produce ones on our own, therefore we must seek a purchasing agreement with a foreign power to obtain convoys"
 MON_establish_the_mongolian_military_institute_desc: "To help our military modernization we must establish a military institute to lead the technological advancement."
 MON_develop_fighter_designs_desc: "With our new military institute we can begin development of fighter designs."
 MON_adopt_tank_designs_desc: "With our new military institute we can begin adoption of tank designs."
 MON_begin_naval_research_desc: "Now that we have finally acquired a coastline we can begin naval research."
 MON_expand_military_airbases_desc: "Expaning military airbases could help us project air supremacy across the Mongol regions."
 MON_improve_rifle_designs_desc: "Rifles are essential to any army, therefore it is very important to develop modern designs."
 MON_expand_support_companies_desc: "Support companies significantly improve the performance of our divisions, they must not be neglected."
 MON_improve_artillery_designs_desc: "Artillery is the punching power of our divisions, therefore we must develop them."
 MON_army_mechanization_desc: "In modern warfare mechanized armies play a bigger and bigger role, we must follow suit."
 MON_katyushas_desc: "Motorized rocket artillery or 'Katyushas' as they have been nicknamed is a brand new technology where Mongolia have become one of the leading developers. We must keep our lead!"
 MON_stalins_organ_desc: "With our recent investments in Katyushas our rocket artillery have become one of the most feared vehicles on the battlefield, with their terrifying noise giving them the nickname 'Stalin's Organ'."
 MON_embrace_tradition_desc: "The people arguing for adoption of modern technologies like tanks are fools. Mongolians has always been proud horseriders, we must not neglect our past. We must embrace our traditions!"
 MON_raise_the_steppe_warriors_desc: "There are many skillful warriors across the vast steppe with the skills to serve the Mongol army."
 MON_riders_of_the_khan_desc: "The mighty Genghis Khan conquered most of Eurasia with an army of cavalry, we must channel his legacy to create a new army of riders of the khan."
 MON_modern_doctrine_of_the_horde_desc: "We must develop a doctrine that to suit an army of cavalry in the modern era."
 MON_continue_marxist_ideals_desc: "We must continue following the ideas of Karl Marx."
 MON_aid_the_soviet_union_desc: "Our Soviet allies are under attack, we must do our duty to the revolution."
 MON_fund_the_siberian_war_machine_desc: "As industry is being relocated to Siberia, we can contribute by funding this programming strengthening both our own and the Siberian war Machine."
 MON_the_peoples_army_desc: "We must create a socialist army of the people!"
 MON_asian_socialist_exiles_desc: "There are many suppressed socialist movements across Asia. We must position ourselves as a safehaven for socialists across Asia."
 MON_mongolian_economic_reforms_desc: "With socialism secured in Mongolia, we can finally begin to establish a command economy to oversee the industrialization and modernization of Mongolia."
 MON_mass_collectivization_desc: "There are many small scattered and inneficient industries across Mongolia, we must collectivize these industries to boost economic efficiency and productivity."
 MON_develop_the_capital_desc: "We must have a proud and modern capital."
 MON_construct_the_taishir_hydro_power_station_desc: "We must construct a dam at the Zavkhan river, using the flow of the river to generate electricity to fund economic development."
 MON_expand_mining_operations_desc: "With the benefits of the Taishir Hydro Power Station we can now begin large scale mining operations in the Gobi region."
 MON_electrify_the_steppe_desc: "With our massive electricity production we can begin to electrify the Mongol steppe and bring electricity to rural homes."
 MON_expand_heavy_industries_desc: "By significantly investing in heavy industry we can rapidly modernize ourselves, removing reliance on western machinery."
 MON_socialist_economic_institute_desc: "We must create an institute promoting socialist thought and economic theory."
 MON_integrate_the_mongol_rail_system_desc: "By integrating the Mongol rail system into the trans-siberian rail system we can connect Mongolia further to both itself and Russia."
 MON_fight_the_bourgeoisi_desc: "We must eliminate any remnant of bourgeoisi control over Mongolia!"
 MON_annex_tannu_tuva_desc: "It is time to propose a union with Tannu Tuva - they are both socialist and Mongol people, a union is only the natural solution. We will send our request to Kyzyl and see if they agree."
 MON_empower_trade_unions_desc: "We must empower trade unions to guarantee total equality."
 MON_crack_down_on_authoritarianism_desc: "Some members of the socialist party has become too authoritarian, defeating the whole point of total equality, we must crack down on this growing trend of authoritarianism."
 MON_workers_republic_desc: "No man is above others, we are a republic of equals a republic of the common worker!"
 MON_state_secularism_desc: "We must guarantee every man the right to believe in whichever religion he wants."
 MON_secure_public_trust_desc: "The past authoritarian regime has made the people skeptical of the government, we must regain their trust."
 MON_expand_public_schools_desc: "Literacy is still widespread, we must expand public schools ensuring every Mongol will be educated."
 MON_follow_stalinist_doctrine_desc: "We must follow the path Stalin, a proletarian dictatorship is the only way to secure the success of the revolution."
 MON_indoctrination_desc: "Those who do not believe in the revolution must be forced to."
 MON_enforce_atheism_desc: "There are no gods there are no being above everyone else, this fact must be enforced, no religious institute will be allowed in our socialist utopia."
 MON_political_commissars_desc: "We must deploy a series of political commissars in the military guaranteeing party control over the military."
 MON_rapid_militarization_desc: "Our enemies are many a quickly approaching, we must begin rapid militarization to be ready."
 MON_build_a_cult_of_personality_desc: "We must build a cult of personality around our glorious leader to secure the stability of our leadership."
 MON_return_to_the_past_desc: "The decrepit socialist regime is a disgrace to the glorious Mongol nation. We must return to our past."
 MON_a_mongol_monarchy_desc: "Only a monarch can lead Mongolia."
 MON_neo_feudalism_desc: "It was a mistake to get rid of feudalism, it is the best way to govern a country, we must introduce feudalism with modern characteristics."
 MON_royal_research_institute_desc: "We must develop a royal institute to promote pro-monarchy thought."
 MON_department_for_labour_research_and_development_desc: "We must develop a department for labour research and development."
 MON_integrate_foreign_lords_desc: "As we begin to expand outwards we must integrate local lords in these territories to ensure local cooperation with the king."
 MON_militarized_feudalism_desc: "We must expand the feudal system to strengthen our military."
 MON_invite_a_european_monarch_desc: "We lack competent local options for a monarch, we must search outwards for one."
 MON_gain_support_for_the_monarchy_desc: "Obviously a monarch from Denmark is unpopular amongst the Mongol public, we must integrate him into Mongol culture and society to regain public support."
 MON_invite_danish_investers_desc: "There are many wealthy danish investers who could greatly benefit the Mongol economy."
 MON_invite_danish_settlers_desc: "Mongolia is sparsely populated with vast unsettled lands, by inviting Danish settlers we could strengthen our population, thus economy and military."
 MON_join_the_allies_desc: "We have good ties with the western allies, we further strengthen our alliances with them."
 MON_invite_demchugdongrub_desc: "Demchugdongrub is the only legitimate claimant to the Mongol throne, he must be made our leader!"
 MON_integrate_the_kumul_khanate_desc: "Our brothers in the Kumul Khanate have fought for their freedom from the oppressors in Sinkiang, they must be integrated into our kingdom. We will demand their submission."
 MON_invade_sinkiang_desc: "We must invade the oppressive Sinkiang regime."
 MON_march_south_desc: "We have a long history of conflict with the Chinese, it is only a matter of time before they strike us, we must seize the opportunity whilst we have it."
 MON_purchase_hulunbuir_desc: "By making a good offer to the Japanese we can secure Hulunbuir without shedding a drop of blood. We will send our offer to Tokyo and see if they agree."
 MON_attack_tannu_tuva_desc: "The tiny state of Tannu Tuva is rightful Mongol territory and we must conquer it."
 MON_seize_oyrot_desc: "The Oyrot region has always been Mongol it is only right that it belongs to us."
 MON_reclaim_our_russian_lands_desc: "Russia still hols on to many rightful Mongol territories. No more!"
 MON_westernize_mongolia_desc: "We must westernize Mongolia to bring it into the modern day."
 MON_increase_public_rnd_funding_desc: "Be increasing public funding of research and development, we can rapidly modernize our technology."
 MON_public_work_programmes_desc: "Introducing a public workes programme could both stimulate the economy, improve infrastructure and give jobs to many people who lack them."
 MON_centralize_the_administration_desc: "We must centralize the administration to govern Mongolia efficiently."
 MON_restore_mongol_greatness_desc: "Mongolia has a long history of greatness we must restore our former greatness."
 MON_reclaim_mongol_glory_desc: "We must reclaim our Mongol glory which we have lost under socialist oppression."
 MON_adopt_corporatism_desc: "By adopting a system of cooperation between different classes all under government oversight we can maximize economic efficiency whilst securing government control over the economy."
 MON_nationalize_trade_unions_desc: "We must put trade unions under government control."
 MON_maximize_land_usage_desc: "We must maximize the use of arable land."
 MON_heavy_industrialization_desc: "By significantly investing in heavy industry we can rapidly modernize ourselves, removing reliance on western machinery."
 MON_mongol_institute_for_industrial_development_desc: "We will establish an institute to develop modern industrial techniques."
 MON_rapid_mongol_militarization_desc: "Our enemies are many a quickly approaching, we must begin rapid militarization to be ready."
 MON_mobilize_farmers_and_workers_desc: "We have many farmers and workers whom can be mobilized for the military."
 MON_modernize_infrastructure_networks_desc: "Mongolia is a massive nation, we must modernize our infrastructure networks to connect our scattered population."
 MON_integrate_greater_mongolia_desc: "There are many Mongols living outside the nation whom can be integrated into our glorious nation."
 MON_restore_the_mongol_empire_desc: "It is time to restore the greatest empire to every grace the earth."
 MON_reconquer_the_ilkhanate_desc: "We will press our claim to the ilkhanate territories in the middle east."
 MON_retake_tuva_desc: "The tiny state of Tannu Tuva is rightful Mongol territory and we must conquer it."
 MON_retake_the_north_desc: "Russia still hols on to many rightful Mongol territories. No more!"
 MON_reclaim_menjiang_desc: "Menjiang is another Mongol state, it is only natural to integrate them into ourselves."
 MON_cross_the_great_wall_desc: "We will cross the great wall and strike the Chinese before they unify!"
 MON_invade_manchuria_desc: "Manchuria is one of the former territories of the Mongol empire, our claim to them is legitimate."
 MON_push_back_the_japanese_desc: "The pesky Japanese are putting our armies under immense pressure, we must push them back."
 MON_avenge_tsushima_desc: "Our failure at Tsushima still haunts us today, we must avenge this failure and deliver the killing blow to Japan."
 MON_neo_mongol_empire: "Mongol Empire"

 # Ideas Descriptions
 riders_of_the_khan: "Riders of the Khan"
 MON_secularism: "Secularism"
 MON_atheism: "Atheism"
 MON_neo_feudalism_1: "Neo Feudalism"
 MON_neo_feudalism_2: "Neo Feudalism"
 MON_neo_feudalism_3: "Neo Feudalism"
 MON_command_economy: "Command economy"

 ###########################
 # TURKISH SOVIET WAR      #
 ###########################

 # Decision Category
 TUR_soviet_war_category: "Turkish-Soviet War"

 # Decisions
 SOV_turkish_war_exhaustion: "War Exhaustion"
 SOV_turkish_war_exhaustion_desc: "The invasion of Turkey has dragged on far longer than the Politburo anticipated, straining the Red Army's resources and the nation's patience. Ankara must be brought to heel and made a client of Moscow before this exhaustion runs its course, or the campaign will have to be abandoned."

 TUR_holding_out_soviet_war: "Holding the Line"
 TUR_holding_out_soviet_war_desc: "The Red Army presses against our defences, seeking to reduce us to a Soviet puppet. Every day we hold out is a day closer to Soviet exhaustion - if we can deny them long enough, Moscow's ambitions will collapse under their own weight."

 TUR_offer_peace_straits: "Offer Peace"
 TUR_offer_peace_straits_desc: "This war has cost us dearly with no end in sight. We should approach Moscow and offer to reopen the Straits and cede Trabzon in exchange for peace, before we lose far more than that."

 # Ideas
 TUR_post_war_reconstruction: "Soviet War Reparations"
 TUR_post_war_reconstruction_desc: "As part of the peace settlement, Moscow has agreed to compensate Ankara for the damage inflicted during the war. For the coming year, these reparations will ease the burden of rebuilding the nation."

 SOV_turkish_war_reparations: "Turkish War Reparations"
 SOV_turkish_war_reparations_desc: "As part of the peace settlement, Moscow has agreed to compensate Ankara for the damage inflicted during the war. For the coming year, a portion of our industry must be diverted to cover these reparations."

 TUR_national_humiliation: "National Humiliation"
 TUR_national_humiliation_desc: "Surrendering the Straits and Trabzon to Moscow without a fight to the finish has shaken the nation's confidence and its will to endure further hardship."

 SOV_turkish_soviet_war_victory: "Turkish-Soviet War Victory"
 SOV_turkish_soviet_war_victory_desc: "Turkey has capitulated, ceding the Straits and Trabzon without Moscow having to force the issue further. The Soviet people take pride in this triumph of Soviet diplomacy and arms."

 # Events

 bftb_turkey.146.t: "The Nation Endures"
 bftb_turkey.146.desc: "Despite months of grinding conflict, the Red Army has failed to bring us to heel. Moscow's dream of a Soviet Turkey has stalled, and with our independence intact, it is time to bring this costly affair to a close."
 bftb_turkey.146.a: "We have endured!"

 bftb_turkey.149.t: "A Line We Will Not Cross"
 bftb_turkey.149.desc: "Ankara's standoff with Moscow over the Straits threatens to boil over into open war. Our guarantee of Turkish independence was never meant to drag us into a war with the Soviet Union - and if the Red Army marches, we cannot afford to be bound by it."
 bftb_turkey.149.a: "We cannot risk war with the Soviet Union over this"
 bftb_turkey.149.b: "We must stand firm against the Soviet threat"

 bftb_turkey.150.t: "A War Without End"
 bftb_turkey.150.desc: "Months of fighting in Turkey have yielded little beyond a mounting butcher's bill. The Politburo must decide: commit fully to seeing this campaign through regardless of the cost, or accept that it is time to cut our losses."
 bftb_turkey.150.a: "Press on, whatever the cost"
 bftb_turkey.150.b: "The cost has become too great - make peace"

 bftb_turkey.151.t: "Turkey Offers Peace"
 bftb_turkey.151.desc: "Ankara has approached Moscow with an offer: reopen the Straits to Soviet shipping and cede Trabzon, in exchange for an immediate end to the war. Shall we accept their offer of peace?"
 bftb_turkey.151.a: "Accept - the Straits and Trabzon are ours, no need to press further"
 bftb_turkey.151.b: "Reject - Turkey's capitulation must be total"

 bftb_turkey.152.t: "Moscow Offers Peace"
 bftb_turkey.152.desc: "With Turkey's capitulation, the Soviet Union has no further quarrel with us. Moscow has offered to end hostilities between our two nations. Shall we accept?"
 bftb_turkey.152.a: "Accept - there is little more to be gained by continuing this fight"
 bftb_turkey.152.b: "Reject - we shall carry on the fight regardless"

 bftb_turkey.153.t: "Britain Accepts Peace"
 bftb_turkey.153.desc: "With Turkey out of the war, London has agreed to end hostilities. The guns fall silent on this front."
 bftb_turkey.153.a: "A sensible conclusion"

 bftb_turkey.154.t: "Britain Refuses Peace"
 bftb_turkey.154.desc: "Despite Turkey's fall, London has refused our offer of peace and means to continue the fight."
 bftb_turkey.154.a: "So be it"

 # News Events
 bftb_news.401.t: "Turkey Weathers the Storm"
 bftb_news.401.d: "After months of grinding war along the Anatolian frontier, the Soviet Union has quietly abandoned its campaign against Turkey. What began as a dispute over the Montreux Convention and control of the Straits spiralled into a costly, inconclusive conflict that neither side could bring to a decisive end. With Moscow's war-weary armies unable to force the issue, an armistice has finally been struck - Ankara's independence remains intact, and the Bosphorus and Dardanelles stay firmly under Turkish control."
 bftb_news.401.a: "A triumph for the Republic!"
 bftb_news.401.b: "A costly and humbling failure."
 bftb_news.401.c: "Turkey has survived the Soviet onslaught."

 bftb_news.402.t: "Turkey Sues for Peace"
 bftb_news.402.d: "With the war against the Soviet Union dragging on and the cost in blood and treasure mounting by the month, the Turkish government has moved to bring the conflict to a close on its own terms. Ankara has reached a settlement with Moscow that reopens the Bosphorus and the Dardanelles to Soviet shipping and cedes the eastern province of Trabzon, in exchange for an immediate and unconditional end to the fighting. The peace preserves what remains of Turkish sovereignty, though at a price many in Ankara are already calling a national humiliation."
 bftb_news.402.a: "A bitter price for peace."
 bftb_news.402.b: "The Straits are open to us at last."
 bftb_news.402.c: "Turkey has ceded ground to end its war with the Soviet Union."

 bftb_news.403.t: "Turkey Falls"
 bftb_news.403.d: "The Turkish government has capitulated after a prolonged and brutal campaign that saw the Red Army fight its way through Anatolia. With resistance broken and the state's ability to continue the war exhausted, Ankara has been forced to accept terms dictated entirely by Moscow. The Red Army now stands astride the Bosphorus and the Dardanelles, and what remains of the Turkish government answers directly to the Soviet Union - the culmination of a dispute over the Straits that grew into the outright subjugation of a nation."
 bftb_news.403.a: "The Republic has fallen."
 bftb_news.403.b: "A crowning victory for Soviet arms!"
 bftb_news.403.c: "Turkey has fallen under Soviet control."

 ###########################
 # SOVIET ROMANIAN WAR     #
 ###########################

 # Decision Category
 SOV_romania_war_category: "Soviet-Romanian War"

 # Decisions
 SOV_romanian_war_exhaustion: "War Exhaustion"
 SOV_romanian_war_exhaustion_desc: "The invasion of Romania over Bessarabia has dragged on far longer than the Politburo anticipated, straining the Red Army's resources and the nation's patience. Bucharest must be brought to heel before this exhaustion runs its course, or the campaign will have to be abandoned."

 ROM_holding_out_soviet_war: "Holding the Line"
 ROM_holding_out_soviet_war_desc: "The Red Army presses against our defences, seeking to seize Bessarabia and reduce us to a Soviet client. Every day we hold out is a day closer to Soviet exhaustion - if we can deny them long enough, Moscow's ambitions will collapse under their own weight."

 ROM_sue_for_peace_bessarabia: "Sue for Peace"
 ROM_sue_for_peace_bessarabia_desc: "Bessarabia has fallen to the Red Army. Continuing this war serves no purpose - we should approach Moscow and offer to end the fighting before it costs us more than the province itself."

 ROM_accept_defeat_bessarabia: "Accept Defeat"
 ROM_accept_defeat_bessarabia_desc: "This war cannot be won. Rather than let it drag on and bleed the nation dry, we should approach Moscow now and offer to cede Bessarabia in exchange for peace, before things get any worse."

 # Ideas
 ROM_battle_for_our_nations_survival: "The Battle for Our Nation's Survival"
 ROM_battle_for_our_nations_survival_desc: "The Romanian people stand united against the Soviet invader. Every soldier, every citizen knows what is at stake - and that resolve, fighting on our own soil for our own survival, gives our defenders an edge no invader can match."

 # Events
 soviet.101.t: "Romania Sues for Peace"
 soviet.101.d: "With Bessarabia lost, the Romanian government has approached Moscow seeking an end to the fighting. Shall we accept their offer of peace?"
 soviet.101.a: "Accept - the province is ours, no need to press further"
 soviet.101.b: "Reject - Romania's capitulation must be total"

 soviet.102.t: "A War Without End"
 soviet.102.d: "Months of fighting in Romania have yielded little beyond a mounting butcher's bill. The Politburo must decide: commit fully to seeing this campaign through regardless of the cost, or accept that it is time to cut our losses."
 soviet.102.a: "Press on, whatever the cost"
 soviet.102.b: "The cost has become too great - make peace"

 romania.7.t: "The Nation Endures"
 romania.7.d: "Despite months of grinding conflict, the Red Army has failed to bring us to heel. Moscow's dream of a Soviet Romania has stalled, and with our independence intact, it is time to bring this costly affair to a close."
 romania.7.a: "We have endured!"

 romania.8.t: "Bessarabia Ceded"
 romania.8.d: "Moscow has accepted our offer of peace - but only in exchange for Bessarabia. The province is lost, but the war is over."
 romania.8.a: "A bitter price, but the fighting must end"

 romania.9.t: "Peace Refused"
 romania.9.d: "Moscow has rejected our offer of peace. The Soviet Union means to see this war through to the end, whatever that may mean for us."
 romania.9.a: "Then we shall continue to fight"

 ###########################
 # CHINA                   #
 ###########################

 # Focuses
 CHI_restore_the_republic: "Restore the Republic"

 # Focus Descriptions
 CHI_restore_the_republic_desc: "The invader has been driven from our soil, and with victory secured the nation no longer needs the iron discipline of party rule to hold it together. It is time to dissolve the one-party state, restore the constitution, and return China to the elected government it was always meant to have."

 # Tooltips
 CHI_restore_the_republic_tt: "The one-party state is dissolved. Elections are restored and power passes back to a democratic government."

 # Events
 chi_restoration.1.t: "Return of the Republic"
 chi_restoration.1.d: "General Dai Li stands before the assembled leadership of the party, his secret police files locked away for the first time in years. Japan lies beaten, her armies driven from every province of China, and the network of informants and enforcers he built to hold the nation together through invasion has outlived its purpose.\n\nHe speaks plainly, without the theatrics his reputation would suggest. The war is won. The Republic he swore to protect was never meant to be ruled from the shadows, and he will not be the one standing in its way. Let the constitution be restored. Let the ballots be counted. China has earned her peace, and now she must earn her government as well."
 chi_restoration.1.a: "Let the Republic return"

 # Focuses (Reorganized Government - Resist Japan)
 CHI_tsr_demand_end_to_japanese_exploitation: "Demand an End to Japanese Exploitation"
 CHI_tsr_demand_end_to_japanese_exploitation_desc: "Our people have grown weary of enriching Tokyo at their own expense. It is time to formally demand that Japan end its economic exploitation of our nation, though there is no guarantee our patrons in Tokyo will listen."
 CHI_tsr_third_sino_japanese_war: "The Third Sino-Japanese War"
 CHI_tsr_third_sino_japanese_war_desc: "Japan has refused to accept our independence and moved to crush our government by force. This marker records that our nation is now embroiled in a new war against our former overlord."
 CHI_tsr_peaceful_independence: "Independence Without Bloodshed"
 CHI_tsr_peaceful_independence_desc: "Whether through Tokyo's reluctance to fight or a negotiated arrangement, our independence has been secured without a shot being fired. This marker records that our nation broke free of Japan peacefully."

 # Events (Demand an End to Japanese Exploitation)
 CHI_end_exploitation.1: "Chinese Demands"
 CHI_end_exploitation.1.t: "A Formal Protest from Nanjing"
 CHI_end_exploitation.1.d: "Representatives of our government have lodged a formal diplomatic protest, demanding that Japan cease its policies of economic exploitation within our territory. They insist that continued extraction of resources and wealth without recompense will only breed further resentment among our people.\n\nHow does the Empire respond?"
 CHI_end_exploitation.1.a: "Agree to their demands"
 CHI_end_exploitation.1.b: "Reject their demands"

 CHI_end_exploitation.2: "Japan Relents"
 CHI_end_exploitation.2.t: "Tokyo Agrees to Ease Its Grip"
 CHI_end_exploitation.2.d: "To the surprise of many, Tokyo has agreed to scale back its exploitative economic policies in our country. While Japanese interests remain deeply entrenched, this is a small but meaningful victory for our government."
 CHI_end_exploitation.2.a: "A step in the right direction"

 CHI_end_exploitation.3: "Japan Refuses"
 CHI_end_exploitation.3.t: "Our Demands Are Denied"
 CHI_end_exploitation.3.d: "Tokyo has flatly rejected our demands, dismissing our protests as an internal matter of no concern to Chinese officials. The insult is plain for all to see - and our people are watching to see how we respond."
 CHI_end_exploitation.3.a: "Swallow our pride, for now"
 CHI_end_exploitation.3.b: "Declare our independence and take up arms!"

 CHI_end_exploitation.4: "Independence Declared"
 CHI_end_exploitation.4.t: "The Break with Tokyo"
 CHI_end_exploitation.4.d: "The die is cast. Our government has renounced its ties to Japan and declared itself a free and sovereign nation once more. Word of our defiance is already on its way to Tokyo - how the Empire chooses to respond remains to be seen."
 CHI_end_exploitation.4.a: "For our freedom!"

 CHI_end_exploitation.5: "Tokyo's Dilemma"
 CHI_end_exploitation.5.t: "A Rebellion Among the Colonies"
 CHI_end_exploitation.5.d: "Word has reached the Imperial General Staff: the client government they once propped up has renounced its allegiance and declared itself free. Some in the government demand immediate and total suppression of such insolence, while others argue that a costly war against a rebellious client is scarcely worth the trouble when greater enemies remain to be faced."
 CHI_end_exploitation.5.a: "Crush the rebellion!"
 CHI_end_exploitation.5.b: "Let them go - we have bigger concerns"
 CHI_end_exploitation.5.c: "Perhaps our friendship can be bought"

 CHI_end_exploitation.6: "Japan Backs Down"
 CHI_end_exploitation.6.t: "Tokyo Blinks First"
 CHI_end_exploitation.6.d: "Word arrives from Tokyo: the Empire has chosen not to contest our independence. Whether from exhaustion, distraction with other enemies, or simple reluctance to bleed for a rebellious client, Japan has let us go without a fight. Our people are jubilant - we have won our freedom without firing a shot."
 CHI_end_exploitation.6.a: "A great day for our nation!"

 CHI_end_exploitation.7: "The Third Sino-Japanese War"
 CHI_end_exploitation.7.t: "The Third Sino-Japanese War Begins"
 CHI_end_exploitation.7.d: "The Empire of Japan has refused to recognize the independence of its former client, and has moved to crush the rebellion by force of arms. A third war between China and Japan has begun, one that will decide whether the breakaway government survives as a free nation or is dragged back under Tokyo's rule."
 CHI_end_exploitation.7.a: "We will not be subjugated again!"
 CHI_end_exploitation.7.b: "This rebellion will be crushed"
 CHI_end_exploitation.7.e: "Asia burns once more"

 CHI_end_exploitation.8: "A Price for Peace"
 CHI_end_exploitation.8.t: "Independence, at a Price"
 CHI_end_exploitation.8.d: "Tokyo has proposed a compromise: Japan will recognize our independence and withdraw its garrisons, provided our factories continue to fill Japanese order books. It is a lesser indignity than outright war, but our government must decide whether the terms are one we are willing to live with."
 CHI_end_exploitation.8.a: "A price worth paying"
 CHI_end_exploitation.8.b: "We will not be bought - freedom or nothing!"

 CHI_end_exploitation.9: "Terms Accepted"
 CHI_end_exploitation.9.t: "Nanjing Accepts the Terms"
 CHI_end_exploitation.9.d: "Word arrives from the breakaway government: they have accepted our terms. Independence will be recognized, and in exchange our industries will continue to draw on their factories. A quieter, more profitable arrangement than a costly war of reconquest."
 CHI_end_exploitation.9.a: "A satisfactory outcome"

