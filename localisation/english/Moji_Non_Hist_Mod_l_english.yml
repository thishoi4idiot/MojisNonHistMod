 # Focus Descriptions
 USA_american_corporatism_desc: "Corporatism is an ideology that believes the state should be responsible for coordinating cooperation between organized groups. State-recognized unions representing workers and industry associations representing employers will work together to negotiate policy regarding economy and society, all under state supervision."
 USA_begin_collectivization_desc: "In all sectors of the economy, there are tons of small privately owned companies with few employees. They are inefficient and unproductive. We will combine these companies to increase productivity."
 USA_begin_indoctrination_desc: "To ensure that there are no citizens that end up being fooled or misinterpreting the regime, we must launch a campaign to educate our people about the beauty of communism."
 USA_begin_rearmament_desc: "With the world on the brink of another great war, it is imperative that we begin rearming our military to defend our interests and assert our power on the global stage."
 USA_begin_the_first_five_year_plan_desc: "The American industry is a large and complex system. It will take years to fully reorganize it into the socialist utopia that we desire. Therefore we must launch the five year plan."
 USA_class_war_desc: "A worker can never truly be free if they are forced to work alongside the bourgeoisie. To truly liberate the worker we must launch an all out class war against all the capitalist oppressors."
 USA_collaborate_with_the_church_desc: "Christianity is the cornerstone of American society. It is important that the state works together with the church to maintain traditional American society."
 USA_commence_agricultural_collectivization_desc: "There are many small privately owned farms across America. Just like with the small companies, they are inefficient and unproductive. If we were to combine these smaller farms into larger collective ones, we would prosper from economy of scale and increase our agricultural output."
 USA_crack_down_on_civil_rights_protest_desc: "As a result of the Jim Crow laws, large scale civil rights protest has risen across the country. We must bring an end to this at once!"
 USA_destroy_the_counterrevolutionaries_desc: "The politburo has discovered counterrevolutionaries within our borders plotting to overthrow our regime. We must launch an initiative to destroy them before they destroy us."
 USA_eliminate_decadence_desc: "The democratic principles of debating and negotiating every single action is a luxury our regime cannot afford. With enemies plotting to end us everywhere, we must destroy decadence."
 USA_embrace_authoritarian_marxist_ideals_desc: "Some elements of the American socialist movement have suggested compromise with the capitalist scum and create a social democratic state. We must seize control and establish an authoritarian socialist regime to secure the workers' revolution and destruction of capitalism."
 USA_expand_jim_crow_laws_desc: "The Jim Crow laws of the south were made to ensure white rule remains unchallenged. With increasing amounts of minorities, not only in the south but all across the country, these laws must become even stricter and must be spread to the rest of the country as well."
 USA_glorify_the_military_desc: "Any great country must have a great military. We must ingrain the military in our culture, making our people admire our brave soldiers, strengthening our military and our population."
 USA_improve_plane_models_desc: "With the expanded military industrial complex, we can now begin cooperation with certain corporations to improve plane models."
 USA_improve_rifle_models_desc: "With the expanded military industrial complex, we can now begin cooperation with certain corporations to improve rifle models."
 USA_improve_ship_models_desc: "With the expanded military industrial complex, we can now begin cooperation with certain corporations to improve ship models."
 USA_improve_tank_models_desc: "With the expanded military industrial complex, we can now begin cooperation with certain corporations to improve tank models."
 USA_increase_oil_revenues_desc: "With oil operations expanding, we have a larger surplus of oil, one that can be exported abroad for immense profits."
 USA_integrate_new_deal_democrats_and_social_democrats_desc: "There is still good will amongst the less radical parts of the socialist movement and even the new deal democrats. If we reach out to these groups, we could perhaps gain their support increasing our regime's legitimacy."
 USA_last_bastion_of_socialism_desc: "With all other major socialist regimes destroyed, we stand as the last bastion of socialism in the world. We must create a new alliance for socialist state, shielding the new world from capitalist and fascist aggression and to liberate the workers of the old world."
 USA_late_war_industry_desc: "As the war grinds on, The World in Flames, the full  power of American industry must be unleashed. Every Factory must be dedicated to the war effor for it is a matter of life and death for democracy"
 USA_light_the_fuse_desc: "With Fascism on the rise in Asia we must intervene to stop the spread of this dangerous ideology."
 USA_nationalize_the_federal_reserve_desc: "The federal reserve is yet another capitalist institution designed to oppress the workers of America. To accomplish our socialist utopia we must tear down this oppressive institution."
 USA_promote_family_values_desc: "It is important that we prioritise promoting family values above all else. A truly great society starts with stable families."
 USA_protestant_primacy_desc: "America has traditionally been a protestant society. It is only after undesired immigrants came to our country that catholicism started gaining influence. To restore America to its former glory, it is important that we reestablish protestantism as the primary force in American society."
 USA_reconcilliation_with_catholics_desc: "More radical members of our movement have gone as far as to dislike the catholics. At the end of the day we are all christian and it is important that we stick together to secure our collective future."
 USA_reorganize_the_fbi_desc: "The FBI was made to protect the United States against terrorism, federal crimes and public corruption. However, in its current state it is incapable of these tasks. If we are to make our revolution a lasting one, we must reorganize the FBI so that we can use it to expose corrupt parts of the government and terrorists within our borders."
 USA_seize_private_property_desc: "The United States is the richest nation on earth, yet for the common man this is hardly noticeable. Greedy capitalists hoard wealth at the expense of everyone else. The state needs to seize this properly and equally redistribute it to the rest of the population."
 USA_socialism_achieved_desc: "After several radical reforms in the economy, political scene and society we have finally achieved the socialist utopia that Marx dreamed of."
 USA_state_atheism_desc: "Religion is yet another tool of the elite to control and oppress the common man. If we are to truly liberate the people we must rid our country of the oppressive religious institutions that infect America."
 USA_strengten_the_military_industrial_complex_desc: "With widespread support for the military and a new economic system well-established, we now have the support and capabilities to begin a large-scale expansion of the military industrial complex."
 USA_support_standard_oil_of_california_desc: "Standard Oil of California is a marvelous company, excavating vast amounts of resources to fuel our economy. We must support their operations."
 USA_the_american_dream_desc: "The american dream is the ethos that all Americans can achieve prosperity, regardless of social class, through hard work, determination and initiative. Despite our recent hardships, it is important that we stay true to this ethos."

 # Events
 usa_demands.1.t: "The United States demands Greenland!"
 usa_demands.1.d: "The United States has issued an ultimatum demanding that we cede control of Greenland to them. This is a significant challenge to our sovereignty and we must respond decisively."
 usa_demands.1.a: "It is a dark day for our nation, but we must comply with their demands."
 usa_demands.1.b: "We will not give up our lands!"
 usa_demands.2.t: "They accepted our demands!"
 usa_demands.2.d: "After tense negotiations, the Denmark has accepted our demands to cede Greenland to us."
 usa_demands.2.a: "Our empire grows stronger!"
 usa_demands.3.t: "They rejected our demands!"
 usa_demands.3.d: "Despite our efforts to negotiate, the Denmark has rejected our demands to cede Greenland to us."
 usa_demands.3.a: "Who do they think they are to reject our demands?"
 usa_demands.3.b: "We will find another way to acquire Greenland."
 usa_demands.4.t: "The United States demands our withdrawal from the continent!"
 usa_demands.4.d: "The United States has issued an ultimatum demanding that we withdraw from the continent and allow them to dominate North America. This is a direct challenge to our sovereignty and we must respond decisively."
 usa_demands.4.a: "We will not give up our colonies without a fight!"
 usa_demands.4.b: "Let us get out of their way and focus on our own affairs."
 usa_demands.5.t: "The [FROM.GetName] accepted our demands!"
 usa_demands.5.d: "The [FROM.GetName] has accepted our demands and agreed to withdraw from the continent."
 usa_demands.5.a: "Our diplomacy has paid off!"
 usa_demands.6.t: "The [FROM.GetName] rejected our demands!"
 usa_demands.6.d: "Despite our efforts to negotiate, the [FROM.GetName] has rejected our demands to withdraw from the continent."
 usa_demands.6.a: "We will not back down from our claims!"
 usa_demands.6.b: "This is not worth the trouble."

