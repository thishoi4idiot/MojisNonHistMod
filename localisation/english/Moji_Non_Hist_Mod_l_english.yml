 the_bessarabian_war_category: "The Bessarabian War"
 BesserabianWarCountdown: "Running out of steam"
 BesserabianWarCountdown_desc: "Time is running out for the Soviet campaign in Bessarabia. Should the war continue for too long, Moscow will have no choice but to agree to an Armistice with Romania."
 sue_for_peace: "Sue For Peace"
 sue_for_peace_tooltip: "We surrender §YBessarabia§! to the §YSoviet Union§! and end the war."

