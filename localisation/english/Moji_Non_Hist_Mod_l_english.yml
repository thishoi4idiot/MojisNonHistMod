 ROM_carpathia_for_axis_membership_desc: "With Germany occupying and puppeting Slovakia we have no hope of reclaiming Carpathia but if we were to join the Axis powers, we could perhaps negotiate with Germany to cede Carpathia to us in exchange for our support in the war effort."
 ROM_demand_west_banat_desc: "With the kingdom of Yugoslavia weak we have a chance to take the Banat region for ourselves"
 ROM_expel_non_romanians_desc: "With the recent territorial gains, we have a large population of non-Romanians within our borders. To ensure the unity and stability of our nation, we must expel these non-Romanian elements and create a more homogenous society."
 ROM_proclaim_greater_romania_desc: "With our recent territorial gains, we are now in a position to proclaim Greater Romania, uniting all Romanian lands under one flag. This is a historic moment for our nation and a step towards fulfilling our national aspirations."

 # Events
 RomaniaDemands.1.t: "Romania demands West Banat!"
 RomaniaDemands.1.d: "The Romanian government has issued an ultimatum to the Yugoslavian government, demanding the cession of West Banat to Romania. The question now is whether we will accept this demand or fight for our sovereign territory."
 RomaniaDemands.1.a: "Its Hopeless"
 RomaniaDemands.1.b: "Banat will remain Slavic!"
 RomaniaDemands.2.t: "They accepted our demands!"
 RomaniaDemands.2.d: "After much preasure, the Yugoslavian government has accepted our demands and has agreed to cede West Banat to Romania. This is a great victory for our nation and a step towards our goal of uniting all Romanian lands."
 RomaniaDemands.2.a: "A great victory for our nation!"
 RomaniaDemands.3.t: "They rejected our demands!"
 RomaniaDemands.3.d: "Despite our efforts to negotiate, the Yugoslavian government has rejected our demands for West Banat. We will not give up our claim to this territory and will continue to fight for it."
 RomaniaDemands.3.a: "Let us fight for what is ours..."
 RomaniaDemands.4.t: "Carpathia for Axis Membership!"
 RomaniaDemands.4.d: "The Romanian government has asked for the cession of Carpathia in exchange for joining the Axis powers. The question now is whether we will accept this offer and join the Axis, or reject it and face the consequences."
 RomaniaDemands.4.a: "Bring Romania into the fold!"
 RomaniaDemands.4.b: "Slovakia will not be sacrificed for the ambitions of Romania!"
 RomaniaDemands.5.t: "They accepted our offer!"
 RomaniaDemands.5.d: "After much negotiation, the German government has accepted our offer and has agreed to cede Carpathia to Romania in exchange for joining the Axis powers"
 RomaniaDemands.5.a: "A great victory for our nation!"
 RomaniaDemands.6.t: "They rejected our offer!"
 RomaniaDemands.6.d: "Despite our efforts to negotiate, the German government has rejected our offer to join the Axis powers in exchange for Carpathia. We will not give up our claim to this territory and will continue to fight for it."
 RomaniaDemands.6.a: "We will be back for what is ours!"
