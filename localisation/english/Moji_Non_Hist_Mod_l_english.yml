 SOV_renegotiate_the_agreements_desc: "The Kalinin Agreements were forged as a fragile compromise to guarantee labor peace and steady industrial output. However, as the demands of the state evolve and the shadow of global conflict grows, these treaties have become a bottleneck. We must carefully navigate our relationship with the trade unions—either by restructuring our promises, testing the limits of their compliance, or stripping away their privileges entirely to fuel the Soviet war machine."

 the_national_military_industrial_complex: "National Military Industrial Complex"
 SOV_complete_industrial_agrarianism_idea: "Complete Industrial Agrarianism"

 test_the_trade_unions: "Test the trade unions"
 exploit_the_trade_unions: "Exploit the trade unions"
 throw_out_the_kalinin_agreement: "Throw out the kalinin agreement"
 test_the_trade_unions_desc: "Temporarily adjust our labor policies to gauge the syndicates' tolerance for increased state quotas."
 exploit_the_trade_unions_desc: "Permanently break the unions' leverage to extract maximum factory output, regardless of the social cost."
 throw_out_the_kalinin_agreement_desc: "Tear up the pact entirely. In times of national crisis, the state demands total submission from the workforce."

 SOV_the_orthodox_church: "The Orthodox Church"
 SOV_the_orthodox_church_desc: "The Orthodox Church has been a pillar of Russian society for centuries but under communism it has been heavily persecuted and weakened. Now with the fall of communism we have the opportunity to restore the church to its former glory and use it as a tool to unify the people and promote our ideology."
 SOV_freedom_of_worship: "Freedom of Worship"
 SOV_freedom_of_worship_desc: "With russia now on the way to democracy let us guarantee religious liberties to all of our citizens and allow them to worship freely without fear of persecution."

 SOV_northern_ports_expansion_ns: "Northern Ports Expansion"
 SOV_northern_ports_expansion_ns_desc: "The rapid build-out of Murmansk and Arkhangelsk has left our shipyards flush with fresh workers and machinery. For a time, our dockyards will produce far more efficiently than usual."

 SOV_empowered_peasantry_spirit: "Land Reform"
 SOV_a_constitutional_czar: "A Constitutional Czar"

 SOV_the_russian_republic: "The Russian Republic"
 SOV_the_russian_federation: "The Russian Federation"

 SOV_unintended_consequences_tt: "Deposing the Tsar could have some\n§Yunintended consequences...§Y"

 # Republican Unrest Chain
 democratic_russia.5.t: "Unrest Across the Steppe"
 democratic_russia.5.d: "Reports are arriving in Petrograd from our governors in Central Asia. In the markets of Tashkent, the tea houses of Samarkand, and the yurts of the Kazakh steppe, talk of the new Russian Republic has stirred old resentments. Local mullahs and tribal leaders are questioning what place their people have in this new order. Our administrators warn that without careful handling, the region could become difficult to govern."
 democratic_russia.5.a: "These are nomads and peasants. They will settle down."
 democratic_russia.5.b: "Send a delegation to hear their concerns."

 democratic_russia.6.t: "Civil Unrest in Kiev"
 democratic_russia.6.d: "The proclamation of the Russian Republic has sent shockwaves through the empire's borderlands. In Kiev, crowds have taken to the streets, demanding greater rights and recognition. The new government's authority is being tested before it has even had time to establish itself."
 democratic_russia.6.a: "Dispatch troops to restore order."

 democratic_russia.7.t: "Protests Erupt in Minsk"
 democratic_russia.7.d: "News of the Kiev unrest has spread quickly. In Minsk, workers and nationalists have organized mass protests, waving Belarusian flags and calling into question whether they truly belong in this new Russian Republic."
 democratic_russia.7.a: "We must weather this storm."

 democratic_russia.8.t: "Ukraine is Unstable"
 democratic_russia.8.d: "The unrest has spread across Ukraine. Local councils are refusing to enforce directives from Petrograd, and armed militias have begun to form in the countryside. The situation is deteriorating rapidly."
 democratic_russia.8.a: "The Republic will hold together."

 democratic_russia.9.t: "Baku in Flames"
 democratic_russia.9.d: "Ethnic tensions in Baku have boiled over into open violence. Azeri and Armenian communities are clashing in the streets, oil workers are striking, and the local garrison has been overwhelmed. The Caucasus threatens to slip from our grasp entirely."
 democratic_russia.9.a: "Send reinforcements to the region immediately."

 democratic_russia.10.t: "Belarus Demands Autonomy"
 democratic_russia.10.d: "A delegation from Minsk has arrived in Petrograd with a formal ultimatum: grant Belarus full autonomy within the Republic, or face a declaration of independence. The young republic cannot afford to appear weak, but it cannot afford a civil war either."
 democratic_russia.10.a: "Grant Belarus its autonomy. Let them go in peace."
 democratic_russia.10.b: "Never. The Republic is indivisible."

 democratic_russia.11.t: "Ukraine Demands Autonomy"
 democratic_russia.11.d: "Emboldened by the Belarusian situation, the Ukrainian Rada has issued its own demands. Ukraine, they argue, is a nation unto itself and will not be governed from Petrograd. The breadbasket of Russia now hangs in the balance."
 democratic_russia.11.a: "Grant Ukraine its autonomy. Better a friendly neighbor than a hostile province."
 democratic_russia.11.b: "Ukraine is Russian soil. We will not yield."

 democratic_russia.12.t: "Transcaucasia Seeks Autonomy"
 democratic_russia.12.d: "Georgia, Armenia, and Azerbaijan have jointly announced the formation of a Transcaucasian committee and demand recognition as a self-governing federation. The Caucasus has always been difficult to govern and with the empire in transition, the window to hold these lands by force is narrowing."
 democratic_russia.12.a: "Let them form their own states. We wish them well."
 democratic_russia.12.b: "The Caucasus belongs to Russia. We will crush this rebellion."

 democratic_russia.13.t: "Turkestan Demands Autonomy"
 democratic_russia.13.d: "The peoples of Central Asia have long chafed under Russian rule. Now, emboldened by the concessions granted to Belarus, Ukraine, and the Caucasus, representatives from Kazakhstan, Uzbekistan, Kyrgyzstan, Tajikistan, and Turkmenistan have gathered in Tashkent and issued a joint declaration demanding autonomy. They propose a unified Turkestan — a single state to represent all the peoples of the steppe and desert. The Republic cannot ignore this."
 democratic_russia.13.a: "Grant them their Turkestan. Let the steppe govern itself."
 democratic_russia.13.b: "Central Asia is Russian soil. We will crush this rebellion."


 SOV_belarusian_crackdown: "Belarusian Crackdown"
 SOV_belarusian_crackdown_desc: "The brutal suppression of Belarusian autonomy demands has left deep wounds. Resentment festers across the western borderlands and the republic's legitimacy is questioned at home and abroad."

 SOV_ukrainian_crackdown: "Ukrainian Crackdown"
 SOV_ukrainian_crackdown_desc: "The forceful rejection of Ukrainian autonomy has triggered widespread resistance. Partisan activity, economic disruption, and international condemnation weigh heavily on the young republic."

 SOV_transcaucasian_crackdown: "Transcaucasian Crackdown"
 SOV_transcaucasian_crackdown_desc: "Suppressing the Transcaucasian autonomy movement has plunged the region into chaos. Guerrilla fighting, ethnic violence, and the diversion of vital military resources have severely strained the republic."

 SOV_turkestan_crackdown: "Turkestan Crackdown"
 SOV_turkestan_crackdown_desc: "The brutal suppression of Central Asian autonomy demands has ignited a vast insurgency across the steppe. Guerrilla warfare, sabotage of vital rail lines, and the sheer distances involved are stretching the Republic's military and administrative capacity to its limits."

 MNHM_SOV_the_lonely_island: "The Lonely Island"
