 USA_develop_west_mountains_resources_desc: "The rockies are rich in various resources. To supply our growing industry, we must refine our excavation technology to excavate more resources."
 USA_prioritize_aluminium_desc: "Plane and automobile production will take priority in the American industry, therefore it is vital to expand our aluminium reserves."
 USA_prioritize_chromium_desc: "America is surrounded by the two largest oceans on earth. It is of utmost importance that we have enough chromium to supply a grand navy to defend our shores."
 USA_prioritize_tungsten_desc: "As the world enters war yet again, tank and artillery production becomes a priority to secure American interest. That makes it vital that we have a steady supply of tungsten."

