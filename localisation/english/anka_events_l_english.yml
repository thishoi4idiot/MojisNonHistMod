l_english:
 GCMP_Latvia.1.t:0 "The Coronation in Riga"
 GCMP_Latvia.1.d:0 "Heinrich Schlobitten has been crowned Duke of the United Baltic Duchy in a lavish ceremony in Riga. Though the new state is independent, the placement of a German noble on the Latvian throne has sparked widespread resentment. The people tolerate the coronation in silence, but their displeasure simmers just beneath the surface. The Duke must tread carefully, for his crown is light, and the temper of the masses is short."
 GCMP_Latvia.1.a:0 "Long Live the King!"
 GCMP_Latvia.1.b:0 "Long Live the King!"
 GCMP_Latvia.2.t:0 "The Question of Our History"
 GCMP_Latvia.2.d:0 "The secular crown of the Duchy feels increasingly fragile in a world dominated by fanatical ideologies. To forge an unbreakable state, Duke Heinrich looks to the ancient crusading orders that first brought civilization to the Baltic shores. By reassessing our heritage, we may abandon the modern Duchy entirely, re-establishing ourselves as a holy military order. The choice lies between the Livonian and the Teutonic traditions."
 GCMP_Latvia.2.a:0 "Restore the Livonian Order!"
 GCMP_Latvia.2.b:0 "Reclaim the Teutonic Mantle!"
