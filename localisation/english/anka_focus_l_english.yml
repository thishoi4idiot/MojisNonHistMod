l_english:
 Baltic_German_Focus_1:0 "The Riga Coronation"
 Baltic_German_Focus_1_desc:0 "The United Baltic Duchy is born, an independent nation spanning the Baltic coast. However, the choice of a German monarch has proven deeply unpopular with the Latvian people. To them, the crown is a symbol of foreign arrogance, not national pride. We must navigate the bitter resentment of our own citizens if this new Duchy is to survive the storms to come."
 Baltic_German_Focus_2:0 "Against The Führer"
 Baltic_German_Focus_2_desc:0 "Though he was born on German soil, Duke Heinrich's loyalty lies with his conscience, not with the madman in Berlin. As the Third Reich descends further into tyranny and brutality, the Duke has made his stand clear: the United Baltic Duchy will not be a vassal to fascism. Burning his telegrams from Berlin and openly condemning the persecution of the innocent, Heinrich aligns his nation against the Führer. It is a perilous gambit that invites the wrath of the Wehrmacht, but to the Duke, a crown is meaningless if it is stained with the blood of the unjust."
 Baltic_German_Focus_3:0 "Remove The Opposition"
 Baltic_German_Focus_3_desc:0 "The survival of the United Baltic Duchy cannot be left to the whims of angry mobs and dissident politicians. To Duke Heinrich, the endless strikes, republican agitation, and nationalist paramilitaries are not expressions of freedom, but a fatal weakness in a hostile world. By royal decree, opposition factions are outlawed, their leaders detained, and their presses silenced. The Latvian people may despise their German monarch, but they will obey him, for the Duke is determined to save the nation from itself, even if he must rule with an iron fist."
 Baltic_German_Focus_4:0 "Call Upon the Exiled Monarchy"
 Baltic_German_Focus_4_desc:0 "With the throne in Riga firmly established, Duke Heinrich has sent emissaries to the courts of Europe, calling upon the displaced nobility, Baltic German barons, and loyalist retainers scattered across the continent. Though their ancestral lands may have been lost to revolution or republicanism, their loyalty to the crown remains absolute. Answering the Duke's summons, these exiled aristocrats and their private retinues are flocking to the United Baltic Duchy, offering their swords, their wealth, and their sons to the defense of the new realm."
 Baltic_German_Focus_6:0 "Completing the Duchy"
 Baltic_German_Focus_6_desc:0 "The United Baltic Duchy cannot be truly 'united' while the northern reaches of the Livonian coast remain outside our grasp. Estonia, historically intertwined with the Baltic German nobility, shares our destiny. Duke Heinrich has issued a formal ultimatum to Tallinn, demanding the integration of the Estonian state into our realm. We must secure the entirety of the Baltic coastline to forge a nation capable of standing against the great powers. If the Estonians refuse to accept the crown's protection, then our armies must march north to ensure it."
 Baltic_German_Focus_5:0 "Preparing for Unification"
 Baltic_German_Focus_5_desc:0 "The maps in the Riga war room are being redrawn. Before we can issue our ultimatums to the north, our armed forces must be primed for a swift, decisive offensive. The Duke has ordered the rapid expansion of our officer corps, the stockpiling of munitions, and relentless drilling of our infantry in breakthrough tactics. When the time comes to unite the Baltic coast, our army must strike like lightning, overwhelming our neighbors before the great powers can intervene."
 Baltic_German_Focus_7:0 "A Truly Equal Union"
 Baltic_German_Focus_7_desc:0 "For too long, the Baltic peoples have been divided by arbitrary lines and foreign schemes. With the northern lands now under the Duke's crown, we must prove that our union is not one of conqueror and conquered. By elevating Estonian statesmen to the highest ministries in Riga and investing heavily in the economic development of Reval and Dorpat, we forge a shared 'Baltic' identity. Whether Latvian, Estonian, or Baltic German, all citizens of the Duchy now stand as equals before the law. The resentment of occupation gives way to the pride of a shared, sovereign destiny."
 Baltic_German_Focus_8:0 "Unyielding Will"
 Baltic_German_Focus_8_desc:0 "Duke Heinrich has stared into the abyss of Nazi tyranny and refused to blink. Having witnessed the horrors of the concentration camps firsthand, the Duke has sworn that the Baltic soil will never bow to the swastika. Our troops are drilled relentlessly in anti-Wehrmacht tactics, knowing that surrender to Hitler means annihilation."
 Baltic_German_Focus_9:0 "Nationalize Western Assets"
 Baltic_German_Focus_9_desc:0 "For decades, British, French, and American capitalists have treated the Baltic ports as little more than a piggy bank, extracting vast wealth while providing little in return. Now, as the continent braces for war, the Duke has decreed the immediate seizure of all Western-owned industrial holdings, shipyards, and trade houses within the Duchy. Let London and Paris howl in protest; their foreign dividends will no longer line the pockets of distant shareholders. These factories now belong to the Baltic state, and their output will fuel our war machine, not Western bank accounts."
 Baltic_German_Focus_10:0 "Agrarian Reform Act"
 Baltic_German_Focus_10_desc:0 "For centuries, the Baltic German barons have held a stranglehold on the most fertile lands, leaving the Latvian and Estonian peasantry landless and destitute. Duke Heinrich signs the Agrarian Reform Act, forcibly breaking up the vast estates and redistributing the land to the farmers who actually till it. It alienates his fellow nobles, but earns him the eternal loyalty of the rural masses."
 Baltic_German_Focus_11:0 "Study the Wehrmacht"
 Baltic_German_Focus_11_desc:0 "We know the German war doctrine better than anyone, for we were once part of it. Our officers, many of whom served in the Imperial German Army, are now dissecting the new mobile warfare theories of the Third Reich. By studying their hypothetical deployment plans and tank formations, we can identify their blind spots and train our men to exploit the rigid Prussian arrogance of the German high command."
 Baltic_German_Focus_12:0 "Noblesse Oblige"
 Baltic_German_Focus_12_desc:0 "To the aristocrat, immense wealth is not a right, but a responsibility. The Duke opens the royal coffers and his vast personal estates to fund orphanages, veteran care, and agricultural subsidies for struggling Latvian farmers. This blatant charity is an entirely foreign concept to the local politicians, but it works. The people may not love the crown yet, but they can no longer deny the goodness of the man who wears it."
 Baltic_German_Focus_13:0 "The Riga Diet Convenes"
 Baltic_German_Focus_13_desc:0 "To distance himself from the image of an absolute tyrant, Duke Heinrich has authorized the opening of the Riga Diet. By allowing delegates from the Baltic German aristocracy, the Latvian farmer's unions, and the Estonian provincial councils to voice their grievances, the Duke hopes to foster a spirit of cooperation. It is a risky gamble—giving the angry populace a microphone—but it is the only way to rule without relying solely on the bayonet."
 Baltic_German_Focus_14:0 "Reassess Our Heritage"
 Baltic_German_Focus_14_desc:0 "The secular crown of the Duchy feels increasingly fragile in a world dominated by fanatical ideologies. To forge an unbreakable state, Duke Heinrich looks to the ancient crusading orders that first brought civilization to the Baltic shores. By reassessing our heritage, we may abandon the modern Duchy entirely, re-establishing ourselves as a holy military order. The choice lies between the Livonian and the Teutonic traditions."
 Baltic_German_Focus_16:0 "The Teutonic Legacy"
 Baltic_German_Focus_16_desc:0 "Faith and steel are eternal, even if empires fall. The modern era of democratic frailty and fascist madness has no place in the Baltic. To survive, we must become a state of warrior-monks. Duke Heinrich formally abdicates his secular ducal throne to take up the crozier and sword of the Teutonic Order. The Duchy's military is dissolved and reborn as a holy brotherhood, bound by monastic vows to defend Christendom and reclaim our ancestral dominion over the East. Let the dictators of Berlin and Moscow tremble; the Knights march again."
 Baltic_German_Focus_15:0 "The Livonian Legacy"
 Baltic_German_Focus_15_desc:0 "The Teutonic mantle belongs to Berlin and Königsberg; our soul belongs to Livonia. By invoking the Livonian Legacy, we shed the skin of a foreign German Duchy to become the true inheritors of the northern crusades. The new Landmeister calls upon Latvians, Estonians, and Baltic Germans alike to take up the sword and the cross, forging a new, localized militant identity. We no longer rule as distant aristocrats, but as brothers-in-arms. Let the empires of the East and West clash; we shall be the anvil that breaks their armies."
