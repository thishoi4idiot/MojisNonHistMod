l_english:
 tannu_tuva_tree:0 "Tannu Tuva"

 TAN_enforce_aksa:0 "Enforce the Akşa"
 TAN_enforce_aksa_desc:0 "Our markets are a chaotic mix of barter, old coins and foreign rubles, bleeding our wealth across the border. By making the Tuvan Akşa the only legal currency, the State can finally set the price of our wool, hides and gold."
 TAN_kyzyl_workshops:0 "Found the Kyzyl Workshops"
 TAN_kyzyl_workshops_desc:0 "Almost nobody in Tuva works for a wage. Soviet engineers will help us raise the first tanneries, brickworks and wool-cleaning sheds in Kyzyl, and with them the first state workers."
 TAN_soviet_trade_monopoly:0 "Soviet Trade Monopoly"
 TAN_soviet_trade_monopoly_desc:0 "The Soviet Union will be our sole legal trading partner. Raw materials flow north; machinery, cloth and tools flow back. The State decides the prices."
 TAN_state_herd_registry:0 "State Herd Registry"
 TAN_state_herd_registry_desc:0 "Our true wealth is counted in heads of livestock. Every herd will be registered and every head accounted for, giving the State a ledger it has never had."
 TAN_mechanize_mines:0 "Mechanize the Mines"
 TAN_mechanize_mines_desc:0 "Gold, chromium and other raw materials pay for everything we import. Soviet drills and hoists will let us dig far more than shovels ever could."
 TAN_russian_labor_colonies:0 "Russian Labor Colonies"
 TAN_russian_labor_colonies_desc:0 "We have the land but not the know-how. Russian technicians and their families will settle in Kyzyl to run the engines and teach our people to run them in turn."
 TAN_sedentary_mandate:0 "The Sedentary Mandate"
 TAN_sedentary_mandate_desc:0 "A planned economy cannot be built on yurts that move with the seasons. The herdsmen will be settled into collectives. They will not thank us for it."

 TAN_barter_economy:0 "Barter Economy"
 TAN_barter_economy_desc:0 "Rubles, old coins and livestock all circulate as money. The State cannot tax what it cannot count."
 TAN_no_industrial_base:0 "No Industrial Base"
 TAN_no_industrial_base_desc:0 "No power plants, no machinery and almost no one who has ever worked a factory floor."
 TAN_nomadic_herding_legacy:0 "Nomadic Herding Legacy"
 TAN_nomadic_herding_legacy_desc:0 "Over nine in ten Tuvans follow their herds across the mountains. There are no roads to speak of, and Soviet advisors have a say in every decision."
 TAN_soviet_trade_monopsony:0 "Soviet Trade Monopoly"
 TAN_soviet_trade_monopsony_desc:0 "All external trade passes through the Soviet Union, which sets the terms but also supplies the machinery."
 TAN_nomadic_unrest:0 "Nomadic Unrest"
 TAN_nomadic_unrest_desc:0 "Herdsmen forced to settle are slaughtering their own animals rather than hand them over."
 TAN_state_herd_registry_idea:0 "State Herd Registry"
 TAN_state_herd_registry_idea_desc:0 "Every herd is registered, so the State finally knows what the nation owns."
 TAN_russian_labor_colonies_idea:0 "Russian Labor Colonies"
 TAN_russian_labor_colonies_idea_desc:0 "Russian specialists and their families run Kyzyl's engines and train Tuvans to take over."

 TAN_revolutionary_army:0 "Strengthen the Revolutionary Army"
 TAN_revolutionary_army_desc:0 "Our army is a handful of regiments of herdsmen on horseback. Soviet instructors will turn them into a disciplined force loyal to the Revolution."
 TAN_seek_soviet_assistance:0 "Seek Soviet Assistance"
 TAN_seek_soviet_assistance_desc:0 "Our soldiers share what few rifles we have. Moscow has the arms and the instructors; all we have to do is ask."
 TAN_steppe_cavalry:0 "Uplift the Cavalry Regiments"
 TAN_steppe_cavalry_desc:0 "Our riders know every pass and pasture. The cavalry regiments will be the backbone of the army, mounted, mobile and at home in the open country."
 TAN_border_guards:0 "Uplift the Mountain Brigades"
 TAN_border_guards_desc:0 "The mountains are our walls. Hardy brigades trained for the high passes and the long frontier will hold them against any enemy."
 TAN_soviet_military_mission:0 "Soviet Military Mission"
 TAN_soviet_military_mission_desc:0 "Red Army officers will teach our commanders staff work, artillery and supply."
 TAN_mobilize_herdsmen:0 "The Tuvan People's Army"
 TAN_mobilize_herdsmen_desc:0 "Every herdsman can ride and shoot. Registered, trained and equipped, they become the army of a people in arms."
 TAN_steppe_cavalry_idea:0 "Steppe Cavalry"
 TAN_steppe_cavalry_idea_desc:0 "Our horsemen move fast and live off the land."
 TAN_border_guards_idea:0 "Frontier Guards"
 TAN_border_guards_idea_desc:0 "Guard posts along the mountain passes."
 TAN_transitioning_economy:0 "Transitioning Economy"
 TAN_transitioning_economy_desc:0 "The Akşa is law, but old habits die hard. Herders and traders alike are adjusting to the new currency, and the State is building to catch up."
 TAN_small_industrial_base:0 "Small Industrial Base"
 TAN_small_industrial_base_desc:0 "The Kyzyl workshops have given us a handful of trained workers and working machines. It is a start, but a small one."
 TAN_soviet_military_cooperation:0 "Soviet Military Cooperation"
 TAN_soviet_military_cooperation_desc:0 "Soviet instructors and quartermasters work alongside our army."
 TAN_begin_five_year_plan:0 "Begin Our Five Year Plan"
 TAN_begin_five_year_plan_desc:0 "Our mines are open, our workers are trained and our herdsmen are settled. For the first time Tuva has the means to plan its economy rather than react to it. Quotas will be set in Kyzyl and the Revolution will be built to schedule."
 TAN_five_year_plan:0 "The Five Year Plan"
 TAN_five_year_plan_desc:0 "Every workshop, mine and herd now answers to a quota."
 TAN_crumbling_infrastructure:0 "Crumbling Infrastructure"
 TAN_crumbling_infrastructure_desc:0 "Roads are little more than tracks, bridges are washed out each spring and half-built clinics and schools stand abandoned for want of funds. Moving anything across Tuva is slow and costly."
 TAN_connect_trans_siberian:0 "Connect to the Trans-Siberian Railway"
 TAN_connect_trans_siberian_desc:0 "The great railway runs a few hundred kilometers to our north. A branch line to Kyzyl will bring machinery in and raw materials out, and end the isolation of the Tuvan interior."
 TAN_transformation_of_nature:0 "Transformation of Nature"
 TAN_transformation_of_nature_desc:0 "The steppe and mountain valleys will be irrigated, planted and put to work. Nature is not to be endured but remade to serve the plan."
 TAN_transformation_of_nature_idea:0 "Transformation of Nature"
 TAN_transformation_of_nature_idea_desc:0 "Irrigation, shelterbelts and state farms are reshaping the land."
 TAN_request_soviet_aid:0 "Request Soviet Aid"
 TAN_request_soviet_aid_desc:0 "Tuva's plan outpaces what Tuva can build alone. We will ask Moscow for a small sum to see the first projects through."
 TAN_develop_siberia_category:0 "Develop Siberia"
 TAN_develop_siberia_category_desc:0 "The Transformation of Nature has turned our eyes to the vast lands beyond our borders. With the Soviet Union's blessing, we can help open them up."
 TAN_aid.1.t:0 "Tannu Tuva Requests Aid"
 TAN_aid.1.d:0 "The Tuvan government has written to Moscow. Its plan is ambitious, its treasury is empty, and it asks for a small sum to see the first projects through. The amount is modest and Tuva is a loyal neighbour."
 TAN_aid.1.a:0 "Send the funds."
 TAN_aid.1.b:0 "Let them manage on their own."
 TAN_aid.2.t:0 "Moscow Grants Our Request"
 TAN_aid.2.d:0 "A courier from the north has arrived with a sealed packet of funds and a short letter of encouragement. The Soviet Union stands behind our plan."
 TAN_aid.2.a:0 "Our thanks to Moscow."
 TAN_aid.3.t:0 "Moscow Declines Our Request"
 TAN_aid.3.d:0 "The reply from Moscow is polite and brief. The Soviet Union has other priorities this year and Tuva must find its own way."
 TAN_aid.3.a:0 "We will manage."
 TAN_poor_infrastructure:0 "Crumbling Infrastructure"
 TAN_poor_infrastructure_desc:0 "Roads are little more than tracks, bridges are washed out each spring and half-built clinics and schools stand abandoned for want of funds. Moving anything across Tuva is slow and costly."
 TAN_poor_infrastructure_2:0 "Crumbling Infrastructure"
 TAN_poor_infrastructure_2_desc:0 "Roads are little more than tracks, bridges are washed out each spring and half-built clinics and schools stand abandoned for want of funds. Moving anything across Tuva is slow and costly."
 TAN_increase_trans_siberian_trade:0 "Increase Trade Along the Trans-Siberian Railway"
 TAN_increase_trans_siberian_trade_desc:0 "With the branch line open, wool, hides and ore can reach Soviet markets in days instead of weeks. More trains, more depots and more trade."
 TAN_subsidize_tuvan_industries:0 "Subsidize Tuvan Industries"
 TAN_subsidize_tuvan_industries_desc:0 "Our young workshops cannot yet stand on their own. The State will cover their losses until they can."
 TAN_increase_production_output:0 "Increase Production Output"
 TAN_increase_production_output_desc:0 "New machinery and trained hands are at work. Now the quotas must rise to match."
 TAN_trans_siberian_trade:0 "Trans-Siberian Trade"
 TAN_trans_siberian_trade_desc:0 "Goods flow north and south along the railway."
 TAN_increased_production_output:0 "Increased Production Output"
 TAN_increased_production_output_desc:0 "Our factories produce more with every shift."
 TAN_industrializing_economy:0 "Industrializing Economy"
 TAN_industrializing_economy_desc:0 "The Akşa is trusted, the workshops are running and subsidies keep them growing. The old barter economy is giving way to an industrial one."
 TAN_complete_five_year_plan:0 "Complete the Five Year Plan"
 TAN_complete_five_year_plan_desc:0 "The railway runs, the factories turn and the quotas are met. Tuva, once a land of herdsmen and barter, now has an industry of its own."
 TAN_strong_industrial_base:0 "Strong Industrial Base"
 TAN_strong_industrial_base_desc:0 "Years of planning, Soviet help and hard work have given Tuva a real industrial foundation."
 TAN_reclaim_siberian_wasteland:0 "Develop [FROM.GetName]"
 TAN_reclaim_siberian_wasteland_desc:0 "Irrigation, roads and a few settlers will turn barren or pasture land into a proper rural region."
 TAN_soviet_aid_burden:0 "Aid to Tannu Tuva"
 TAN_soviet_aid_burden_desc:0 "Funds sent to Tuva have to come from somewhere, and Soviet planners are feeling the pinch."
 TAN_work_with_moscow:0 "Work with Moscow"
 TAN_work_with_moscow_desc:0 "Our revolution cannot stand alone. Moscow has the experience, the advisors and the means to help. Our leaders will cooperate with the Party and its representatives in Kyzyl."
 TAN_hold_what_we_have:0 "Hold What We Have"
 TAN_hold_what_we_have_desc:0 "Tuva is small and its borders are long. Our task is to protect what the Revolution has built and not to risk it on foreign adventures."
 TAN_siberian_aspirations:0 "Siberian Aspirations"
 TAN_siberian_aspirations_desc:0 "The lands to our north and east are vast, thinly settled and rich. With Moscow's blessing, Tuva's reach could extend far beyond the Sayan mountains."
 TAN_hold_what_we_have_idea:0 "Hold What We Have"
 TAN_hold_what_we_have_idea_desc:0 "The nation is united behind the defense of its borders."
 TAN_siberian_aspirations_idea:0 "Siberian Aspirations"
 TAN_siberian_aspirations_idea_desc:0 "The nation looks north and east with ambition."
 TAN_union_with_oyrot:0 "Union with the Oyrot Region"
 TAN_union_with_oyrot_desc:0 "The Oyrot Region and Tuva share mountains, herds and a long history. We will ask Moscow to unite the two under a single administration."
 TAN_union.1.t:0 "Tannu Tuva Requests Union with Oyrot"
 TAN_union.1.d:0 "The Tuvan government has asked that the Oyrot Region be transferred to its administration, citing shared history and kinship between the peoples. The request is a modest one and Tuva has been a loyal partner."
 TAN_union.1.a:0 "Grant the request."
 TAN_union.1.b:0 "The Oyrot Region stays as it is."
 TAN_union.2.t:0 "Moscow Approves the Union"
 TAN_union.2.d:0 "A telegram from Moscow confirms that the Oyrot Region will be transferred to Tuvan administration. Our two peoples are united."
 TAN_union.2.a:0 "A great day for Tuva."
 TAN_union.3.t:0 "Moscow Declines the Union"
 TAN_union.3.d:0 "Moscow has refused to transfer the Oyrot Region, but has acknowledged our historical claim. The region remains Soviet for now, and our claim remains on record."
 TAN_union.3.a:0 "We will not forget."
 TAN_the_little_purge:0 "The Little Purge"
 TAN_the_little_purge_desc:0 "Doubtful officials, lamas and old chieftains still hold posts in our government. Quietly, and with Moscow's advice, they will be removed."
 TAN_little_purge_idea:0 "The Little Purge"
 TAN_little_purge_idea_desc:0 "Arrests and dismissals have left the administration short of hands and the public uneasy."
 TAN_latinization_campaign:0 "Latinization Campaign"
 TAN_latinization_campaign_desc:0 "A planned state cannot be run by a country that cannot read. Soviet linguists will give Tuvan a Latin alphabet and the first real schools, so that a new generation can fill in forms, read blueprints and count the herds."
 TAN_latinization_idea:0 "Tuvan Literacy"
 TAN_latinization_idea_desc:0 "A new alphabet and new schools are creating Tuva's first literate working class."
 TAN_seize_monastery_wealth:0 "Seize the Monastery Wealth"
 TAN_seize_monastery_wealth_desc:0 "The monasteries hold much of the nation's livestock, grain and treasure while the State has none. What the khurees have gathered over centuries will now serve the plan."
 TAN_monastery_wealth_idea:0 "Monastery Wealth"
 TAN_monastery_wealth_idea_desc:0 "Confiscated monastic herds and treasure are easing the State's budget."
 TAN_champion_siberianism:0 "Declare the Siberian SSR"
 TAN_champion_siberianism_desc:0 "The peoples of the Sayan and Altai lands share more with one another than with distant capitals. With Oyrot joined to Tuva, we will proclaim a Siberian Soviet Socialist Republic and place it at the head of a new Siberian cause within the Union."
 TAN_expand_the_ssr:0 "Expand the SSR"
 TAN_expand_the_ssr_desc:0 "The Siberian SSR has been declared, but it is a republic of two regions and little else. New schools, roads and works will give it the standing of a republic and attract the mountain peoples around it."
 TAN_expand_the_ssr_idea:0 "Expanding Republic"
 TAN_expand_the_ssr_idea_desc:0 "The Siberian SSR is growing in population and ambition."
 TAN_expand_ssr_category:0 "Expand the Siberian SSR"
 TAN_expand_ssr_category_desc:0 "The Siberian SSR is a young republic with room to grow. We can ask Moscow to place neighbouring districts under our administration."
 TAN_ask_central_siberia:0 "Ask for Central Siberia"
 TAN_ask_central_siberia_desc:0 "The heart of Siberia lies just beyond our borders. We will ask for it to be placed under the administration of the Siberian SSR."
 TAN_ask_far_east:0 "Ask to Expand to the Far East"
 TAN_ask_far_east_desc:0 "The Far East is distant but shares our peoples and our cause. We will ask for it to join the Siberian SSR."
 TAN_ask_omsk:0 "Ask to Expand to Omsk"
 TAN_ask_omsk_desc:0 "Omsk is the gateway of western Siberia. We will ask for it to join the Siberian SSR."
 TAN_ask_steppes:0 "Ask to Expand to the Steppes"
 TAN_ask_steppes_desc:0 "The open steppes are home to herding peoples like our own. We will ask for them to join the Siberian SSR."
 TAN_reach_out_to_mongolia:0 "Reach Out to Mongolia"
 TAN_reach_out_to_mongolia_desc:0 "Mongolia is our oldest neighbour and the nearest socialist state. We will propose that the border regions unite with the Siberian SSR."
 TAN_integrate_siberian_manchus:0 "Integrate the Siberian Manchus"
 TAN_integrate_siberian_manchus_desc:0 "The Manchu peoples of the northeastern borderlands have no republic of their own. They will be welcomed into the Siberian SSR."
 TAN_integrate_the_ainu:0 "Integrate the Ainu"
 TAN_integrate_the_ainu_desc:0 "The Ainu are one of the last peoples without a state. The Siberian SSR will offer them a home."
 TAN_expand.1.t:0 "The Siberian SSR Requests Central Siberia"
 TAN_expand.1.d:0 "The Siberian SSR has asked for Central Siberia to be placed under its administration, on the grounds of shared peoples, history and the needs of the Union."
 TAN_expand.1.a:0 "Grant the request."
 TAN_expand.1.b:0 "Not now. We will acknowledge their claim."
 TAN_expand.2.t:0 "The Siberian SSR Requests the Far East"
 TAN_expand.2.d:0 "The Siberian SSR has asked for the Far East to be placed under its administration, on the grounds of shared peoples, history and the needs of the Union."
 TAN_expand.2.a:0 "Grant the request."
 TAN_expand.2.b:0 "Not now. We will acknowledge their claim."
 TAN_expand.3.t:0 "The Siberian SSR Requests Omsk"
 TAN_expand.3.d:0 "The Siberian SSR has asked for Omsk to be placed under its administration, on the grounds of shared peoples, history and the needs of the Union."
 TAN_expand.3.a:0 "Grant the request."
 TAN_expand.3.b:0 "Not now. We will acknowledge their claim."
 TAN_expand.4.t:0 "The Siberian SSR Requests the Steppes"
 TAN_expand.4.d:0 "The Siberian SSR has asked for the Steppes to be placed under its administration, on the grounds of shared peoples, history and the needs of the Union."
 TAN_expand.4.a:0 "Grant the request."
 TAN_expand.4.b:0 "Not now. We will acknowledge their claim."
 TAN_expand.5.t:0 "Tuva Asks Mongolia to Join the Siberian SSR"
 TAN_expand.5.d:0 "The Siberian SSR has invited Mongolia to join it as one republic, on the grounds of shared history, peoples and revolutionary cause. Accepting would end Mongolia as a separate state and merge its army into the Siberian forces."
 TAN_expand.5.a:0 "Join the Siberian SSR."
 TAN_expand.5.b:0 "Mongolia remains independent."
 TAN_expand.6.t:0 "The Siberian SSR Requests the Siberian Manchus"
 TAN_expand.6.d:0 "The Siberian SSR has asked for the Siberian Manchus to be placed under its administration, on the grounds of shared peoples, history and the needs of the Union."
 TAN_expand.6.a:0 "Grant the request."
 TAN_expand.6.b:0 "Not now. We will acknowledge their claim."
 TAN_expand.7.t:0 "The Siberian SSR Requests the Ainu"
 TAN_expand.7.d:0 "The Siberian SSR has asked for the Ainu to be placed under its administration, on the grounds of shared peoples, history and the needs of the Union."
 TAN_expand.7.a:0 "Grant the request."
 TAN_expand.7.b:0 "Not now. We will acknowledge their claim."
 TAN_ask_northern_siberia:0 "Ask to Expand into the North"
 TAN_ask_northern_siberia_desc:0 "The northern reaches are vast and thinly settled. We will ask for them to be placed under the Siberian SSR."
 TAN_expand.8.t:0 "The Siberian SSR Requests Northern Siberia"
 TAN_expand.8.d:0 "The Siberian SSR has asked for the northern districts to be placed under its administration, on the grounds of shared peoples, history and the needs of the Union."
 TAN_expand.8.a:0 "Grant the request."
 TAN_expand.8.b:0 "Not now. We will acknowledge their claim."
 TAN_expand.11.t:0 "Moscow Opens the Gates of Siberia"
 TAN_expand.11.d:0 "The telegram from Moscow was short, but it was enough. The districts of Central Siberia, from the Yenisei valleys to the taiga beyond, are to be placed under the care of the Siberian SSR. Surveyors, clerks and a few doubtful engineers are already waiting at the border. It only remains for us to give the word."
 TAN_expand.11.a:0 "Let the administrators cross the border."
 TAN_expand.12.t:0 "The North Is Ours to Govern"
 TAN_expand.12.d:0 "Moscow has agreed. The thinly settled lands of the north, where reindeer herders and trappers have long outnumbered the officials, will now answer to Kyzyl. The maps have been redrawn in red ink and the first couriers are already on their way."
 TAN_expand.12.a:0 "Raise the flag in the north."
 TAN_expand.13.t:0 "Mongolia Chooses Union"
 TAN_expand.13.d:0 "After weeks of silence, Ulaanbaatar has answered. The Mongolian leadership has agreed to merge with the Siberian SSR, citing shared nomadic roots, a common revolutionary cause and a hard border to defend. Its army awaits our order, and its people await a new flag."
 TAN_expand.13.a:0 "One republic, from the Sayan to the Gobi."
 TAN_expand.14.t:0 "Moscow Keeps Central Siberia"
 TAN_expand.14.d:0 "The reply from the Kremlin was courteous and unmistakable. Central Siberia is needed where it is, and the Siberian SSR is reminded of its place within the Union. Still, the letter did not deny our claim. It was filed away for another day, and so was our patience."
 TAN_expand.14.a:0 "Another day, then."
 TAN_expand.15.t:0 "The North Stays Soviet"
 TAN_expand.15.d:0 "Moscow thanks us for our enthusiasm, but the northern districts are not ours to take. The reply praises our loyalty, recommends patience and says nothing more. Our claim has been written into the record all the same, and records have a way of being read again."
 TAN_expand.15.a:0 "We can be patient."
 TAN_expand.16.t:0 "Mongolia Holds Its Own Road"
 TAN_expand.16.d:0 "Ulaanbaatar has thanked us for the invitation and declined it. The Mongolian leadership has no wish to see its republic folded into another. It reminds us that the people of the steppe have a long memory of being ruled from elsewhere. For now Mongolia will walk its own road."
 TAN_expand.16.a:0 "Then let it walk."
 TAN_expand.17.t:0 "The Far East Falls Under Our Care"
 TAN_expand.17.d:0 "The Far Eastern districts, from the Amur to the Pacific shore, are to be governed from Kyzyl. A thousand kilometers of railway and a good deal of Moscow's patience stand between us and them, but the order is signed. Fishermen, miners and border guards will soon learn a new capital."
 TAN_expand.17.a:0 "Send our men to the ocean."
 TAN_expand.18.t:0 "The Far East Remains Distant"
 TAN_expand.18.d:0 "Moscow has politely reminded us that the Far East is a long way from the Sayan mountains. The reply speaks of strategic needs and of the Pacific frontier, and the request is declined. Our claim, however, is noted in the file."
 TAN_expand.18.a:0 "The ocean can wait."
 TAN_expand.19.t:0 "Omsk Joins the Siberian SSR"
 TAN_expand.19.d:0 "The gateway of western Siberia, where the great river and the great railway meet, will answer to our republic. The garrison has been informed and the clerks of Omsk are already learning how to spell Kyzyl."
 TAN_expand.19.a:0 "Open the gateway."
 TAN_expand.20.t:0 "Omsk Stays Where It Is"
 TAN_expand.20.d:0 "Omsk is too important to be handed over, Moscow tells us, and too close to the heart of the Union to be governed by a distant republic. The request is declined, and the claim is recorded in the files for later."
 TAN_expand.20.a:0 "Later, then."
 TAN_protectorate_republic:0 "Protectorate Republic"
 TAN_protectorate_republic_desc:0 "Tuva is nominally independent but Moscow has a say in every decision. Our status as a supervised state is balanced by our standing as the Union's oldest and most loyal protectorate."
 TAN_free_of_protection:0 "Free of Protection"
 TAN_free_of_protection_desc:0 "Tuva is grateful for Moscow's guidance, but a republic that is always supervised can never fully stand on its own. We will respectfully ask that the protection be lifted and that we be left to govern ourselves."
 TAN_free.1.t:0 "Tuva Asks to Be Free of Protection"
 TAN_free.1.d:0 "A respectful letter has arrived from Kyzyl. The Tuvan leadership thanks the Union for its protection and asks that supervision be lifted, so that Tuva may take its place as an equal ally. The request is polite, but it is also a request."
 TAN_free.1.a:0 "Lift the protection."
 TAN_free.1.b:0 "The protection remains."
 TAN_free.2.t:0 "Moscow Lifts Its Protection"
 TAN_free.2.d:0 "A courier has brought word from Moscow. The Union is satisfied with Tuva's loyalty and is willing to lift the protection. Tuva will answer for its own decisions from now on. The papers await only our signature."
 TAN_free.2.a:0 "Sign the papers."
 TAN_free.3.t:0 "Moscow Keeps Its Protection"
 TAN_free.3.d:0 "The answer from Moscow was warm and brief. Tuva is a valued friend and will remain under the Union's protection a while longer. A friend, the letter adds, who has nothing to fear from being looked after."
 TAN_free.3.a:0 "A while longer, then."
 TAN_secularize_the_lamas:0 "Secularize the Lamas"
 TAN_secularize_the_lamas_desc:0 "With the monasteries emptied of their wealth, their thousands of lamas have no purpose in the new Tuva. They will be returned to secular life, and every able man among them will serve the State."
 TAN_secularized_clergy_idea:0 "Secularized Clergy"
 TAN_secularized_clergy_idea_desc:0 "Former lamas now work in the fields, the workshops and the army."
 TAN_consolidate_army:0 "Consolidate the Army Command"
 TAN_consolidate_army_desc:0 "Cavalry, mountain troops and border guards still answer to different chiefs. A single command under the Party will give them a common doctrine and a common loyalty."
 TAN_infantry_efforts:0 "Infantry Efforts"
 TAN_infantry_efforts_desc:0 "The foot soldier remains the foundation of any army. Better rifles, better drill and better training for every man in the line."
 TAN_fortification_efforts:0 "Fortification Efforts"
 TAN_fortification_efforts_desc:0 "The mountain passes can be held by a few men behind good walls. Bunkers, trenches and fieldworks will turn the frontier into a barrier."
 TAN_fortification_efforts_idea:0 "Frontier Fortifications"
 TAN_fortification_efforts_idea_desc:0 "Fortified passes and prepared defenses on the frontier."
 TAN_tuvan_army_1:0 "Tuvan Revolutionary Army"
 TAN_tuvan_army_1_desc:0 "A few regiments of herdsmen on horseback, poorly armed, barely drilled and loyal mostly to their own officers. It is an army in name more than in fact."
 TAN_tuvan_army_2:0 "Tuvan Revolutionary Army"
 TAN_tuvan_army_2_desc:0 "Soviet instructors have begun to drill the regiments. Discipline is better, though the army is still small and poorly trained."
 TAN_tuvan_army_3:0 "Tuvan Revolutionary Army"
 TAN_tuvan_army_3_desc:0 "Cavalry, mountain troops and border guards now answer to a single command. The army is no longer a collection of regiments but a coherent force."
 TAN_tuvan_army_4:0 "Tuvan People's Army"
 TAN_tuvan_army_4_desc:0 "Every herdsman can ride and shoot, and every regiment is drilled to Soviet standards. A small army, but a determined and well trained one."
 TAN_hardy_mountain_people:0 "Hardy Mountain People"
 TAN_hardy_mountain_people_desc:0 "Tuvans are raised among high passes, hard winters and thin supplies. Our soldiers are at home in the cold and can march on very little."
 TAN_increase_conscription:0 "Increase Conscription"
 TAN_increase_conscription_desc:0 "Tuva has few people, but every able man can be made a soldier. Lowering the age of service and widening the draft will fill the ranks, if not the granaries."
 TAN_tuvan_conscription:0 "Tuvan Conscription"
 TAN_tuvan_conscription_desc:0 "Wider conscription brings more of our small population into the ranks."
 TAN_rely_on_our_infantry:0 "Rely on Our Infantry"
 TAN_rely_on_our_infantry_desc:0 "Tuva has no tank factories and no prospect of building any. Our herdsmen are our army, and the foot soldier with a good rifle and a few guns behind him will be enough."
 TAN_modern_warfare:0 "Modern Warfare"
 TAN_modern_warfare_desc:0 "The cavalry charge is a thing of the past. Soviet armor and mechanized units will show us how wars are won, and our army will learn to fight in the same way."
 TAN_donate_gold_reserve:0 "Donate the State Gold Reserve"
 TAN_donate_gold_reserve_desc:0 "Tuva is poor, but she has one treasure: the gold in the state vaults. Our friends in the north need it more than we do. The whole reserve will go to the Union, and the Revolution will not forget it."
 TAN_empty_treasury:0 "Empty Treasury"
 TAN_empty_treasury_desc:0 "The State vaults have been emptied for the Union. Tuva must now make do with what she has."
 TAN_gold_donation_boon:0 "Tuvan Gold"
 TAN_gold_donation_boon_desc:0 "A gift of gold from Tuva has eased the Union's budget."
 TAN_gold_donation:0 "Donated the State Gold Reserve"
 TAN_gold.1.t:0 "Tuva Offers Its Gold Reserve"
 TAN_gold.1.d:0 "A delegation from Kyzyl has arrived in Moscow with a remarkable offer: the entire gold reserve of the Tuvan state, given freely to the Union. The delegates ask for nothing but the continued friendship of the Soviet people."
 TAN_gold.1.a:0 "Accept the gift with our thanks."
 TAN_gold.1.b:0 "Tuva needs its gold more than we do."
 TAN_gold.2.t:0 "Moscow Accepts Our Gold"
 TAN_gold.2.d:0 "The Soviet government has accepted the gold with warm words and a promise that Tuva's generosity will not be forgotten. The vaults are empty, but our standing in the Union has never been higher."
 TAN_gold.2.a:0 "The Revolution will remember."
 TAN_gold.3.t:0 "Moscow Returns Our Gold"
 TAN_gold.3.d:0 "The Soviet government has thanked us for the offer and declined it. Tuva's gold is returned with a polite note: the Union does not take from its friends what they need themselves. The gesture was noticed all the same."
 TAN_gold.3.a:0 "A noble reply."
 TAN_ask_to_split_sinkiang:0 "Ask to Split Sinkiang"
 TAN_ask_to_split_sinkiang_desc:0 "Sinkiang is a Soviet puppet and its lands border our own. We will ask Moscow to divide it, with the eastern districts coming to the Siberian SSR and the rest to the Union."
 TAN_split.1.t:0 "Tuva Asks to Divide Sinkiang"
 TAN_split.1.d:0 "The Siberian SSR has proposed that Sinkiang be divided between the Union and Tuva, citing the border and the peoples who live on both sides of it. Sinkiang is a Soviet puppet, and the decision rests with Moscow."
 TAN_split.1.a:0 "Put the proposal to Sinkiang."
 TAN_split.1.b:0 "Sinkiang remains whole."
 TAN_split.2.t:0 "Moscow Proposes to Divide Sinkiang"
 TAN_split.2.d:0 "A message from Moscow has reached Urumqi. The Soviet Union proposes that Sinkiang be divided: part to the Union and the rest to the Siberian SSR. Sinkiang may agree, or refuse and face the consequences."
 TAN_split.2.a:0 "We have no choice. Agree to the division."
 TAN_split.2.b:0 "Never. Break free of Moscow."
 TAN_split.3.t:0 "Moscow Keeps Sinkiang Whole"
 TAN_split.3.d:0 "The Kremlin has declined our proposal. Sinkiang is useful as it is, and Moscow has no wish to disturb it for now."
 TAN_split.3.a:0 "Another time."
 TAN_mechanize_the_cavalry:0 "Mechanize the Cavalry"
 TAN_mechanize_the_cavalry_desc:0 "The horse served us well, but the engine is faster and does not tire. Trucks, tractors and armored cars will carry our riders further than any horse could."
