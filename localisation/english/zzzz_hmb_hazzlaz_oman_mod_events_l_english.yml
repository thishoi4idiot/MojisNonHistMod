 oman_demandpakistan.1.a:0 "We must choose safety over death"
 oman_demandpakistan.1.b:0 "We have seen how Appeasement works..."
 oman_demandpakistan.1.d:0 "Oman demands us to hand over all of our Muslim Dominated Territories or face total Invasion "
 oman_demandpakistan.1.t:0 "Oman demands total control of Pakistan"
