 omanaden.2.b:0 "Decline"
 omanaden.2.d:0 "Oman now has requested for us to withdraw from our colonies in the Arabian penisular while\nthese colonies do not provide us much wealth is it worth the political advantage to withdraw?\nor should we face the consequences of the people in these lands?"
