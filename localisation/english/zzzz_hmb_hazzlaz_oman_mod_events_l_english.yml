 oman_demandsomalia.1.b:0 "We will not Weaken our Empire"
 oman_demandsomalia.1.d:0 "Oman requests control over our land in Somalia, Perhaps this could strengthen our bond and bring more\nof their forces to our aid incase of war in East Africa "
 oman_demandsomalia.1.t:0 "Oman requests control over Somalia"
