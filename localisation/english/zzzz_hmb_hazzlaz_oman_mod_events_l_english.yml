 omannews.1.a:0 "Shocking News"
 omannews.1.d:0 "Recently Oman and it's allies has taken control over the region of Libya, now in a recent proclamation \nthey have chosen to restore the old Senussi Order to the region"
 omannews.1.t:0 "Restoration of the Senussi Order"
 omanquestionkuri.1.a:0 "The Kurdish demand independence"
 omanquestionkuri.1.b:0 "This is insane"
 omanquestionkuri.1.d:0 "Oman has demanded for us to withdraw from our Kurdish controlled regions in Iraq however their demands\nare not backed by any risk of invasion however is it worth to upset Oman over this?"
 omanquestionkuri.1.t:0 "The Kurdish Question"
