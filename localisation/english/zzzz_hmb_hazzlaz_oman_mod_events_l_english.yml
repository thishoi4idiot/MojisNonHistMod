 oman_incidentengyem.1.b:0 "We must Crush this Revolt!"
 oman_incidentengyem.1.d:0 "Oman has recently spurred a pro Omani Revolt in South Yemen demanding control of the region over\nto Oman should we give into these demands or decline and suffer the consequences?"
 oman_incidentengyem.1.t:0 "Omani Unification Revolts in Yemen"
 omanaden.1.a:0 "This makes perfect sense"
 omanaden.1.b:0 "We will not give away an Inch"
 omanaden.1.d:0 "Oman has requested for us to return South Yemen to Yemen in accordance to the right of self \ndetermination of Peoples, should we return these lands in turn for better relations with Oman and Yemen?"
 omanaden.1.t:0 "Oman requests Yemen Unification"
