l_english:
 SOV_the_new_great_game: "The New Great Game"
 SOV_the_new_great_game_desc: "The contest for influence across Central Asia and the Middle East never truly ended. Let us court Iraq, Persia, Afghanistan and Arabia, and make sure it is Russia, not Britain, that holds the upper hand."
 SOV_the_new_great_game_unlock_tt: "Unlocks the decision §YRestart the Great Game§!."
 SOV_reestablish_influence_in_the_east_unlock_tt: "Unlocks the decision §YEnd Communism in the Far East§!."
 SOV_lessons_from_the_past: "Lessons from the Past"
 SOV_lessons_from_the_past_desc: "The Cossack hosts served the Tsars loyally for centuries. By restoring their old privileges and autonomy we can bind them to the throne once more."
 SOV_lessons_from_the_past_unlock_tt: "Unlocks the decision §YGive Autonomy to the Cossacks§!."
 SOV_lessons_from_the_past_unlock_kuban_tt: "Unlocks the decision §YGive Autonomy to the Kuban Cossacks§!."
 SOV_westward_bound_unlock_tt: "Unlocks the §YRebuilding the Empire§! decision category."
 SOV_westward_bound_unlock_romania_tt: "Unlocks the decisions §YPressure Romania§! and §YReach Out to Bulgaria§!."
 SOV_secure_poland: "Secure Poland"
 SOV_secure_poland_desc: "Poland was once a jewel of the Russian Empire. With our western border secured, we can restore the Congress Kingdom under the Russian crown."
 SOV_secure_poland_unlock_tt: "Unlocks the decision §YReestablish Congressional Poland§!."
 SOV_secure_finland_unlock_tt: "Unlocks the decision §YReestablish the Grand Duchy of Finland§!."
 SOV_secure_the_baltics_unlock_tt: "Unlocks the decision §YReestablish the Baltic Governates§!."
 SOV_secure_the_baltics_unlock_reintegrate_tt: "Unlocks the decision §YReintegrate Belarus and Lithuania§!."
 MNHM_SOV_the_lonely_island_desc: "Japan's hold on the Pacific coast is a thorn in our side. We must prepare to take back what was lost, one island at a time."
