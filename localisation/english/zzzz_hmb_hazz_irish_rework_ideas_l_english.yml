l_english:
 Sigmas_rise_Big: "The Aircorps"
 Sigmas_rise_Big_desc: "The Aircorps was established in 1924 our recent expansions on it has improved our ability\nto wage war in the air"
 Sigmas_rise_Clown: "The Marine Service"
 Sigmas_rise_Clown_desc: "With a strong navy established we must improve our Land to Sea cooperation a strong Marine\nCorps means no Army can be safe from us no matter how far "
 Sigmas_rise_Hej: "Irish Expeditonary Corps"
 Sigmas_rise_Hej_desc: "Ireland being safe on our Island has allowed us to base our army on fighting on Foreign Ground"
 Sigmas_rise_Jo: "An Army of Innovation"
 Sigmas_rise_Jo_desc: "A true Modern Army relies on Innovation we most utilise Armoured Technology and new Tactics\nto gain the ground on more industrialised Powers"
 Sigmas_rise_angry: "Ireland's Opportunity "
 Sigmas_rise_angry_desc: "England is distracted now is our chance to launch a Suprise Attack when they are at their Weakest\nand reclaim Northern Ireland or maybe more..."
 Sigmas_rise_ar: "Recovering from the Irish Famine"
 Sigmas_rise_ar_desc: "Although ending in 1852 the population decline from the past still greatly impacts our Economy\nreversing this decline will take time but it will be worth the effort"
 Sigmas_rise_are: "Slow Recovery from the Irish Famine"
 Sigmas_rise_are_desc: "Although ending in 1852 the population decline from the past still greatly impacts our Economy\nreversing this decline will take time but it will be worth the effort"
 Sigmas_rise_aret: "Slight Recovery from the Irish Famine"
 Sigmas_rise_aret_desc: "Although ending in 1852 the population decline from the past still greatly impacts our Economy\nreversing this decline will take time but it will be worth the effort"
 Sigmas_rise_arety: "Partial Recovery from the Irish Famine"
 Sigmas_rise_arety_desc: "Although ending in 1852 the population decline from the past still greatly impacts our Economy\nreversing this decline will take time but it will be worth the effort"
 Sigmas_rise_aretyu: "Large Scale Recovery from the Irish Famine"
 Sigmas_rise_aretyu_desc: "Although ending in 1852 the population decline from the past still greatly impacts our Economy\nreversing this decline will take time but it will be worth the effort"
 Sigmas_rise_aretyui: "A new Ireland"
 Sigmas_rise_aretyui_desc: "We have managed to reverse the main impact of the Irish Famine apon our Country now Irelands \nReborn as a new Ireland unburdened by the past!\n"
 Sigmas_rise_areyoureadingthis: "A Happy Ireland"
 Sigmas_rise_areyoureadingthis_desc: "With our Great Economy now is the time to invest in our People!"
 Sigmas_rise_bb: "The Democratic Way"
 Sigmas_rise_bb_desc: "We must not let Extremism take us in this time, Democracy is the Irish path to success"
 Sigmas_rise_comm: "The CPI"
 Sigmas_rise_comm_desc: "After uniting various left-wing Political Factions into one force, we will lead the Working Class to \nProsperity"
 Sigmas_rise_ddd: "An Alternative Path"
 Sigmas_rise_ddd_desc: "Democracy has left us in disaster and divided in 2, we must turn a diffrent path if we wish to \nrejuvenate Ireland to a Greater Strength"
 Sigmas_rise_diasdias: "Irish Diaspora"
 Sigmas_rise_diasdias_desc: "There are many Communites of Irish People across the World we must recognise that we are \nnot a State just in our borders but a State of the World"
 Sigmas_rise_down: "Industrial Expansion"
 Sigmas_rise_down_desc: "Our Slow Investments in Industry have allowed for long term Economic Growth"
 Sigmas_rise_halp: "Irish Volunteer Force "
 Sigmas_rise_halp_desc: "Instead of direct intervention in Wars we can more covertly support our cause through our\n\"Volunteers\""
 Sigmas_rise_hazzium: "Intergration of Foreign Communites"
 Sigmas_rise_hazzium_desc: "Through our Policies Ireland has now become a place of many Communites we must Intergrate \nthese Communites if we wish to truly increase the Irish population"
 Sigmas_rise_howl: "Research Investment"
 Sigmas_rise_howl_desc: "Our investments into Research has had a fruitful effect on our research and development"
 Sigmas_rise_loryyyyy: "Refit the Muirchu"
 Sigmas_rise_loryyyyy_desc: "The Muirchu has been taken over from the Department of Agriculture and Fisheries\nif we are to Establish a fleet that can challenge the great powers we must be able to refit\nships like the Muirchu for more fitting purposes"
 Sigmas_rise_ludd: "Naval Service"
 Sigmas_rise_ludd_desc: "To defend both the State and its Maritime Resources we must utilise our experience in both \nNaval and Marine Warfare to create a true Modern branch of the Irish Millitary"
 Sigmas_rise_meow: "The Irish Economy"
 Sigmas_rise_meow_desc: "Our recent developments in Industry have managed to rejuvenate the Irish Economy to an almost \nEconomic Miracle "
 Sigmas_rise_mephilles: "Irish Economic Miracle"
 Sigmas_rise_mephilles_desc: "Our Economy is the Wonder of the World"
 Sigmas_rise_moo: "Spread the Revolution"
 Sigmas_rise_moo_desc: "A true Revolution is not restricted by Borders we must expand to Liberate the Workers of the World"
 Sigmas_rise_neutral: "Irish Neutrality "
 Sigmas_rise_neutral_desc: "Ireland is faced with a predicament our Economy is vunerable to Convoy Raiding and plans being \ndrawn up to invade us our safest bet is to follow Neutrality, it could have benefits on our Economy \nas well"
 Sigmas_rise_skibidi: "Irish Peacetime Army"
 Sigmas_rise_skibidi_desc: "After the Civil war our Army has faced large scale reductions in funding however our\nArmy must still be maintained for Defencive Purposes "
 Sigmas_rise_teqooooo: "Immigration"
 Sigmas_rise_teqooooo_desc: "If we wish to improve our declining population we must incentivise Immigration"
 Sigmas_rise_tikitiki: "Marine And Coastwatching service"
 Sigmas_rise_tikitiki_desc: "Ireland has never been a Maritine Power if we ever wish to strike our enemies we must have a\nstrong presence at Sea"
 Sigmas_rise_up: "The Anglo Irish Trade War"
 Sigmas_rise_up_desc: "The Anglo Irish Trade war has been a minor Trade conflict between us and The United Kingdom\nsince 1932 causing Trade restrictions on both Countries "
 Sigmas_rise_willllll: "Our Will"
 Sigmas_rise_willllll_desc: "Through demand of the people we have came into power, we are not just a movement but a \nWill of all the Working Class People of the World!"
 Sigmas_rise_yaratikiavb: "Expenditure into Welfare"
 Sigmas_rise_yaratikiavb_desc: "Provide for the People and they will Provide for you!"
 Sigmas_rise_yaratikiavballiestrain: "Anglo Irish Training"
 Sigmas_rise_yaratikiavballiestrain_desc: "Utilising both of our Countries knowledge in Warfare we have greatly strengthened our Armies"
 Sigmas_rise_yaratikiavbaxis: "Receving Axis Gold "
 Sigmas_rise_yaratikiavbaxis_desc: "Our Alliance with our Allies has led to great development from them!"
 Sigmas_rise_yaratikiavbwolfhowll: "National Guard Empowered"
 Sigmas_rise_yaratikiavbwolfhowll_desc: "We do not need Allies we must go our own way"
