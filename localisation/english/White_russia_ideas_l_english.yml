 SOV_kirill_romanov:0 "Grand Duke Kirill"
 SOV_kirill_romanov_desc:0 "Grand Duke Kirill Vladimirovich is the direct paternal grandson of Tsar Alexander II, living head of the Romanov dynasty, and now, father of the current Tsar Vlamimir III.\n\nDespite at first being a supporter of the Provisional Government, Grand Duke Kirill found it necessary to flee the country in 1917, escaping ot Finland, and thence to France. In 1924 he declared himself 'Guardian of the Throne', and later Emperor of All Russia in exile, though this would be contested by Grand Duke Nicholas until his death in 1929. Though he hoped that his claim to seniority would bypass any need for a Zemsky Sobor when the Counter-Revolution occured, he has come to accept that with his advancing age and declining health, it was better for the White Movement as a whole to pick a younger candidate. He now dutifully supports his son as a valued advisor and political tutor, and remains an inspiring figurehead for those returning from exile."
 SOV_dmitry_romanov:0 "Grand Duke Dmitri"
 SOV_dmitry_romanov_desc:0 "Grand Duke Dmitri Pavlovich is the youngest of the direct paternal grandsons of Tsar Alexander II.\n\n As such, he could have perhaps fancied himself as a candidate for the throne - if not for his controversial past as a participant in the murder of Rasputin and subsequent banishment from Russia in January 1917. Despite invitations from the Provisional Government to return from Persia after the abdication of the Tsar, Dmitri instead chose to travel to Britain, and later settling in France. Despite having gained passage to the west under the pretense that he was to become the next Tsar, Dmitry was left by the wayside whilst the succession question was dominated by Grand Dukes Kirill and Nicholas. Rather than fade into obscurity however, Grand Duke Dmitri has made a name for himself as one of the most prominent members of the exile community, and has regularly served as the face of the Romanov dynasty, travelling across the globe as Duke Kirill's representative. He now serves the new Tsar loyally as an experienced, and well-respected aide."
 SOV_boris_romanov:0 "Tsar Boris II"
 SOV_boris_romanov_desc:0 "The Former Grand Duke Boris Vladimirovich has been elected by the nationalists as Tsar, skipping past the claims of the young Grand Duke Vladimir to suceed his brother as the legal head of house Romanov.\n\nHaving narrowly escaped execution due to a personal connection with his would-be killer, Boris succeeded in escaping southwards, and joining up with White forces in Circassia before escaping across the Black Sea, and eventually moving to France, and then the US. A noted Anglophobe, Boris has a history of skeptisism towards Russia's old entente allies, but otherwise has little political interest, making him a perfect figurehead for the nationalist government"
 SOV_soviet_exodous:0 "Soviet Exodous"
 SOV_soviet_exodous_desc:0 "With the Counter-Revolution triumphant, Soviet loyalists and dedicated communists are fleeing the country, hoping to escape judgement"
