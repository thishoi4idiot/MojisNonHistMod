 SOV_secure_democratic_principles_idea:0 "Resume Democratisation"
 SOV_mladorossi_integration:0 "Mladorossi Integration"
 SOV_mladorossi_integration_desc:0 "Following Mladorossi ideas, the new Russian State is embracing many elements of the Soviet system and adopting them as their own, making the transition of power much smoother."
 SOV_vsevolod_i:0 "Tsar Vsevolod I"
 SOV_centralised_rule:0 "Centralised Rule"
 SOV_centralised_rule_desc:0 "There can be no doubt as to where authority and power lies within the Russian State. Despite reforms, central authority must remain strong."
 SOV_autonomous_states_idea:0 "Autonomous States"
 SOV_autonomous_states_idea_desc:0 "The adoption of a federal system of significantly autonomous states and provinces helps our nation manage our vast territories, and can also serve as a template for the integration of any satillite states we have."
 SOV_table_of_ranks:0 "The Table of Ranks"
 SOV_table_of_ranks_desc:0 "Drawn up by Peter the Great in 1722, the Table of Ranks lays out the authorities, privileges and ranks that are due to members of the Russian State government and military, as well as the rights of loyal and long-serving personell for promotion in both government and social rank. After a brief hiatus due to the revolution of 1917, these basic rules of government have been restored to their rightful place."
 SOV_enforce_imperial_authority_idea:0 "Enforce Imperial Authority"
 SOV_enforce_imperial_authority_idea_desc:0 "Considerable effort is being spent to ensure that the Tsar's authority is properly respected in even the most far-flung territories of the Empire."
 SOV_second_grand_embassy:0 "The Second Grand Embassy"
 SOV_second_grand_embassy_desc:0 "Emulating the grand travels of Tsar Peter the Great, the Russian government is making a concerted effort to reach out to other nations, hoping to procure expertise, and share knowledge and technologies between peoples."
 SOV_protectors_of_the_faith_idea:0 "Protectors of the Faith"
 SOV_protectors_of_the_faith_idea_desc:0 "As the largest of the handful of orthodox states in the world, it is only natural that the duty should fall to us to protect the faith against those who would seek to harm it."
 SOV_orthodox_state:0 "An Orthodox State"
 SOV_orthodox_state_desc:0 "The Orthodox religion has now been officially written in as part of the Russian Constitution, and now is as an integral part of the state as the lands which make it up."
 SOV_religious_renaissance_idea:0 "Religious Renaissance"
 SOV_religious_renaissance_idea_desc:0 "With Communist restrictions finally lifted, religious life in Russia is enjoying a renaissance, with increased levels of spirituality and rejoicing from the people finally able to practise their faiths again, whilst both the state and local governments undergo restoration sprees to neglected, and partially-destroyed religious buildings"
 SOV_multi_religious_empire_new:0 "A Multi-Religious Empire"
 SOV_multi_religious_empire_new_desc:0 "Though Russia is an Orthodox state, it is also home to a great many others - muslims, catholics, protestants, and even those of eastern faiths. All have suffered under the Communist Yoke. Let them rise as one as equals under god."
 SOV_multi_religious_empire_2:0 "A Multi-Religious Empire"
 SOV_multi_religious_empire_2_desc:0 "Though Russia is an Orthodox state, it is also home to a great many others - muslims, catholics, protestants, and even those of eastern faiths. All have suffered under the Communist Yoke. Let them rise as one as equals under god."
 SOV_devolved_authority:0 "Devolved Authority"
 SOV_devolved_authority_desc:0 "The Devolution of the Russian State has opened up many opportunities for local governments to act more freely in regards to local issues, allowing them to be more dynamic and responsive"
 SOV_devolved_authority_2:0 "Devolved Authority"
 SOV_devolved_authority_2_desc:0 "The Devolution of the Russian State has opened up many opportunities for local governments to act more freely in regards to local issues, allowing them to be more dynamic and responsive"
 SOV_devolved_authority_3:0 "Devolved Authority"
 SOV_devolved_authority_3_desc:0 "The Devolution of the Russian State has opened up many opportunities for local governments to act more freely in regards to local issues, allowing them to be more dynamic and responsive"
 SOV_devolved_authority_4:0 "Devolved Authority"
 SOV_devolved_authority_4_desc:0 "The Devolution of the Russian State has opened up many opportunities for local governments to act more freely in regards to local issues, allowing them to be more dynamic and responsive"
 SOV_devolved_authority_5:0 "Devolved Authority"
 SOV_devolved_authority_5_desc:0 "The Devolution of the Russian State has opened up many opportunities for local governments to act more freely in regards to local issues, allowing them to be more dynamic and responsive"
 SOV_devolved_authority_6:0 "Devolved Authority"
 SOV_devolved_authority_6_desc:0 "The Devolution of the Russian State has opened up many opportunities for local governments to act more freely in regards to local issues, allowing them to be more dynamic and responsive"
 SOV_crush_dissent_idea:0 "Crush Dissent"
 SOV_crush_dissent_idea_desc:0 "The Government is currently spending considerable effors to crush any and all remaining seperatist movements active throughout Russia"
 SOV_dominate_the_orient_idea:0 "Dominate the Orient"
 SOV_eurasianism:0 "Eurasianism"
 SOV_eurasianism_desc:0 "The Russian government has embraced Eurasianism, positing that Russia has not a European identity, set against the backdrop of the liberal democracies of the last centry nor Asian identity, seated within so-called oreiental despotism, but one unto itself, in which only a uniquely-Russian government could thrive,"
 SOV_the_true_enemy:0 "The True Enemy"
 SOV_industial_bonus:0 "Russian Arms Industry"
 SOV_a_state_worth_fighting_for_idea:0 "A State Worth Fighting For"
 SOV_a_state_worth_fighting_for_idea_desc:0 "Every soldier will know what he will be fighting for, and every soldier will know that the state is doing everything it can to support him."
 WRE_officers_purged:0 "Junior Officers Purged"
 WRE_officers_purged_desc:0 "Fearing disloyalty, the Whites have purged the Soviet officer corps, seeking to re-populate it with men who they know they can trust"
 WRE_bureaucrats_purged:0 "Bureaucrats Purged"
 WRE_bureaucrats_purged_desc:0 "Fearing disloyalty, the Whites have purged the Soviet bureaucratic corps, seeking to re-populate it with men and women who they know they can trust"
 WRE_DEM_loyal:0 "Russian Democratic Movement - loyal"
 WRE_DEM_loyal_desc:0 "Along with the White Army, many politicians and civilians who supported the revolution of 1905, and later, the Provisional Government fled into exile as the Bolsheviks established a one-party state. Upon their return, they seek to see Russian democracy restored, and the potential of the 1917 Provisional Government realised.\n\nThe Democrats are currently satisfied with the current state of affairs, and are happy to work with the government"
 WRE_DEM_empowered:0 "Russian Democratic Movement - empowered"
 WRE_DEM_empowered_desc:0 "Along with the White Army, many politicians and civilians who supported the revolution of 1905, and later, the Provisional Government fled into exile as the Bolsheviks established a one-party state. Upon their return, they seek to see Russian democracy restored, and the potential of the 1917 Provisional Government realised.\n\nWith their victory within the Zemsky Sobor, the Democratic Movement have been handed the reigns of government to pursue their goals"
 WRE_DEM_disloyal_1:0 "Russian Democratic Movement - grumbling"
 WRE_DEM_disloyal_1_desc:0 "Along with the White Army, many politicians and civilians who supported the revolution of 1905, and later, the Provisional Government fled into exile as the Bolsheviks established a one-party state. Upon their return, they seek to see Russian democracy restored, and the potential of the 1917 Provisional Government realised.\n\nThe Democrats are currently grumbling about government policy, but all but the far-left-wing of the movement are still happy to co-operate with the state"
 WRE_DEM_disloyal_2:0 "Russian Democratic Movement - dissatisfied"
 WRE_DEM_disloyal_2_desc:0 "Along with the White Army, many politicians and civilians who supported the revolution of 1905, and later, the Provisional Government fled into exile as the Bolsheviks established a one-party state. Upon their return, they seek to see Russian democracy restored, and the potential of the 1917 Provisional Government realised.\n\nThe Democrats are currently dissatisfied with government policy, with many on the left, and centre-left considering open protest"
 WRE_DEM_disloyal_3:0 "Russian Democratic Movement - opposed"
 WRE_DEM_disloyal_3_desc:0 "Along with the White Army, many politicians and civilians who supported the revolution of 1905, and later, the Provisional Government fled into exile as the Bolsheviks established a one-party state. Upon their return, they seek to see Russian democracy restored, and the potential of the 1917 Provisional Government realised.\n\nThe Democrats are currently opposed to government policy, with all but the more conservative members of the movement now seeing it as a potential threat to their goals"
 WRE_DEM_disloyal_4:0 "Russian Democratic Movement - hostile"
 WRE_DEM_disloyal_4_desc:0 "Along with the White Army, many politicians and civilians who supported the revolution of 1905, and later, the Provisional Government fled into exile as the Bolsheviks established a one-party state. Upon their return, they seek to see Russian democracy restored, and the potential of the 1917 Provisional Government realised.\n\nThe Democrats are currently hostile to the government, feeling that it has consistently worked against their aims. As such, many in the movement are now considering organising a revolt."
 WRE_DEM_crushed:0 "Russian Democratic Movement Crushed"
 WRE_DEM_crushed_desc:0 "The Russian Democratic Movement has now been effectively crushed by state repression, its members having either been arrested, left the political scene, resigned in protest, or gone into exile."
 WRE_ROVS_loyal:0 "ROVS - loyal"
 WRE_ROVS_loyal_desc:0 "The Russkiy Obshche-Voinskiy Soyuz, or Russian All-Military Union, was the largest and most powerful emigré movement that came out of the Civil War. Filled primarily with old military personell, ROVS is officially an apolitical organisation, opposed to military intervention into civilian affairs, and focused only on defeating the Bolsheviks, and maintaining the military traditions of Imperial Russia. However, as the Kornilov affair proved back in 1917, the ROVS officers are not above taking political liberties when they feel it is necessary to do so. With many generals holding monarchist sympathies, and a general conservative outlook, they may find it necessary to intervene if they feel Russia has drifted too far to the left or right for their liking.\n\nThe ROVS officers are currently satisfied with government policy, and are happy to work with the state."
 WRE_ROVS_empowered:0 "ROVS - empowered"
 WRE_ROVS_empowered_desc:0 "The Russkiy Obshche-Voinskiy Soyuz, or Russian All-Military Union, was the largest and most powerful emigré movement that came out of the Civil War. Filled primarily with old military personell, ROVS is officially an apolitical organisation, opposed to military intervention into civilian affairs, and focused only on defeating the Bolsheviks, and maintaining the military traditions of Imperial Russia. However, as the Kornilov affair proved back in 1917, the ROVS officers are not above taking political liberties when they feel it is necessary to do so. With many generals holding monarchist sympathies, and a general conservative outlook, they may find it necessary to intervene if they feel Russia has drifted too far to the left or right for their liking.\n\nThanks to unwavering support for the Tsar, the ROVS officers have secured themselves an influential position in Russian politics, and are now seen as the true guardians of tradition and order."
 WRE_ROVS_disloyal_1:0 "ROVS - grumbling"
 WRE_ROVS_disloyal_1_desc:0 "The Russkiy Obshche-Voinskiy Soyuz, or Russian All-Military Union, was the largest and most powerful emigré movement that came out of the Civil War. Filled primarily with old military personell, ROVS is officially an apolitical organisation, opposed to military intervention into civilian affairs, and focused only on defeating the Bolsheviks, and maintaining the military traditions of Imperial Russia. However, as the Kornilov affair proved back in 1917, the ROVS officers are not above taking political liberties when they feel it is necessary to do so. With many generals holding monarchist sympathies, and a general conservative outlook, they may find it necessary to intervene if they feel Russia has drifted too far to the left or right for their liking.\n\nThe ROVS officers currently are grumbling about certain government policies, but are unwilling to endanger national stability to publicly voice their dissatisfaction."
 WRE_ROVS_disloyal_2:0 "ROVS - dissatisfied"
 WRE_ROVS_disloyal_2_desc:0 "The Russkiy Obshche-Voinskiy Soyuz, or Russian All-Military Union, was the largest and most powerful emigré movement that came out of the Civil War. Filled primarily with old military personell, ROVS is officially an apolitical organisation, opposed to military intervention into civilian affairs, and focused only on defeating the Bolsheviks, and maintaining the military traditions of Imperial Russia. However, as the Kornilov affair proved back in 1917, the ROVS officers are not above taking political liberties when they feel it is necessary to do so. With many generals holding monarchist sympathies, and a general conservative outlook, they may find it necessary to intervene if they feel Russia has drifted too far to the left or right for their liking.\n\nThe ROVS officers currently are dissatisfied with government policies, some officers have even begun to voice these concerns publicly."
 WRE_ROVS_disloyal_3:0 "ROVS - opposed"
 WRE_ROVS_disloyal_3_desc:0 "The Russkiy Obshche-Voinskiy Soyuz, or Russian All-Military Union, was the largest and most powerful emigré movement that came out of the Civil War. Filled primarily with old military personell, ROVS is officially an apolitical organisation, opposed to military intervention into civilian affairs, and focused only on defeating the Bolsheviks, and maintaining the military traditions of Imperial Russia. However, as the Kornilov affair proved back in 1917, the ROVS officers are not above taking political liberties when they feel it is necessary to do so. With many generals holding monarchist sympathies, and a general conservative outlook, they may find it necessary to intervene if they feel Russia has drifted too far to the left or right for their liking.\n\nThe ROVS officers currently are opposed to government policies, and have begun to organise passive resistance within the armed forces to government commands"
 WRE_ROVS_disloyal_4:0 "ROVS - hostile"
 WRE_ROVS_disloyal_4_desc:0 "The Russkiy Obshche-Voinskiy Soyuz, or Russian All-Military Union, was the largest and most powerful emigré movement that came out of the Civil War. Filled primarily with old military personell, ROVS is officially an apolitical organisation, opposed to military intervention into civilian affairs, and focused only on defeating the Bolsheviks, and maintaining the military traditions of Imperial Russia. However, as the Kornilov affair proved back in 1917, the ROVS officers are not above taking political liberties when they feel it is necessary to do so. With many generals holding monarchist sympathies, and a general conservative outlook, they may find it necessary to intervene if they feel Russia has drifted too far to the left or right for their liking.\n\nThe ROVS officers currently are hostile to government policies, and there are whispers of a coup spreading throughout the army..."
 WRE_ROVS_crushed:0 "ROVS Crushed"
 WRE_ROVS_crushed_desc:0 "The Russian All-Military Union has now been throughly crushed by the government, and the association officially disbanded, its officers either arrested, executed, or sent into exile."
 WRE_FASC_loyal:0 "Russian Nationalist Movement - loyal"
 WRE_FASC_loyal_desc:0 "Encompassing a diverse group individuals, the Russian Nationalist movement is comprised of old nationalists who supported the Stolypin government, strongly anti-communist White Army officers who have grown furstrated with the ROVS' apolitical stance, and emigrés who have been influenced by fascist movements in Italy, Germany and Japan during the intevening years since the revolution. Generally, they wish to push the reactionary cause, seeking the restoration of the old Russian Empire as a great power in the world, with strong, decisive leadership, though there is no unified vision on how this should be achieved, and what a counter-revolutionary government should look like.\n\nThe Nationalists are currently satisfied by government policies, and are happy to work with it."
 WRE_FASC_empowered:0 "Russian Nationalist Movement - empowered"
 WRE_FASC_empowered_desc:0 "Encompassing a diverse group individuals, the Russian Nationalist movement is comprised of old nationalists who supported the Stolypin government, strongly anti-communist White Army officers who have grown furstrated with the ROVS' apolitical stance, and emigrés who have been influenced by fascist movements in Italy, Germany and Japan during the intevening years since the revolution. Generally, they wish to push the reactionary cause, seeking the restoration of the old Russian Empire as a great power in the world, with strong, decisive leadership, though there is no unified vision on how this should be achieved, and what a counter-revolutionary government should look like.\n\nBy dissolving the Zemsky Sobor, the Nationalists have wrested control over the Russian Government, and are able to shape it as they see fit."
 WRE_FASC_disloyal_1:0 "Russian Nationalist Movement - grumbling"
 WRE_FASC_disloyal_1_desc:0 "Encompassing a diverse group individuals, the Russian Nationalist movement is comprised of old nationalists who supported the Stolypin government, strongly anti-communist White Army officers who have grown furstrated with the ROVS' apolitical stance, and emigrés who have been influenced by fascist movements in Italy, Germany and Japan during the intevening years since the revolution. Generally, they wish to push the reactionary cause, seeking the restoration of the old Russian Empire as a great power in the world, with strong, decisive leadership, though there is no unified vision on how this should be achieved, and what a counter-revolutionary government should look like.\n\nThe Nationalists are currently grumbling about government policies, but there has been little talk of taking action."
 WRE_FASC_disloyal_2:0 "Russian Nationalist Movement - dissatisfied"
 WRE_FASC_disloyal_2_desc:0 "Encompassing a diverse group individuals, the Russian Nationalist movement is comprised of old nationalists who supported the Stolypin government, strongly anti-communist White Army officers who have grown furstrated with the ROVS' apolitical stance, and emigrés who have been influenced by fascist movements in Italy, Germany and Japan during the intevening years since the revolution. Generally, they wish to push the reactionary cause, seeking the restoration of the old Russian Empire as a great power in the world, with strong, decisive leadership, though there is no unified vision on how this should be achieved, and what a counter-revolutionary government should look like.\n\nThe Nationalists are currently dissatisfied with government policies, and some members have been speaking openly to their followers about taking action"
 WRE_FASC_disloyal_3:0 "Russian Nationalist Movement - opposed"
 WRE_FASC_disloyal_3_desc:0 "Encompassing a diverse group individuals, the Russian Nationalist movement is comprised of old nationalists who supported the Stolypin government, strongly anti-communist White Army officers who have grown furstrated with the ROVS' apolitical stance, and emigrés who have been influenced by fascist movements in Italy, Germany and Japan during the intevening years since the revolution. Generally, they wish to push the reactionary cause, seeking the restoration of the old Russian Empire as a great power in the world, with strong, decisive leadership, though there is no unified vision on how this should be achieved, and what a counter-revolutionary government should look like.\n\nThe Nationalists are currently opposed to government policies, and some members have begun to organise rallies critical of the government"
 WRE_FASC_disloyal_4:0 "Russian Nationalist Movement - hostile"
 WRE_FASC_disloyal_4_desc:0 "Encompassing a diverse group individuals, the Russian Nationalist movement is comprised of old nationalists who supported the Stolypin government, strongly anti-communist White Army officers who have grown furstrated with the ROVS' apolitical stance, and emigrés who have been influenced by fascist movements in Italy, Germany and Japan during the intevening years since the revolution. Generally, they wish to push the reactionary cause, seeking the restoration of the old Russian Empire as a great power in the world, with strong, decisive leadership, though there is no unified vision on how this should be achieved, and what a counter-revolutionary government should look like.\n\nThe Nationalists are currently hostile to government policies, with open talk of organising a putsch to 'Save the Nation'."
 WRE_FASC_crushed:0 "Russian Nationalist Movement Crushed"
 WRE_FASC_crushed_desc:0 "The Russian Nationalist Movement has now been effectively crushed by the state, with many of its members being arrested, resigning from government positions in protest, or going into exile."
 WRE_bureucratic_restructuring:0 "Bureaucratic Re-structuring"
 WRE_bureucratic_restructuring_desc:0 "The government is currently working to reform the Soviet Bureaucracy to work with the Counter-Revolutionary State."
 WRE_black_hundreds:0 "The Black Hundreds"
 WRE_black_hundreds_desc:0 "The Black Hundreds, as they were called by their detractors, were a highly reactionary, and ultra-nationalist movement that formed in the wake of the disaster of 1905. Similar to a fascist paramilitary, they toured the country, advocating for Tsarist autocracy, and often stirring up violence and instability, particularly towards non-russians.\n\nInstrumental to the Counter-Revolution, the Blask Hundreds have now resumed their pre-revolutionary activities, supporting the nationalist movement, with or without state or police approval."
 WRE_black_hundreds_2:0 "The Black Hundreds"
 WRE_black_hundreds_2_desc:0 "The Black Hundreds, as they were called by their detractors, were a highly reactionary, and ultra-nationalist movement that formed in the wake of the disaster of 1905. Similar to a fascist paramilitary, they toured the country, advocating for Tsarist autocracy, and often stirring up violence and instability, particularly towards non-russians.\n\nThanks largely to the Nationalists in Government, the Black Hundreds have been reigned in significantly, and now act as a state-run political paramilitary."
 SOV_educate_the_masses_idea:0 "Educate the Masses"
 SOV_consciption_question:0 "The Question of Recruits"
 SOV_consciption_question_desc:0 "Having spent over 20 years in exile, and hoping for the day that the Russian people would rise up to throw off the Bolshevik yoke, the Counter-Revolution has finally begun. However, given that the White movement itself has been infiltrated - on a number of occassions by Soviet spies, there is a growing concern that fresh Black Hundred recruits could too be compromised. As such, White Army command has opted to rely instead on members of the emigré community, who are much more trustworthy."
 SOV_consciption_question_2:0 "The Question of Recruits"
 SOV_consciption_question_2_desc:0 "Having spent over 20 years in exile, and hoping for the day that the Russian people would rise up to throw off the Bolshevik yoke, the Counter-Revolution has finally begun. However, given that the White movement itself has been infiltrated - on a number of occassions by Soviet spies, there is a growing concern that fresh Black Hundred recruits could too be compromised. As such, White Army command has taken some precautions to try to limit the White Movement's reliance on the Black Hundreds, and to draw upon emigré reserves"
 SOV_consciption_question_3:0 "The Question of Recruits"
 SOV_consciption_question_3_desc:0 "Having spent over 20 years in exile, and hoping for the day that the Russian people would rise up to throw off the Bolshevik yoke, the Counter-Revolution has finally begun. However, given that the White movement itself has been infiltrated - on a number of occassions by Soviet spies, there is a growing concern that fresh Black Hundred recruits could too be compromised. However, these concerns have been dismissed by leadership, who have deemed the need for recruits to be too great."
 SOV_intel_leaks_1:0 "Benefitting from Intel Leaks"
 SOV_intel_leaks_1_desc:0 "Agents within the White Movement, as well as loose-lipped and ill-disciplined Black Hundred recruits are giving us a picture of enemy operations, and allowing us to prepare accordingly."
 SOV_intel_leaks_2:0 "Benefitting from Intel Leaks"
 SOV_intel_leaks_2_desc:0 "Agents within the White Movement, as well as loose-lipped and ill-disciplined Black Hundred recruits are giving us a picture of enemy operations, and allowing us to prepare accordingly."
 WRE_emigre_support:0 "Emigré Support"
 WRE_emigre_support_desc:0 "By making use of Russian communities that remain in exile, and the various foreign connections that have been made from the United States, Britain, France, Germany, Italy, Yugoslavia, to Manchuria and Japan, the state is able to tap into forgein resources and expertise, as well as conduct a small amount of spying."
 WRE_military_reeducation:0 "Military Re-education"
 WRE_military_reeducation_desc:0 "Effort is currently being spent to reverse the politicisation of the armed forces by the Soviets, and ensure the loyalty of all new recruits"
 SOV_general_strike:0 "General Strike"
 SOV_general_strike_desc:0 "The Russian Democratic Movement have organised a general strike across the country, bringing most industries to a grinding halt."
 SOV_rally_the_exiles_1:0 "Rally the Exiles!"
 SOV_rally_the_exiles_1_desc:0 "Ready, willing, and trained volunteers from exile communities across the world are flooding into Russia to help the Counter-Revolutionary effort!"
 SOV_rally_the_exiles_2:0 "Rally the Exiles!"
 SOV_rally_the_exiles_2_desc:0 "Ready, willing, and trained volunteers from exile communities across the world are flooding into Russia to help the Counter-Revolutionary effort!"
