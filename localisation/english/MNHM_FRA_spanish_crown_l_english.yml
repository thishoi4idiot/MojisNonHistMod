l_english:
 MNHM_fra_crown.1.t:0 "France Proposes the Union of the Crowns"
 MNHM_fra_crown.1.d:0 "Paris has formally proposed that the crowns of France and Spain be united under a single throne. The Bourbon line that gave us our king now asks that our kingdom be folded into the French crown."
 MNHM_fra_crown.1.a:0 "Accept the union"
 MNHM_fra_crown.1.b:0 "Spain will remain Spain!"
 MNHM_fra_crown.2.t:0 "Spain Refuses the Union"
 MNHM_fra_crown.2.d:0 "The Carlist government in Madrid has rejected our proposal to unite the crowns. Spain remains a separate kingdom."
 MNHM_fra_crown.2.a:0 "Let it go"
 MNHM_fra_crown.2.b:0 "Then we shall take it by force"
 MNHM_fra_crown.3.t:0 "Spain Accepts the Union"
 MNHM_fra_crown.3.d:0 "The Carlist government in Madrid has accepted our proposal. The crowns of France and Spain are united under one throne."
 MNHM_fra_crown.3.a:0 "Long live the united crowns!"
