l_english:
 Paternalistic_Aristocrat:0 "Paternalistic Aristocrat"
 Paternalistic_Aristocrat_desc:0 "Though a foreigner to the Latvian people, Duke Heinrich rules with a sense of ancient, noblesse oblige duty. He views the nation as his estate, and its people as his charges to protect. While his foreign origins breed resentment, his genuine charity softens the blow."
