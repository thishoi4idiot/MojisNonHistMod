l_english:
 SOV_breakaway_commanders_category:0 "Breakaway Commanders"
 SOV_breakaway_commanders_category_desc:0 "Bring the officers of the breakaway republics into the ranks of the new White forces."
 SOV_integrate_breakaway_commanders:0 "Integrate Breakaway Commanders"
 SOV_integrate_breakaway_commanders_desc:0 "The officer corps of the breakaway republics can be won over to the cause of the new Russian state. Whether they return by force or by agreement, their commanders can be brought into the White forces."
 SOV_integrate_breakaway_commanders_tt:0 "Unlocks a decision for each breakaway republic to integrate all of its commanders into the White forces, once we are at peace with it or it no longer exists."
 SOV_recruit_commanders:0 "Integrate the Commanders of [FROM.GetName]"
 SOV_recruit_commanders_desc:0 "Every general and admiral of [FROM.GetName] will leave its service and be integrated into the new White forces."
 denikin_army_theorist:0 "Veteran Army Theorist"
 SOV_rebuilding_the_empire_category:0 "Rebuilding the Empire"
 SOV_rebuilding_the_empire_category_desc:0 "With the Romanov throne restored, the work of rebuilding the Russian Empire can begin."
 SOV_romanov_reconstruction_empire_tt:0 "Unlocks the §YRebuilding the Empire§! decision category."
 SOV_reestablish_congressional_poland:0 "Reestablish Congressional Poland"
 SOV_reestablish_congressional_poland_desc:0 "The Kingdom of Poland created by the Congress of Vienna, bound to the Russian crown, can be restored."
 SOV_reestablish_baltic_governates:0 "Reestablish the Baltic Governates"
 SOV_reestablish_baltic_governates_desc:0 "The Baltic governorates of Estland, Livland and Courland can be restored to the empire."
 SOV_reestablish_grand_duchy_of_finland:0 "Reestablish the Grand Duchy of Finland"
 SOV_reestablish_grand_duchy_of_finland_desc:0 "The Grand Duchy of Finland, united with Russia under the crown, can be restored."
 SOV_russian_economic_dominance:0 "Russian Economic Dominance"
