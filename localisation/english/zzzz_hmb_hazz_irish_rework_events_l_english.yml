l_english:
 sigmaevent.12345.a: "Whats the worse that could happen?"
 sigmaevent.12345.b: "Why would we do this"
 sigmaevent.12345.d: "Australia has a large Population of Irish people perhaps as we are\nboth Dominions of the British Crown we should seek Unification?"
 sigmaevent.12345.t: "Ireland wishes to Unify with us"
 sigmaevent.1234567676767.a: "Our Partners will make great use of this"
 sigmaevent.1234567676767.b: "These resources are far to important to give up"
 sigmaevent.1234567676767.d: "Ireland is requesting control of our resources in Ceylon having such a large supply ourselves surely this\nwouldn't hurt"
 sigmaevent.1234567676767.t: "Ireland Requests control of resources in Ceylon"
 sigmaevent.32.a: "Ireland will be a Useful Ally"
 sigmaevent.32.b: "This is ridiculous"
 sigmaevent.32.d: "Although not shared to the public there have been talks between the \nUnited Kingdom and Ireland over Ireland aiding Britain in return for \nthe reclamation of Northern Ireland if we wish for greater access to the \nAtlantic we must give up our lands\nin Ireland"
 sigmaevent.32.t: "The Macdonald Proposal"
 sigmaevent.42.a: "Ireland Will be a Useful Ally"
 sigmaevent.42.b: "We will stay on our own path"
 sigmaevent.42.d: "The Irish Government has recently requested to Ally with our Country"
 sigmaevent.42.t: "Alliance with Ireland?"
 sigmaevent.67.a: "We are Gracious Victors"
 sigmaevent.67.b: "Ireland Must be Punished"
 sigmaevent.67.d: "Ireland has given up on Northern Ireland and now requests to white peace out of the war"
 sigmaevent.67.t: "Irish Negotiated Peace"
 sigmaevent.67.a: "Give Them Sierra Leone"
 sigmaevent.67.b: "Give Them Ghana"
 sigmaevent.67.c: "We are not giving them anything"
 sigmaevent.67.d: "As our Dominion Ireland has requested to help garrison some of our Colonies in Africa by controlling them"
 sigmaevent.67.t: "Ireland requests control over Colonies"
 sigmaevent.671.a: "We must Reunite Ireland"
 sigmaevent.671.b: "\"I love Ireland so much i prefer 2 of them\""
 sigmaevent.671.d: "As our Colony Ireland is requesting Unionship with Northern Ireland"
 sigmaevent.671.t: "Ireland Requests Unionship with Northern Ireland"
 sigmaevent.67111.a: "A great deal to Strengthen us both!"
 sigmaevent.67111.b: "We would much rather keep Brittany to ourselves"
 sigmaevent.67111.d: "Our Allies in Ireland wish to claim our land in Brittony however instead of trying to seize it through\nforce they have offered us a trade deal for the land"
 sigmaevent.67111.t: "Ireland seeks to Purchase Brittany"
 sigmaevent.6711122.a: "Together we are Stronger"
 sigmaevent.6711122.b: "We are Stronger alone..."
 sigmaevent.6711122.d: "The Irish Government has recently requested to Ally with our Country"
 sigmaevent.6711122.t: "Franco Irish Alliance?"
 sigmaevent.671167676767.a: "This partnership is perfect!"
 sigmaevent.671167676767.b: "The wolf howls alone"
 sigmaevent.671167676767.d: "The Irish Government has recently requested to Ally with our Country"
 sigmaevent.671167676767.t: "Irish Alliance with Germany?"
 sigmaevent.68.a: "We cannot let this war distract us"
 sigmaevent.68.b: "We must keep our access to the Atlantic"
 sigmaevent.68.d: "While preocupied in more important theatres the Irish have managed to seize \nNorthern Ireland with us and now seek a seperate peace while Northern \nIreland may grant us access to Atlantic ports we might be to distracted to \nfocus on Ireland"
 sigmaevent.68.t: "Peace with Ireland"
