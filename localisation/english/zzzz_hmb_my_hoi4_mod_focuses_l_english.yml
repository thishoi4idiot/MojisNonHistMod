l_english:
 my_hoi4_mod_LUX_focus_tree_focus_10:0 "French Tourism"
 my_hoi4_mod_LUX_focus_tree_focus_100:0 "Naval Research"
 my_hoi4_mod_LUX_focus_tree_focus_100_desc:0 "Accelerate research into advanced ship designs to improve speed, range, and operational durability across all fleet classes."
 my_hoi4_mod_LUX_focus_tree_focus_101:0 "Naval Bomber Investment"
 my_hoi4_mod_LUX_focus_tree_focus_101_desc:0 "Expand specialized air wings equipped with heavy torpedoes and radar to track and destroy enemy surface fleets."
 my_hoi4_mod_LUX_focus_tree_focus_102:0 "Prepare the Benelux for War"
 my_hoi4_mod_LUX_focus_tree_focus_102_desc:0 "Shift domestic industry toward military production and call up reserve personnel to maximize total defense readiness."
 my_hoi4_mod_LUX_focus_tree_focus_103:0 "Blitzkrieg"
 my_hoi4_mod_LUX_focus_tree_focus_103_desc:0 "Coordinate mechanized armor, motorized infantry, and close air support to rapidly pierce enemy lines and overwhelm command networks"
 my_hoi4_mod_LUX_focus_tree_focus_104:0 "Mefo Bills"
 my_hoi4_mod_LUX_focus_tree_focus_104_desc:0 "\nIssue secret promissory notes to disguise massive rearmament spending, deferring financial obligation while instantly supercharging our military-industrial capacity.\n"
 my_hoi4_mod_LUX_focus_tree_focus_105:0 "Foreign Military Company Investment"
 my_hoi4_mod_LUX_focus_tree_focus_105_desc:0 "Contract foreign arms manufacturers and military advisors to rapidly modernize our armed forces and grant access to advanced doctrine and equipment."
 my_hoi4_mod_LUX_focus_tree_focus_106:0 "The Benelux Theater"
 my_hoi4_mod_LUX_focus_tree_focus_106_desc:0 "To secure the Benelux theater and establish total operational dominance across the Low Countries, implement the following strategic measures"
 my_hoi4_mod_LUX_focus_tree_focus_107:0 "Promote Government Support within Belgium"
 my_hoi4_mod_LUX_focus_tree_focus_107_desc:0 "\n\nTo consolidate rule and cultivate broad popular support across the Belgian provinces, implement a targeted integration strategy"
 my_hoi4_mod_LUX_focus_tree_focus_108:0 "Anschluss"
 my_hoi4_mod_LUX_focus_tree_focus_108_desc:0 "Execute the formal annexation and administrative absorption of Belgium into Greater Luxembourg"
 my_hoi4_mod_LUX_focus_tree_focus_109:0 "Reunite the German People"
 my_hoi4_mod_LUX_focus_tree_focus_109_desc:0 "\nTo achieve the total consolidation of German-speaking populations into Greater Luxembourg, implement a comprehensive strategy of diplomatic pressure, irredentist claim-staking, and border expansion"
 my_hoi4_mod_LUX_focus_tree_focus_11:0 "Japanese Tourism"
 my_hoi4_mod_LUX_focus_tree_focus_110:0 "Schlieffen Plan"
 my_hoi4_mod_LUX_focus_tree_focus_110_desc:0 "Execute a modified operational maneuver to outflank western defenses and force a rapid capitulation"
 my_hoi4_mod_LUX_focus_tree_focus_111:0 "Integration of Calais"
 my_hoi4_mod_LUX_focus_tree_focus_111_desc:0 "Replace local municipal structures with centralized district governance to guarantee full economic and political integration."
 my_hoi4_mod_LUX_focus_tree_focus_112:0 "Axis Army Joint Command"
 my_hoi4_mod_LUX_focus_tree_focus_112_desc:0 "Unify operational control across member states to streamline multi-national frontlines and strategic coordination.\n"
 my_hoi4_mod_LUX_focus_tree_focus_113:0 "Develop Domestic Industry"
 my_hoi4_mod_LUX_focus_tree_focus_113_desc:0 "Allocate state capital and tax incentives toward core manufacturing, metal refining, and energy production."
 my_hoi4_mod_LUX_focus_tree_focus_114:0 "Work Unions Banned"
 my_hoi4_mod_LUX_focus_tree_focus_114_desc:0 "Abolish independent trade unions and consolidate all organized labor into a single, state-run labor front to maintain absolute control over industrial production and eliminate strike actions"
 my_hoi4_mod_LUX_focus_tree_focus_115:0 "Anti-Communist Idea"
 my_hoi4_mod_LUX_focus_tree_focus_115_desc:0 "Champion the fundamental right of individuals to own land, run private businesses, and keep the fruits of their labor."
 my_hoi4_mod_LUX_focus_tree_focus_116:0 "Stabilize the New Order"
 my_hoi4_mod_LUX_focus_tree_focus_116_desc:0 "Consolidate authority and secure the state's foundation through targeted administrative, economic,"
 my_hoi4_mod_LUX_focus_tree_focus_117:0 "The Empire of the World"
 my_hoi4_mod_LUX_focus_tree_focus_117_desc:0 "Establish an absolute planetary empire by systematically subduing all sovereign nations, dismantling foreign governments, and binding every continent under the total and unified command of the central state."
 my_hoi4_mod_LUX_focus_tree_focus_118:0 "Mechanised Expansion"
 my_hoi4_mod_LUX_focus_tree_focus_118_desc:0 "Standardize Production Lines: Transition vehicle assembly plants from half-tracks to fully enclosed, mass-produced armored personnel carriers"
 my_hoi4_mod_LUX_focus_tree_focus_119:0 "Expand Calais Industry"
 my_hoi4_mod_LUX_focus_tree_focus_119_desc:0 "Build integrated steel mills, chemical processing plants, and manufacturing hubs to boost base production capacity"
 my_hoi4_mod_LUX_focus_tree_focus_12:0 "Steelcasting Industry"
 my_hoi4_mod_LUX_focus_tree_focus_120:0 "Expand Calais Dockyards"
 my_hoi4_mod_LUX_focus_tree_focus_120_desc:0 "Build expansive naval basins and high-capacity slipways to support the rapid construction and repair of capital ships"
 my_hoi4_mod_LUX_focus_tree_focus_121:0 "Reform to the Grand Duchy"
 my_hoi4_mod_LUX_focus_tree_focus_121_desc:0 "Reform Luxembourg into a modern Grand Duchy, abandoning territorial ambitions in favour of stability and internal strength. A renewed focus on governance, prosperity, and national unity will secure Luxembourg’s future"
 my_hoi4_mod_LUX_focus_tree_focus_122:0 "Bourbon Spanish Realm"
 my_hoi4_mod_LUX_focus_tree_focus_122_desc:0 "Reassert the monarchist authority of the House of Nassau-Weilburg, unifying the Grand Duchy under traditional executive rule"
 my_hoi4_mod_LUX_focus_tree_focus_124:0 "Napoleonic State"
 my_hoi4_mod_LUX_focus_tree_focus_124_desc:0 "Transform Luxembourg into a Napoleonic state, adopting a centralised government inspired by Napoleon’s legacy. Luxembourg will seek to expand its influence and build a powerful new empire from the heart of Europe"
 my_hoi4_mod_LUX_focus_tree_focus_125:0 "Address the Political Situation"
 my_hoi4_mod_LUX_focus_tree_focus_125_desc:0 "Re-establish traditional state organs, royal decree systems, and constitutional frameworks under the monarch's authority"
 my_hoi4_mod_LUX_focus_tree_focus_126:0 "Address the Economic Situatiion"
 my_hoi4_mod_LUX_focus_tree_focus_126_desc:0 "Restructure state obligations, renegotiate credit terms, and prioritize funding for high-yield economic infrastructure"
 my_hoi4_mod_LUX_focus_tree_focus_127:0 "The Collectivisation Process"
 my_hoi4_mod_LUX_focus_tree_focus_127_desc:0 "Begin the collectivisation of Luxembourg’s agriculture and economy by bringing key resources and production under collective ownership. This will reduce private control and strengthen the state’s ability to direct national production."
 my_hoi4_mod_LUX_focus_tree_focus_128:0 "Forge a Colonial Empire"
 my_hoi4_mod_LUX_focus_tree_focus_128_desc:0 "Build a colonial empire to expand Luxembourg’s influence beyond Europe. Overseas territories will provide valuable resources, new markets, and greater economic and strategic power."
 my_hoi4_mod_LUX_focus_tree_focus_129:0 "Monopolise the Spice"
 my_hoi4_mod_LUX_focus_tree_focus_129_copy:0 "Annex the Spice"
 my_hoi4_mod_LUX_focus_tree_focus_129_copy_desc:0 "Integrate island agricultural output, deepwater ports, and key energy processing infrastructure into the state supply chain"
 my_hoi4_mod_LUX_focus_tree_focus_129_desc:0 "Expand Luxembourg’s influence toward the Dutch East Indies by pursuing greater economic and political involvement. Access to its resources and markets will strengthen Luxembourg’s overseas interests and economic power."
 my_hoi4_mod_LUX_focus_tree_focus_12_desc:0 "Expand Luxembourg's steelcasting industry by investing in modern facilities and improving production methods. This will increase steel output and strengthen the nation's industrial capabilities."
 my_hoi4_mod_LUX_focus_tree_focus_13:0 "Strengthen Belgian Industry"
 my_hoi4_mod_LUX_focus_tree_focus_130:0 "Monopolise the Rubber"
 my_hoi4_mod_LUX_focus_tree_focus_130_copy:0 "Annex the Rubber"
 my_hoi4_mod_LUX_focus_tree_focus_130_copy_desc:0 "Establish direct colonial administration over central Africa, integrating tropical territories and global trade outposts into the state domain"
 my_hoi4_mod_LUX_focus_tree_focus_130_desc:0 "Strengthen Luxembourg’s influence over the Belgian Congo by expanding economic and political ties. Greater access to its resources will provide valuable opportunities for industry and strengthen Luxembourg’s position overseas."
 my_hoi4_mod_LUX_focus_tree_focus_131:0 "Integrate the Colonial Subjects"
 my_hoi4_mod_LUX_focus_tree_focus_131_desc:0 "Integrate the Belgian Congo and Dutch East Indies into the expanding Benelux sphere, uniting their resources and administrations under a common system. This will transform the nation into a major overseas power with vast economic potential."
 my_hoi4_mod_LUX_focus_tree_focus_132:0 "The Homeland Calls"
 my_hoi4_mod_LUX_focus_tree_focus_132_desc:0 "With threats growing across Europe, Luxembourg must answer the call to defend its homeland. Rally the people and prepare the nation to protect its independence at any cost."
 my_hoi4_mod_LUX_focus_tree_focus_133:0 "Question of Expansion"
 my_hoi4_mod_LUX_focus_tree_focus_133_desc:0 "Assert diplomatic and military hegemony over smaller neighboring states through guaranteed protectorate status or outright annexation"
 my_hoi4_mod_LUX_focus_tree_focus_134:0 "Freedom of Speech"
 my_hoi4_mod_LUX_focus_tree_focus_134_desc:0 "Safeguard the right of citizens to voice opinions, criticize governance, and share ideas without fear of state censorship or persecution"
 my_hoi4_mod_LUX_focus_tree_focus_135:0 "Press Censorship"
 my_hoi4_mod_LUX_focus_tree_focus_135_desc:0 "Restrict independent media outlets, state-sanctioned reporting, and opposition pamphlets to maintain government authority"
 my_hoi4_mod_LUX_focus_tree_focus_136:0 "Compulsary Education"
 my_hoi4_mod_LUX_focus_tree_focus_136_desc:0 "Mandate mandatory school attendance for all youth to build a skilled, educated workforce and standardise national values"
 my_hoi4_mod_LUX_focus_tree_focus_137:0 "Forced Labour for the Adolescents"
 my_hoi4_mod_LUX_focus_tree_focus_137_desc:0 "Draft adolescents into compulsory state-directed labor service to cover critical agricultural and industrial labor shortages"
 my_hoi4_mod_LUX_focus_tree_focus_138:0 "Legal System Established"
 my_hoi4_mod_LUX_focus_tree_focus_138_desc:0 "Establish a unified legal framework and constitutional body to enforce equal justice, legal precedents, and public order"
 my_hoi4_mod_LUX_focus_tree_focus_139:0 "Expand the Fruit Industry"
 my_hoi4_mod_LUX_focus_tree_focus_139_desc:0 "Provide direct state capital and land grants to convert arable soil into large-scale commercial orchards and vineyards"
 my_hoi4_mod_LUX_focus_tree_focus_13_desc:0 "Invest in Belgium's industrial base and expand its factories to strengthen production. A stronger Belgian industry will provide Luxembourg with greater economic and military capabilities."
 my_hoi4_mod_LUX_focus_tree_focus_14:0 "Prepare for the Inevitable"
 my_hoi4_mod_LUX_focus_tree_focus_140:0 "Expand the Sugar Industry"
 my_hoi4_mod_LUX_focus_tree_focus_140_desc:0 "Allocate state funds to expand plantation acreage, introduce high-yield crop varieties, and mechanize harvesting operations"
 my_hoi4_mod_LUX_focus_tree_focus_141:0 "Belgian Affairs"
 my_hoi4_mod_LUX_focus_tree_focus_141_desc:0 "Neutralize or integrate key Belgian border sectors to remove a traditional invasion choke point and secure the western approaches"
 my_hoi4_mod_LUX_focus_tree_focus_142:0 "Dutch Affairs"
 my_hoi4_mod_LUX_focus_tree_focus_142_desc:0 "Establish direct diplomatic influence or strategic leverage over the Netherlands to safeguard western trade routes and coastal flanks"
 my_hoi4_mod_LUX_focus_tree_focus_145:0 "Our Place in Europe"
 my_hoi4_mod_LUX_focus_tree_focus_145_desc:0 "Assert sovereign geopolitical influence across key European diplomatic forums and regional power blocs"
 my_hoi4_mod_LUX_focus_tree_focus_146:0 "Economic Boom"
 my_hoi4_mod_LUX_focus_tree_focus_146_desc:0 "Rapidly build out heavy infrastructure, factory production capacity, and extraction networks to accelerate national wealth creation and GDP growth"
 my_hoi4_mod_LUX_focus_tree_focus_147:0 "Socialist Syndicalism"
 my_hoi4_mod_LUX_focus_tree_focus_147_desc:0 "Adopt socialist syndicalism, giving organised workers a greater role in managing industries and the economy. Trade unions will become central to production and decision-making, strengthening the influence of the working class."
 my_hoi4_mod_LUX_focus_tree_focus_148:0 "The Guyana Crisis"
 my_hoi4_mod_LUX_focus_tree_focus_148_desc:0 "Establish direct hegemony over the northern South American coast, securing crucial resources and eliminating foreign footholds in the Americas"
 my_hoi4_mod_LUX_focus_tree_focus_149:0 "Venezuela Issue"
 my_hoi4_mod_LUX_focus_tree_focus_149_desc:0 "Utilize high oil output to secure favorable bilateral trade deals or leverage geopolitical concessions from European powers"
 my_hoi4_mod_LUX_focus_tree_focus_14_desc:0 "Prepare Luxembourg for the challenges that lie ahead and strengthen the nation's defences. The coming conflict may be unavoidable, and we must be ready to face it."
 my_hoi4_mod_LUX_focus_tree_focus_15:0 "Hire the Kids into the Factories"
 my_hoi4_mod_LUX_focus_tree_focus_150:0 "American Intervention"
 my_hoi4_mod_LUX_focus_tree_focus_150_desc:0 "Launch a transatlantic campaign to project European influence directly into the Caribbean and South American theaters"
 my_hoi4_mod_LUX_focus_tree_focus_151:0 "New Granada"
 my_hoi4_mod_LUX_focus_tree_focus_151_desc:0 "Exploit unstable local governance to establish total Luxembourgian oversight over northern South American shipping routes"
 my_hoi4_mod_LUX_focus_tree_focus_152:0 "Viceroyalty of Peru"
 my_hoi4_mod_LUX_focus_tree_focus_152_desc:0 "Reassert Luxembourg’s influence over Peru and restore its place within the expanding Bourbon-Spanish sphere"
 my_hoi4_mod_LUX_focus_tree_focus_153:0 "La Plata"
 my_hoi4_mod_LUX_focus_tree_focus_153_desc:0 "Reassert Luxembourg’s influence over La Plata and restore its place within the expanding Bourbon-Spanish sphere"
 my_hoi4_mod_LUX_focus_tree_focus_154:0 "New Spain"
 my_hoi4_mod_LUX_focus_tree_focus_154_desc:0 "Reassert Luxembourg’s influence over New Spain and restore its place within the expanding Bourbon-Spanish sphere"
 my_hoi4_mod_LUX_focus_tree_focus_155:0 "Proclaim the Spanish Crown"
 my_hoi4_mod_LUX_focus_tree_focus_155_desc:0 "Proclaim the Spanish Crown and restore the monarchy as the centre of the renewed imperial state. This marks a decisive step toward uniting the Spanish territories under a single royal authority"
 my_hoi4_mod_LUX_focus_tree_focus_156:0 "Filipino Expedition"
 my_hoi4_mod_LUX_focus_tree_focus_156_desc:0 "Reassert Luxembourg’s influence over Asia and restore its place within the expanding Bourbon-Spanish sphere"
 my_hoi4_mod_LUX_focus_tree_focus_157:0 "American Conquests"
 my_hoi4_mod_LUX_focus_tree_focus_157_desc:0 "Prepare to reclaim territory in North America and challenge American influence across the continent. The Crown will seek to expand its sphere of power and restore its former imperial ambitions"
 my_hoi4_mod_LUX_focus_tree_focus_158:0 "Gold Mines Established"
 my_hoi4_mod_LUX_focus_tree_focus_158_desc:0 "Establish gold mines across Peru and Mexico to exploit their vast mineral wealth. The resulting riches will strengthen Luxembourg’s economy and help finance the restoration of the empire"
 my_hoi4_mod_LUX_focus_tree_focus_159:0 "French Nationality"
 my_hoi4_mod_LUX_focus_tree_focus_159_desc:0 "Restore French nationality across the reclaimed territories, strengthening cultural and political ties to the renewed French Empire. This will help unite the population under a common national identity"
 my_hoi4_mod_LUX_focus_tree_focus_15_desc:0 "Expand the industrial workforce by bringing younger workers into factories to meet rising production demands. This will rapidly increase industrial output, though at a significant social cost."
 my_hoi4_mod_LUX_focus_tree_focus_16:0 "Establish the Cattle Ranches"
 my_hoi4_mod_LUX_focus_tree_focus_160:0 "Devalue the Franc"
 my_hoi4_mod_LUX_focus_tree_focus_160_desc:0 "Devalue the franc to boost Luxembourg’s exports and make its industries more competitive. This economic measure will help stimulate production and strengthen the state’s position in international trade"
 my_hoi4_mod_LUX_focus_tree_focus_161:0 "Befriend France"
 my_hoi4_mod_LUX_focus_tree_focus_161_desc:0 "Forge a close friendship with France and strengthen diplomatic ties between the two nations. Cooperation with France will provide Luxembourg with a powerful partner as it expands its influence"
 my_hoi4_mod_LUX_focus_tree_focus_162:0 "Reclaim the French Throne"
 my_hoi4_mod_LUX_focus_tree_focus_162_desc:0 "Restore the French throne under Luxembourg’s influence, reviving the monarchy and placing the nation at the centre of a renewed French political order. This ambitious claim will reshape the balance of power in Europe"
 my_hoi4_mod_LUX_focus_tree_focus_163:0 "French Gold"
 my_hoi4_mod_LUX_focus_tree_focus_163_desc:0 "Transfer gold to France to strengthen its economy and support the restoration of French power. This wealth will help fund reconstruction, industry, and the rebuilding of the French Empire"
 my_hoi4_mod_LUX_focus_tree_focus_164:0 "Militaristic Preperations"
 my_hoi4_mod_LUX_focus_tree_focus_164_desc:0 "Begin militaristic preparations to strengthen Luxembourg’s armed forces for the challenges ahead. Expand training, improve infrastructure, and ensure the nation is ready for future conflicts"
 my_hoi4_mod_LUX_focus_tree_focus_165:0 "Retribution for Seden"
 my_hoi4_mod_LUX_focus_tree_focus_165_desc:0 "Seek retribution for the defeat at Sedan and restore Luxembourg’s honour through military strength. The nation will prepare to overturn the legacy of that humiliation and prove itself on the battlefield"
 my_hoi4_mod_LUX_focus_tree_focus_166:0 "Expand into the Last Bastion of Natives in Asia"
 my_hoi4_mod_LUX_focus_tree_focus_166_desc:0 "Eliminate the final independent indigenous enclaves to enforce total colonial hegemony and extract untapped regional resources"
 my_hoi4_mod_LUX_focus_tree_focus_167:0 "Become a Sister Republic"
 my_hoi4_mod_LUX_focus_tree_focus_167_desc:0 "Declare Luxembourg a sister republic of France, embracing shared republican ideals and closer political cooperation. This new relationship will strengthen ties between the two nations and create a united front in Europe."
 my_hoi4_mod_LUX_focus_tree_focus_168:0 "Develop Paris"
 my_hoi4_mod_LUX_focus_tree_focus_168_desc:0 "Invest heavily in the development of Paris, transforming it into a major centre of industry, culture, and administration. A revitalised capital will serve as a symbol of Luxembourg’s growing influence over France"
 my_hoi4_mod_LUX_focus_tree_focus_169:0 "Napoleon's Innovative Warfare"
 my_hoi4_mod_LUX_focus_tree_focus_169_desc:0 "Embrace innovative Napoleonic warfare, combining bold strategy, rapid manoeuvre, and modern military doctrine. Luxembourg’s forces will seek to outpace its enemies through superior tactics and coordination"
 my_hoi4_mod_LUX_focus_tree_focus_16_desc:0 "Establish large-scale cattle ranches to expand Luxembourg’s livestock industry and increase agricultural production. These ranches will provide valuable food supplies and strengthen the nation’s rural economy."
 my_hoi4_mod_LUX_focus_tree_focus_17:0 "Economic Reforms"
 my_hoi4_mod_LUX_focus_tree_focus_170:0 "Dominion of the Rhine"
 my_hoi4_mod_LUX_focus_tree_focus_170_desc:0 "Establish Luxembourg’s dominion over the Rhine, securing control of this vital region and its strategic waterways. The Rhine will become a cornerstone of Luxembourg’s growing power and influence in Western Europe"
 my_hoi4_mod_LUX_focus_tree_focus_171:0 "A New Europe"
 my_hoi4_mod_LUX_focus_tree_focus_171_desc:0 "Reshape Europe under Luxembourg’s growing influence, replacing the old balance of power with a new continental order. A united and powerful Europe will emerge under Napoleon’s leadership"
 my_hoi4_mod_LUX_focus_tree_focus_172:0 "Build a Fleet to Secure Gold Shipments"
 my_hoi4_mod_LUX_focus_tree_focus_172_desc:0 "Build a powerful fleet to protect the transport of gold and other valuable resources from the Americas. Securing these trade routes will safeguard Luxembourg’s wealth and strengthen its growing imperial ambitions"
 my_hoi4_mod_LUX_focus_tree_focus_173:0 "The Merchant State"
 my_hoi4_mod_LUX_focus_tree_focus_173_desc:0 "Transform Luxembourg into a powerful merchant state focused on trade, finance, and commercial prosperity. By investing in commerce and international markets, the Grand Duchy can build wealth without territorial expansion"
 my_hoi4_mod_LUX_focus_tree_focus_174:0 "Move Industrial Assets"
 my_hoi4_mod_LUX_focus_tree_focus_174_desc:0 "Relocate Luxembourg’s industrial assets to more strategically valuable regions, improving efficiency and strengthening the nation’s economic position. This reorganisation will prepare the Grand Duchy for a more secure and prosperous future"
 my_hoi4_mod_LUX_focus_tree_focus_175:0 "Move Military Assets"
 my_hoi4_mod_LUX_focus_tree_focus_175_desc:0 "Relocate Luxembourg’s military assets to strategically important positions, improving the armed forces’ readiness and defensive capabilities. This reorganisation will ensure the Grand Duchy remains secure despite its limited territorial ambitions"
 my_hoi4_mod_LUX_focus_tree_focus_176:0 "Playing Tall"
 my_hoi4_mod_LUX_focus_tree_focus_176_desc:0 "Embrace a strategy of playing tall, focusing entirely on internal development rather than territorial expansion. Luxembourg will maximise its industry, infrastructure, technology, and prosperity to become a small but exceptionally powerful stat"
 my_hoi4_mod_LUX_focus_tree_focus_177:0 "Luxury Goods from Around the World"
 my_hoi4_mod_LUX_focus_tree_focus_177_desc:0 "Import luxury goods from across the world to transform Luxembourg into a hub of international commerce. Global trade will enrich the nation and strengthen its position as a prosperous merchant state"
 my_hoi4_mod_LUX_focus_tree_focus_178:0 "Military Construction"
 my_hoi4_mod_LUX_focus_tree_focus_178_desc:0 "Expand military construction to strengthen Luxembourg’s defensive infrastructure. New facilities and fortifications will ensure the Grand Duchy remains secure while pursuing its peaceful, prosperous path"
 my_hoi4_mod_LUX_focus_tree_focus_179:0 "Fort Luxembourg"
 my_hoi4_mod_LUX_focus_tree_focus_179_desc:0 "Strengthen the historic fortifications of Luxembourg and transform them into a modern defensive network. Fort Luxembourg will stand as a symbol of the Grand Duchy’s independence and determination to defend itself."
 my_hoi4_mod_LUX_focus_tree_focus_17_desc:0 "Implement wide-ranging economic reforms to modernise Luxembourg’s economy and improve its efficiency. These changes will encourage growth, strengthen industry, and create a more resilient economic foundation."
 my_hoi4_mod_LUX_focus_tree_focus_180:0 "Futuristic Factories"
 my_hoi4_mod_LUX_focus_tree_focus_180_desc:0 "Build futuristic factories equipped with advanced technology and highly efficient production systems. These facilities will push Luxembourg’s industry far ahead of its time and cement its status as an economic powerhouse."
 my_hoi4_mod_LUX_focus_tree_focus_181:0 "Foreign Investers"
 my_hoi4_mod_LUX_focus_tree_focus_181_desc:0 "Attract foreign investors with favourable policies and a stable economy. International capital will accelerate Luxembourg’s industrial growth and strengthen its position as a global financial centre."
 my_hoi4_mod_LUX_focus_tree_focus_182:0 "Foreign Monopolies"
 my_hoi4_mod_LUX_focus_tree_focus_182_desc:0 "Invite foreign monopolies to establish themselves in Luxembourg, bringing vast capital and international expertise into the economy. Their presence will expand trade and industry while turning the Grand Duchy into a major commercial hub"
 my_hoi4_mod_LUX_focus_tree_focus_183:0 "Trade Empire"
 my_hoi4_mod_LUX_focus_tree_focus_183_desc:0 "Build a global trade empire centred on Luxembourg’s finance, commerce, and international connections. Without expanding its borders, the Grand Duchy will become a small but immensely wealthy economic power."
 my_hoi4_mod_LUX_focus_tree_focus_184:0 "Hydro-electricity Power"
 my_hoi4_mod_LUX_focus_tree_focus_184_desc:0 "Develop Luxembourg’s hydroelectric power to provide clean, reliable energy for industry and urban growth. Expanding renewable power will strengthen the economy while reducing dependence on imported fuel."
 my_hoi4_mod_LUX_focus_tree_focus_185:0 "Sushi Trade Agreement"
 my_hoi4_mod_LUX_focus_tree_focus_186:0 "Pizza Trade Agreement"
 my_hoi4_mod_LUX_focus_tree_focus_187:0 "Rice Trade Agreement"
 my_hoi4_mod_LUX_focus_tree_focus_188:0 "Sausage Trade Agreement"
 my_hoi4_mod_LUX_focus_tree_focus_189:0 "Tea Trade Agreement"
 my_hoi4_mod_LUX_focus_tree_focus_19:0 "Cattle Monopoly"
 my_hoi4_mod_LUX_focus_tree_focus_190:0 "Baguette Trade Agreement"
 my_hoi4_mod_LUX_focus_tree_focus_191:0 "Hamburger Trade Agreement"
 my_hoi4_mod_LUX_focus_tree_focus_192:0 "Vodka Trade Agreement"
 my_hoi4_mod_LUX_focus_tree_focus_19_desc:0 "Consolidate Luxembourg’s cattle industry under a single national monopoly to maximise production and control the supply of livestock. This will increase efficiency and give the government greater influence over the agricultural sector"
 my_hoi4_mod_LUX_focus_tree_focus_2:0 "Agricultural Development"
 my_hoi4_mod_LUX_focus_tree_focus_20:0 "The Grain Tax"
 my_hoi4_mod_LUX_focus_tree_focus_20_desc:0 "Introduce a grain tax to raise government revenue and strengthen Luxembourg’s economy. The additional funds can be invested into agriculture, industry, and national development."
 my_hoi4_mod_LUX_focus_tree_focus_21:0 "Mobilise the Tractors"
 my_hoi4_mod_LUX_focus_tree_focus_21_2:0 "Utilising the Farmers Stability"
 my_hoi4_mod_LUX_focus_tree_focus_21_2_desc:0 "Support Luxembourg’s farmers with improved tools, resources, and modern farming methods. A stronger agricultural sector will increase food production and provide greater economic stability."
 my_hoi4_mod_LUX_focus_tree_focus_21_desc:0 "Mobilise Luxembourg’s tractors and agricultural machinery to support the national war effort. This will improve logistical capacity while keeping vital agricultural production running."
 my_hoi4_mod_LUX_focus_tree_focus_22:0 "Arcelor Mittal"
 my_hoi4_mod_LUX_focus_tree_focus_22_desc:0 "Strengthen Luxembourg’s steel industry by expanding and modernising ArcelorMittal’s operations. Increased steel production will provide valuable resources for industry, infrastructure, and future military expansion."
 my_hoi4_mod_LUX_focus_tree_focus_23:0 "Exploit Dutch Coal"
 my_hoi4_mod_LUX_focus_tree_focus_23_desc:0 "Secure access to Dutch coal to fuel Luxembourg’s growing industries and steel production. Expanding imports will provide the energy needed to support continued industrial development."
 my_hoi4_mod_LUX_focus_tree_focus_24:0 "Embrace Feudalism"
 my_hoi4_mod_LUX_focus_tree_focus_24_desc:0 "Return to a feudal system and reorganise Luxembourg’s society around powerful landowners and traditional institutions. This radical transformation will reshape the economy, agriculture, and government under a new social order."
 my_hoi4_mod_LUX_focus_tree_focus_25:0 "Gun Factory of Europe"
 my_hoi4_mod_LUX_focus_tree_focus_25_desc:0 "Transform Luxembourg into Europe's leading arms producer by massively expanding weapons manufacturing and modernising military industry. With enough investment, our factories will supply armies across the continent."
 my_hoi4_mod_LUX_focus_tree_focus_27:0 "Reorganise the Luxembourg Army"
 my_hoi4_mod_LUX_focus_tree_focus_27_desc:0 "Reorganise Luxembourg’s armed forces to improve their structure, training, and effectiveness. A more disciplined and modern army will be better prepared to defend the nation and face future conflicts."
 my_hoi4_mod_LUX_focus_tree_focus_28:0 "Infantary Development"
 my_hoi4_mod_LUX_focus_tree_focus_28_desc:0 "Improve Luxembourg’s infantry through better training, equipment, and battlefield tactics. These developments will make the army more effective and better prepared for modern warfare."
 my_hoi4_mod_LUX_focus_tree_focus_29:0 "Tank Development"
 my_hoi4_mod_LUX_focus_tree_focus_29_desc:0 "Invest in the development of modern armoured vehicles to strengthen Luxembourg’s military capabilities. New tank designs will provide greater mobility, protection, and firepower on the battlefield."
 my_hoi4_mod_LUX_focus_tree_focus_2_desc:0 "Modernise Luxembourg’s agricultural sector through improved farming methods, equipment, and infrastructure. Greater agricultural output will strengthen the economy and improve national self-sufficiency."
 my_hoi4_mod_LUX_focus_tree_focus_3:0 "Scientific Breakthrough"
 my_hoi4_mod_LUX_focus_tree_focus_30:0 "Aerial Development"
 my_hoi4_mod_LUX_focus_tree_focus_30_desc:0 "Expand Luxembourg’s aviation capabilities through investment in aircraft, training, and modern technology. A stronger air force will provide valuable support to the army and improve national defence."
 my_hoi4_mod_LUX_focus_tree_focus_31:0 "Artillary Focus"
 my_hoi4_mod_LUX_focus_tree_focus_31_desc:0 "Prioritise the development and production of artillery to provide Luxembourg’s army with greater firepower. Stronger artillery support will improve the army’s ability to break through enemy positions and defend key areas."
 my_hoi4_mod_LUX_focus_tree_focus_32:0 "Mass Mobilisation"
 my_hoi4_mod_LUX_focus_tree_focus_32_desc:0 "Adopt mass mobilisation to rapidly expand Luxembourg’s armed forces and bring more manpower into military service. This will provide the army with the numbers needed to sustain a large-scale war effort."
 my_hoi4_mod_LUX_focus_tree_focus_33:0 "November 11 1918"
 my_hoi4_mod_LUX_focus_tree_focus_33_desc:0 "Remember the sacrifices and hardships of the Great War, nearly two decades after its end. The lessons of the conflict will shape Luxembourg’s preparations for the uncertain years ahead."
 my_hoi4_mod_LUX_focus_tree_focus_34_copy_copy:0 "CAS Focus"
 my_hoi4_mod_LUX_focus_tree_focus_34_copy_copy_desc:0 "Focus on developing close air support aircraft to provide direct assistance to Luxembourg’s ground forces. Effective CAS will help troops break through enemy positions and support them during battles."
 my_hoi4_mod_LUX_focus_tree_focus_35:0 "Fighter Focus"
 my_hoi4_mod_LUX_focus_tree_focus_35_desc:0 "Focus Luxembourg’s aviation industry on developing modern fighter aircraft. A capable fighter force will help secure the skies and protect the nation from enemy air power."
 my_hoi4_mod_LUX_focus_tree_focus_36:0 "The Army Europe Kneels Too"
 my_hoi4_mod_LUX_focus_tree_focus_36_desc:0 "With Luxembourg’s military strength now established, the nations of Europe are forced to take notice. Our growing army stands ready to challenge any power that dares oppose us."
 my_hoi4_mod_LUX_focus_tree_focus_37:0 "Aerial Research"
 my_hoi4_mod_LUX_focus_tree_focus_37_2:0 "Precarious Situation of the State"
 my_hoi4_mod_LUX_focus_tree_focus_37_2_desc:0 "Luxembourg finds itself in an increasingly precarious political situation as tensions rise across Europe. The government must now decide how to navigate these uncertain times and secure the nation’s future."
 my_hoi4_mod_LUX_focus_tree_focus_37_desc:0 "Expand research into aviation technology to develop faster, more capable, and more advanced aircraft. Continued innovation will keep Luxembourg’s air force competitive in modern warfare."
 my_hoi4_mod_LUX_focus_tree_focus_38:0 "Long Live the Republic"
 my_hoi4_mod_LUX_focus_tree_focus_38_desc:0 "Proclaim the strength and legitimacy of the Luxembourgish Republic as the nation enters a new political era. Rally the people behind republican values and build a stronger, more united state."
 my_hoi4_mod_LUX_focus_tree_focus_39:0 "Dominique Urbany Support"
 my_hoi4_mod_LUX_focus_tree_focus_39_desc:0 "Establish a strong communist party to challenge the existing political order in Luxembourg. Organise workers and build support for a new socialist future based on equality and collective ownership."
 my_hoi4_mod_LUX_focus_tree_focus_3_desc:0 "A major scientific breakthrough opens new possibilities for Luxembourg’s future. Harness this discovery to accelerate research and strengthen the nation’s position in the modern world."
 my_hoi4_mod_LUX_focus_tree_focus_4:0 "Research Slot I"
 my_hoi4_mod_LUX_focus_tree_focus_40:0 "Rally the Brown Shirts"
 my_hoi4_mod_LUX_focus_tree_focus_40_desc:0 "Mobilize veteran militias and radical nationalists to build the paramilitary core of Luxembourg's new order."
 my_hoi4_mod_LUX_focus_tree_focus_41:0 "Government Reforms"
 my_hoi4_mod_LUX_focus_tree_focus_41_desc:0 "Reallocate executive powers to balance internal political factions and enforce national legislative agendas"
 my_hoi4_mod_LUX_focus_tree_focus_42:0 "Continue Perpetual neutrality"
 my_hoi4_mod_LUX_focus_tree_focus_42_desc:0 "Maintain Luxembourg’s traditional policy of neutrality and avoid binding the nation to foreign alliances. By remaining independent, Luxembourg can pursue its own interests while staying out of Europe’s growing conflicts."
 my_hoi4_mod_LUX_focus_tree_focus_43:0 "Forge the Benelux Defensive Faction"
 my_hoi4_mod_LUX_focus_tree_focus_43_desc:0 "Unite Belgium, the Netherlands, and Luxembourg into a defensive alliance to protect the Low Countries from foreign aggression. Together, the Benelux nations can strengthen their borders and stand against any threat to their independence."
 my_hoi4_mod_LUX_focus_tree_focus_44:0 "Integrate the Belgians"
 my_hoi4_mod_LUX_focus_tree_focus_44_desc:0 "Integrate Belgium into a closer political and economic union with Luxembourg. By combining our resources, industries, and institutions, we can build a stronger and more unified Benelux state."
 my_hoi4_mod_LUX_focus_tree_focus_45:0 "Integrate the Dutch"
 my_hoi4_mod_LUX_focus_tree_focus_45_desc:0 "Integrate the Netherlands into a closer political and economic union with Luxembourg. Combining our resources and institutions will strengthen the Benelux state and create a more powerful united nation."
 my_hoi4_mod_LUX_focus_tree_focus_46:0 "Civilian Focus"
 my_hoi4_mod_LUX_focus_tree_focus_46_desc:0 "Focus on expanding Luxembourg’s civilian economy through new industries, infrastructure, and investment. A stronger civilian sector will provide the foundation for long-term growth and national prosperity."
 my_hoi4_mod_LUX_focus_tree_focus_47:0 "The Generous Investment"
 my_hoi4_mod_LUX_focus_tree_focus_47_desc:0 "Invest heavily in Belgium and the Netherlands to strengthen the economies of the Benelux nations. These investments will expand industry, improve infrastructure, and create a stronger foundation for mutual prosperity and defence."
 my_hoi4_mod_LUX_focus_tree_focus_48:0 "The New Benelux State"
 my_hoi4_mod_LUX_focus_tree_focus_48_desc:0 "Proclaim the creation of a new united Benelux state, bringing Luxembourg, Belgium, and the Netherlands together under one government. United resources, industry, and military strength will create a powerful new nation in Europe."
 my_hoi4_mod_LUX_focus_tree_focus_49:0 "Expansion of the Army"
 my_hoi4_mod_LUX_focus_tree_focus_49_desc:0 "Expand Luxembourg’s armed forces by recruiting more soldiers and increasing military resources. A larger army will strengthen national defence and provide greater capacity for future conflicts."
 my_hoi4_mod_LUX_focus_tree_focus_4_desc:0 "Expand Luxembourg’s scientific institutions to support a larger research effort. With additional resources and expertise, the nation can accelerate technological development and innovation."
 my_hoi4_mod_LUX_focus_tree_focus_5:0 "The Technological Powerhouse"
 my_hoi4_mod_LUX_focus_tree_focus_50:0 "Industrial Development"
 my_hoi4_mod_LUX_focus_tree_focus_50_desc:0 "Expand Luxembourg's industrial base through investment in new factories, infrastructure, and modern production methods. This will create a stronger foundation for future economic and military expansion."
 my_hoi4_mod_LUX_focus_tree_focus_51:0 "Prepare the Army"
 my_hoi4_mod_LUX_focus_tree_focus_51_desc:0 "Prepare Luxembourg’s army for the challenges ahead by improving training, equipment, and readiness. A well-prepared force will be ready to defend the nation when war arrives."
 my_hoi4_mod_LUX_focus_tree_focus_52:0 "Contribute to Industrial Research"
 my_hoi4_mod_LUX_focus_tree_focus_52_desc:0 "Contribute to industrial research to accelerate technological development and modernise Luxembourg’s industries. Cooperation between researchers and manufacturers will improve efficiency and strengthen the national economy."
 my_hoi4_mod_LUX_focus_tree_focus_53:0 "Defensive Spending"
 my_hoi4_mod_LUX_focus_tree_focus_53_desc:0 "Increase defence spending to strengthen Luxembourg’s military readiness and improve national security. Greater investment in equipment, fortifications, and training will prepare the nation for any threat."
 my_hoi4_mod_LUX_focus_tree_focus_54:0 "Military Construction"
 my_hoi4_mod_LUX_focus_tree_focus_54_desc:0 "Expand military construction to strengthen Luxembourg’s defensive infrastructure and support its growing armed forces. New facilities and fortifications will improve the nation’s ability to prepare for and withstand war."
 my_hoi4_mod_LUX_focus_tree_focus_55:0 "Efficient Production Lines"
 my_hoi4_mod_LUX_focus_tree_focus_55_desc:0 "Modernise Luxembourg’s factories with more efficient production lines and improved industrial methods. Greater efficiency will increase output while reducing the resources needed to maintain production."
 my_hoi4_mod_LUX_focus_tree_focus_56:0 "Miltaristic Focus"
 my_hoi4_mod_LUX_focus_tree_focus_56_desc:0 "Prioritise military expansion by investing in arms production, training, and defence infrastructure. A stronger military will ensure Luxembourg is prepared to protect its interests and face future threats."
 my_hoi4_mod_LUX_focus_tree_focus_57:0 "American Investments"
 my_hoi4_mod_LUX_focus_tree_focus_57_desc:0 "Attract American investment to Luxembourg to expand industry and accelerate economic growth. Foreign capital will provide the resources needed to modernise infrastructure and strengthen the nation’s economy."
 my_hoi4_mod_LUX_focus_tree_focus_58:0 "Focus on the French Threat"
 my_hoi4_mod_LUX_focus_tree_focus_58_desc:0 "Recognise the growing threat from France and prepare the Benelux for a potential conflict. Strengthen our defences and mobilise our resources to ensure the nation is ready to respond to French aggression."
 my_hoi4_mod_LUX_focus_tree_focus_59:0 "Focus on the German Threat"
 my_hoi4_mod_LUX_focus_tree_focus_59_desc:0 "Recognise the growing threat from Germany and prepare the Benelux for a potential conflict. Strengthen our defences, mobilise our resources, and ensure the nation is ready to withstand any German aggression."
 my_hoi4_mod_LUX_focus_tree_focus_5_desc:0 "Transform Luxembourg into a technological powerhouse through heavy investment in research, innovation, and advanced industries. A stronger scientific sector will give the nation a lasting technological advantage."
 my_hoi4_mod_LUX_focus_tree_focus_6:0 "Tourism Development"
 my_hoi4_mod_LUX_focus_tree_focus_60:0 "Defence Against Great Powers"
 my_hoi4_mod_LUX_focus_tree_focus_60_desc:0 "Prepare Luxembourg to defend itself against the great powers surrounding Europe. Strengthen the nation’s military, fortifications, and readiness to ensure its independence is not threatened."
 my_hoi4_mod_LUX_focus_tree_focus_61:0 "Assume the Liechtensteinian Claim"
 my_hoi4_mod_LUX_focus_tree_focus_61_desc:0 "Assert Luxembourg’s claim over Alaska and pursue the diplomatic recognition of this territorial ambition. Though unconventional, the claim would dramatically expand Luxembourg’s reach and international influence."
 my_hoi4_mod_LUX_focus_tree_focus_62:0 "Develop Alaska Industry"
 my_hoi4_mod_LUX_focus_tree_focus_62_desc:0 "Expand Alaska’s industrial base by investing in factories, infrastructure, and resource processing. This will turn Alaska into a major industrial centre and strengthen Luxembourg’s economic power."
 my_hoi4_mod_LUX_focus_tree_focus_63:0 "Develop Alaska Resource Deposits"
 my_hoi4_mod_LUX_focus_tree_focus_63_desc:0 "Expand Alaska’s resource deposits to increase the extraction of valuable materials and fuel industrial growth. Developing these resources will provide Luxembourg with a powerful new source of raw materials."
 my_hoi4_mod_LUX_focus_tree_focus_64:0 "Integrate Alaska"
 my_hoi4_mod_LUX_focus_tree_focus_64_desc:0 "Integrate Alaska fully into Luxembourg’s state administration and economy. Bringing the territory into the national system will secure its resources and strengthen Luxembourg’s position as a global power."
 my_hoi4_mod_LUX_focus_tree_focus_65:0 "Establishment of Trade Unions"
 my_hoi4_mod_LUX_focus_tree_focus_65_desc:0 "Establish trade unions to give workers greater representation and influence over working conditions. Organised labour will strengthen the working class and support the government’s economic reforms."
 my_hoi4_mod_LUX_focus_tree_focus_66:0 "Free Health Care"
 my_hoi4_mod_LUX_focus_tree_focus_66_desc:0 "Expand access to free healthcare for all citizens, ensuring that medical treatment is available regardless of wealth. A stronger public healthcare system will improve living standards and support a healthier workforce."
 my_hoi4_mod_LUX_focus_tree_focus_67:0 "Censorship of the Media"
 my_hoi4_mod_LUX_focus_tree_focus_67_desc:0 "Introduce state control over the media to limit opposition and maintain political stability. Censorship will allow the government to control the flow of information and strengthen its grip on the nation."
 my_hoi4_mod_LUX_focus_tree_focus_68:0 "Communist Takeover"
 my_hoi4_mod_LUX_focus_tree_focus_68_desc:0 "Seize control of the government and establish a communist regime in Luxembourg. The new leadership will reorganise the state around socialist principles and place the economy under greater public control."
 my_hoi4_mod_LUX_focus_tree_focus_69:0 "New Modern Tanks"
 my_hoi4_mod_LUX_focus_tree_focus_69_desc:0 "Develop a new generation of modern tanks with improved armour, mobility, and firepower. These vehicles will give Luxembourg’s army the strength needed to compete on the modern battlefield."
 my_hoi4_mod_LUX_focus_tree_focus_6_desc:0 "Invest in Luxembourg's natural beauty, cities, and cultural attractions to attract visitors from across Europe. A thriving tourism industry will bring wealth and international recognition to the nation."
 my_hoi4_mod_LUX_focus_tree_focus_7:0 "Rearm the Nation"
 my_hoi4_mod_LUX_focus_tree_focus_70:0 "Oversea Civilian Industry"
 my_hoi4_mod_LUX_focus_tree_focus_70_desc:0 "Expand Luxembourg’s civilian industry abroad, securing investments and production opportunities beyond the nation’s borders. These ventures will keep Luxembourg’s economy growing even as pressure mounts at home."
 my_hoi4_mod_LUX_focus_tree_focus_71:0 "Oversea Military Industry"
 my_hoi4_mod_LUX_focus_tree_focus_71_desc:0 "Expand military production overseas, securing additional sources of equipment and supplies. These investments will strengthen Luxembourg’s armed forces and help prepare for the conflicts ahead."
 my_hoi4_mod_LUX_focus_tree_focus_72:0 "Exiled Government Progress"
 my_hoi4_mod_LUX_focus_tree_focus_72_desc:0 "With Luxembourg fallen, establish an exile government abroad to preserve the nation’s leadership and legitimacy. From overseas, the government can coordinate resistance and work toward reclaiming the homeland."
 my_hoi4_mod_LUX_focus_tree_focus_73:0 "Liberation of our Homeland"
 my_hoi4_mod_LUX_focus_tree_focus_73_desc:0 "Begin preparations to reclaim Luxembourg and restore its independence. With the homeland within reach, the government in exile must rally its forces and supporters for the final push."
 my_hoi4_mod_LUX_focus_tree_focus_74:0 "The Two Year Plan"
 my_hoi4_mod_LUX_focus_tree_focus_74_desc:0 "Launch a two-year plan focused on rapidly expanding Luxembourg’s civilian industry. State investment will prioritise factories, infrastructure, and consumer production to build a stronger economic foundation."
 my_hoi4_mod_LUX_focus_tree_focus_75:0 "The Second Two Year Plan"
 my_hoi4_mod_LUX_focus_tree_focus_75_copy:0 "Third Two Year Plan"
 my_hoi4_mod_LUX_focus_tree_focus_75_copy_desc:0 "Launch a third two-year plan to continue Luxembourg’s economic and industrial expansion. Building on the success of previous plans, the state will further increase production, modernise infrastructure, and strengthen the national economy."
 my_hoi4_mod_LUX_focus_tree_focus_75_desc:0 "Launch a second two-year plan focused on expanding Luxembourg’s military capabilities. Investment will prioritise military infrastructure, logistics, and facilities needed to support a larger and more effective armed forces."
 my_hoi4_mod_LUX_focus_tree_focus_77:0 "Final Plan"
 my_hoi4_mod_LUX_focus_tree_focus_77_desc:0 "Launch the final long-term plan to place Luxembourg at the forefront of nuclear research. Massive state investment will accelerate scientific development and establish the foundations for a powerful nuclear programme."
 my_hoi4_mod_LUX_focus_tree_focus_78:0 "Follow the Stalinist Doctrine"
 my_hoi4_mod_LUX_focus_tree_focus_78_desc:0 "Adopt Stalinist doctrine and align Luxembourg’s communist government with the principles of centralised leadership and state-directed development. The nation will pursue rapid industrialisation, military strength, and tighter political control."
 my_hoi4_mod_LUX_focus_tree_focus_79:0 "Forge our Own Path"
 my_hoi4_mod_LUX_focus_tree_focus_79_desc:0 "Describe this focus.Reject Soviet domination and foreign doctrine to chart a distinct, self-reliant vision for Luxembourgish communism"
 my_hoi4_mod_LUX_focus_tree_focus_7_desc:0 "Strengthen Luxembourg's armed forces and expand military preparations. A modern and well-equipped army will ensure the nation is ready to defend its interests."
 my_hoi4_mod_LUX_focus_tree_focus_8:0 "Italian Tourism"
 my_hoi4_mod_LUX_focus_tree_focus_80:0 "Soviet Joint Development"
 my_hoi4_mod_LUX_focus_tree_focus_80_desc:0 "Strengthen cooperation with the Soviet Union through joint scientific and industrial development. Sharing expertise and resources will accelerate Luxembourg’s technological progress and deepen ties between the two communist nations."
 my_hoi4_mod_LUX_focus_tree_focus_81:0 "Call the Minor Revolutions in Europe"
 my_hoi4_mod_LUX_focus_tree_focus_81_desc:0 "\n\nSend covert arms, advisors, and funding to radical insurgencies in Ireland, Portugal, and Denmark to ignite secondary fronts and stretch imperialist forces thin across Europe.\n"
 my_hoi4_mod_LUX_focus_tree_focus_82:0 "Influence in the Benelux"
 my_hoi4_mod_LUX_focus_tree_focus_82_desc:0 "Infiltrate trade unions and fund sympathizers across Belgium and the Netherlands to bring Low Country socialism under Luxembourgish leadership."
 my_hoi4_mod_LUX_focus_tree_focus_83:0 "Dominate the Benelux"
 my_hoi4_mod_LUX_focus_tree_focus_83_desc:0 " dominate the benelux\n\nUnite Belgium and the Netherlands under our red banner, establishing Luxembourg as the supreme political and industrial heart of a unified Benelux commune."
 my_hoi4_mod_LUX_focus_tree_focus_84:0 "Demand Subjugation"
 my_hoi4_mod_LUX_focus_tree_focus_84_desc:0 "Issue a direct ultimatum to our neighbors: yield to our socialist vision and submit to Luxembourg's guidance, or face total revolutionary conquest."
 my_hoi4_mod_LUX_focus_tree_focus_85:0 "Volunteers From The State"
 my_hoi4_mod_LUX_focus_tree_focus_85_desc:0 "Send Luxembourgish volunteers abroad to support friendly nations and gain valuable combat experience. Their service overseas will strengthen Luxembourg’s military expertise and build closer ties with its allies."
 my_hoi4_mod_LUX_focus_tree_focus_86:0 "Integrate the Subjects"
 my_hoi4_mod_LUX_focus_tree_focus_86_desc:0 "Dismantle foreign state structures and directly absorb the Benelux territories into the central administrative and economic framework of our republic."
 my_hoi4_mod_LUX_focus_tree_focus_87:0 "Purge the Military"
 my_hoi4_mod_LUX_focus_tree_focus_87_desc:0 "Purge the military of officers considered disloyal to the communist government and restructure the armed forces under stricter political control. This will ensure greater loyalty to the state and its leadership."
 my_hoi4_mod_LUX_focus_tree_focus_88:0 "Influence the French Politics"
 my_hoi4_mod_LUX_focus_tree_focus_88_desc:0 "Funnel funds, propaganda, and organizers across the border to empower French communists, destabilizing the Paris government from within."
 my_hoi4_mod_LUX_focus_tree_focus_89:0 "Liberation of Europe"
 my_hoi4_mod_LUX_focus_tree_focus_89_desc:0 "\n\nLaunch the final, decisive offensive to shatter the remaining capitalist and fascist regimes, establishing a red, borderless continent united under Luxembourg's revolutionary guidance.\n"
 my_hoi4_mod_LUX_focus_tree_focus_9:0 "Brazilian Tourism"
 my_hoi4_mod_LUX_focus_tree_focus_90:0 "Influence the German Politics"
 my_hoi4_mod_LUX_focus_tree_focus_90_desc:0 "Fund underground anti-fascist cells and infiltrate factory councils across the Rhine to undermine Berlin's war machine and spark a worker's uprising inside the Reich."
 my_hoi4_mod_LUX_focus_tree_focus_91:0 "Beacon of Communism in Western Europe"
 my_hoi4_mod_LUX_focus_tree_focus_91_desc:0 "Position Luxembourg as the ultimate vanguard of Marxism in Western Europe, inspiring revolutionary movements from the English Channel to the Alps."
 my_hoi4_mod_LUX_focus_tree_focus_92:0 "The Cold War"
 my_hoi4_mod_LUX_focus_tree_focus_92_desc:0 "As tensions rise between the communist and capitalist blocs, Luxembourg must prepare for the beginning of a new global struggle. Strengthen the nation’s position and remain ready for the challenges of the Cold War."
 my_hoi4_mod_LUX_focus_tree_focus_93:0 "Build the Revolutionary Army"
 my_hoi4_mod_LUX_focus_tree_focus_93_desc:0 "Standardize military training, expand conscription across our integrated lands, and transform local militias into a formidable, modern Red Army."
 my_hoi4_mod_LUX_focus_tree_focus_94:0 "Form Greater Luxembourg"
 my_hoi4_mod_LUX_focus_tree_focus_94_desc:0 "Assert our historical claims over surrounding borderlands to reclaim ancestral territory and establish a formidable, expanded Grand Duchy."
 my_hoi4_mod_LUX_focus_tree_focus_95:0 "Create the New Order"
 my_hoi4_mod_LUX_focus_tree_focus_95_desc:0 "Sweep away the frail democratic institutions and codify a totalist regime, ensuring complete state control over every aspect of Luxembourgish society."
 my_hoi4_mod_LUX_focus_tree_focus_96:0 "Follow the New Order"
 my_hoi4_mod_LUX_focus_tree_focus_96_desc:0 "Establish an absolute state by enforcing strict ideological conformity, restructuring all public institutions under direct party oversight, and mobilizing the population to maintain total societal control."
 my_hoi4_mod_LUX_focus_tree_focus_97:0 "Axis Gold"
 my_hoi4_mod_LUX_focus_tree_focus_97_desc:0 "Seize and liquidate the strategic bullion reserves of foreign central banks to fully bankroll our rearmament programs and secure international war supplies"
 my_hoi4_mod_LUX_focus_tree_focus_98:0 "Operation Sealion"
 my_hoi4_mod_LUX_focus_tree_focus_98_desc:0 "Deploy combined naval and amphibious divisions across the Dover Strait to establish beachheads and force a rapid capitulation"
 my_hoi4_mod_LUX_focus_tree_focus_99:0 "Operation Barbarossa"
 my_hoi4_mod_LUX_focus_tree_focus_99_desc:0 "Amass vast reserves of fuel, munitions, and raw industrial metals to sustain high-intensity offensive operations"
 my_hoi4_mod_new_focus_tree_focus_1:0 "Industralisation of Luxembourg"
 my_hoi4_mod_new_focus_tree_focus_1_desc:0 "InModernise Luxembourg's economy by expanding its industrial base and investing in domestic production. This will lay the foundations for a stronger and more self-sufficient nation."
