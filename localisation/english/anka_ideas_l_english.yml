 Agrarian_Reform_Act:0 "Agrarian Reforms"
 Agrarian_Reform_Act_desc:0 "For centuries, the Baltic German barons have held a stranglehold on the most fertile lands, leaving the Latvian and Estonian peasantry landless and destitute. Duke Heinrich signs the Agrarian Reform Act, forcibly breaking up the vast estates and redistributing the land to the farmers who actually till it. It alienates his fellow nobles, but earns him the eternal loyalty of the rural masses."
 Riga_Diet_Convenes:0 "The Riga Diet Convenes"
 Riga_Diet_Convenes_desc:0 "To distance himself from the image of an absolute tyrant, Duke Heinrich has authorized the opening of the Riga Diet. By allowing delegates from the Baltic German aristocracy, the Latvian farmer's unions, and the Estonian provincial councils to voice their grievances, the Duke hopes to foster a spirit of cooperation. It is a risky gamble—giving the angry populace a microphone—but it is the only way to rule without relying solely on the bayonet."
