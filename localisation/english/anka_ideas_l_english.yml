l_english:
 Baltic_German_Ideas:0 "Unyielding Will"
 Baltic_German_Ideas_desc:0 "Duke Heinrich has stared into the abyss of Nazi tyranny and refused to blink. Having witnessed the horrors of the concentration camps and the moral rot of the Third Reich, the Duke has sworn that the Baltic soil will never bow to the swastika. Every soldier in the Duchy's army is instilled with his unbreakable resolve; when facing the German war machine, they do not fight merely for victory, but for the survival of their souls. The Wehrmacht will find no submissive subjects here, only a wall of iron and righteous fury."
 Manpower_1:0 "Calling Upon The Exiled Government"
 Manpower_1_desc:0 "With the throne in Riga firmly established, Duke Heinrich has sent emissaries to the courts of Europe, calling upon the displaced nobility, Baltic German barons, and loyalist retainers scattered across the continent. Though their ancestral lands may have been lost to revolution or republicanism, their loyalty to the crown remains absolute. Answering the Duke's summons, these exiled aristocrats and their private retinues are flocking to the United Baltic Duchy, offering their swords, their wealth, and their sons to the defense of the new realm."
 Manpower_2:0 "Offensive Prepartions"
 Manpower_2_desc:0 "The maps in the Riga war room are being redrawn. Before we can issue our ultimatums to the north, our armed forces must be primed for a swift, decisive offensive. The Duke has ordered the rapid expansion of our officer corps, the stockpiling of munitions, and relentless drilling of our infantry in breakthrough tactics. When the time comes to unite the Baltic coast, our army must strike like lightning, overwhelming our neighbors before the great powers can intervene."
 Unyielding_Will_desc:0 "Duke Heinrich has stared into the abyss of Nazi tyranny and refused to blink. Having witnessed the horrors of the concentration camps firsthand, the Duke has sworn that the Baltic soil will never bow to the swastika. Our troops are drilled relentlessly in anti-Wehrmacht tactics, knowing that surrender to Hitler means annihilation."
